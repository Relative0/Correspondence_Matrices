<script>
/* ============================================================== EXPERT CUT
   Derived from the master page. Charts and provenance first, prose only where
   it changes an interpretation. Every figure is the same object the master
   renders, from the same data, so the two cannot drift. */

const C = DATA._content;
const M = DATA._campaign;
const A = DATA.e21_current_architecture;
const app = document.getElementById("app");
const metric = token => P(`{{${token}}}`);

document.body.prepend(topbar({
  brand: "Correspondence Matrices <span>· technical summary</span>",
  links: [["index.html", "← full knowledge base"], ["#x0", "Current map"], ["#x1", "Kernel"], ["#x2", "Boundary"],
          ["#x3", "Economics"], ["#x4", "Symbolic"], ["#x5", "Protocol"],
          ["#x6", "Corrections"], ["#x7", "Open"], ["#x8", "Provenance"],
          ["usecases.html", "CM use cases"]],
}));

app.append(h("header", { class: "page" }, [
  h("h1", { text: "Correspondence Matrices — technical summary" }),
  h("p", { class: "lede", text:
    "The 2026-08-03 campaign plus a 2026-09-04 current-source, non-neural architecture addendum. Every " +
    "result is labelled by task and environment; historical and current measurements are never pooled." }),
  h("p", { class: "meta", html:
    `Evidence revision <code>${M.evidence_revision.slice(0, 7)}</code> · campaign revision <code>${M.campaign_revision.slice(0, 7)}</code> · ` +
    `local box ${M.local_env.platform}, ${M.local_env.cpu}, Python ${M.local_env.python}, numpy ${M.local_env.numpy} · ` +
    `pods Linux/AMD EPYC cpu3c, all terminated · campaign spend ${FMT.usd(M.cost_usd)} of $${M.cost_cap_usd.toFixed(2)} cap · ` +
    `tests ${M.tests}` }),
]));

app.append(banner("note", "Reading conventions enforced throughout", [
  "<b>live_k on every workload axis</b>, never nominal namespace size — verified, not assumed. " +
  "<b>Construction and evaluation never merged</b> into a single ranking. " +
  "<b>Blocked and round-robin never pooled.</b> " +
  "<b>CM vs CSE-flat is workload-scoped</b>: B1/E3 and EPFL are parity evidence; symmetric V3 is a separate " +
  "bare-program win whose public wrapper remains slower. " +
  "<b>Superseded figures appear only in §6</b>, struck through.",
  "Every timed comparison is gated on bit-for-bit output agreement across all arms before any measurement " +
  "is recorded. Every summary statistic below was recomputed from raw per-formula rows by the build script " +
  "that generated this page; none is copied from a report's prose.",
]));

app.append(featureModelAuditUpdate());
app.append(currentEvidenceUpdate("expert"));

/* ------------------------------------------------------------ current architecture */
{
  const s = section("x0", "Current", "Current architecture task map — 2026-09-04",
    "Exact non-neural comparisons on frozen output contracts. This section supplements the dated campaign " +
    "below; it does not pool unlike hosts, train a selector, or change a production default.");
  s.append(h("p", { class: "meta", html:
    `Architecture-comparison freeze <code>${A.source_freezes.architecture_comparison_sha256}</code> · ` +
    `query-ladder freeze <code>${A.source_freezes.query_ladder_sha256}</code>` }));

  s.append(banner("warn", "How to read the retained Windows result", [
    P("The {{arch.native.windows.single}} figure remains the original Windows/MSVC C37 result for one " +
      "specific q64 contract: native fused slots versus Python R2 on the frozen single-root workload. " +
      "The exact Linux/GCC replication measured {{arch.native.linux.single}}, but its slowest case was " +
      "{{arch.native.linux.single_min}}. That failed the predeclared 0.95× case floor, so native remains " +
      "guarded/opt-in. Neither number is a universal CM headline."),
    "CSE-flat and direct BitSet are comparison controls, not CM-family members. Python R2, packed/recursive " +
    "CM, and native fused slots are CM-family implementations with different construction and query costs.",
  ]));

  s.append(h("h3", { text: "Frozen native portability check — q64 only" }));
  s.append(h("div", { class: "tablewrap" }, [
    table(["environment", "single-root native / R2", "slowest single-root case",
           "multi-root union / separate", "slowest multi-root workload"],
      A.native_portability.rows.map(r => [
        r.environment,
        metric(r.single_token),
        metric(r.single_min_token),
        metric(r.multi_token),
        metric(r.multi_min_token),
      ]), "wrap")
  ]));
  s.append(h("p", { class: "claim", html: P(
    "The Windows multi-root result remains {{arch.native.windows.multi}} and the Linux replication was " +
    "{{arch.native.linux.multi}}. Both are favorable for union sharing, while only the Linux single-root " +
    "replication exposes the cross-machine gate failure. These are frozen C37/C38 results, not replacements " +
    "for the current-source comparisons below.") }));

  s.append(h("h3", { text: "Current-source comparisons — use the task, not one global ranking" }));
  s.append(h("div", { class: "tablewrap" }, [
    table(["task contract", "what the measured comparison says", "supported use"], [
      ["Complete explicit relation",
       P("Best fixed CM (<code>cm_ir_recursive_packed</code>) was {{arch.complete.cm_over_dense}} " +
         "[{{arch.complete.cm_over_dense_lo}}, {{arch.complete.cm_over_dense_hi}}] over dense CM, but " +
         "{{arch.complete.cm_over_bitset}} [{{arch.complete.cm_over_bitset_lo}}, " +
         "{{arch.complete.cm_over_bitset_hi}}] versus direct BitSet. BitSet won " +
         "{{arch.complete.bitset_wins}}/{{arch.complete.cases}} cases."),
       "Packed/recursive CM improves the CM baseline; direct BitSet remains the complete-vector choice on this lane."],
      ["Repeated restrictions",
       "The separately timed ladder below keeps Python R2 at q1/q4 on both hosts, straddles at q16, and " +
       "selects CSE-flat bigint at q64 on both hosts.",
       "Route by query-count contract; do not infer a universal native crossover."],
      ["Related multi-root outputs",
       P("On the broader one-host Lane C, sharing-aware union was {{arch.multi.python_union.speedup}} " +
         "[{{arch.multi.python_union.lo}}, {{arch.multi.python_union.hi}}] over separate Python roots and " +
         "{{arch.multi.native_union.speedup}} [{{arch.multi.native_union.lo}}, " +
         "{{arch.multi.native_union.hi}}] over separate native arenas, with all " +
         "{{arch.multi.cases}} cases favoring each union arm. Native union versus Python union was " +
         "{{arch.multi.native_vs_python.speedup}} [{{arch.multi.native_vs_python.lo}}, " +
         "{{arch.multi.native_vs_python.hi}}]."),
       "Share related outputs; do not turn near-parity native/Python evidence into native-superiority wording."],
      ["Smaller task-specific queries",
       "Natural CNF or SAT controls were the fixed winners for exact count, SAT status, witnesses, " +
       "equivalence deltas, partial contexts, version history, and structural reload.",
       "Keep CM as an exact diagnostic/reference representation where useful, not a replacement for every task path."],
    ], "wrap")
  ]));

  s.append(h("h3", { text: "Repeated-restriction query ladder — within-host speedup over Python R2" }));
  s.append(h("p", { html: P(
    `${A.query_ladder.hosts[0]} and ${A.query_ladder.hosts[1]} each completed ` +
    "{{arch.ladder.rows_per_host}} verified rows. Absolute timings are not compared between the unlike " +
    "CPUs, and the CPU and compiler changed together, so their separate causal effects cannot be identified.") }));
  s.append(h("div", { class: "tablewrap" }, [
    table(["q", "GCC best fixed", "Clang best fixed", "CSE-flat/R2 · GCC → Clang",
           "native/R2 · GCC → Clang", "native minimum · GCC → Clang"],
      A.query_ladder.rows.map(r => [
        String(r.query_count),
        `<code>${r.gcc_best}</code>`,
        `<code>${r.clang_best}</code>`,
        `${metric(r.gcc_cse_token)} → ${metric(r.clang_cse_token)}`,
        `${metric(r.gcc_native_token)} → ${metric(r.clang_native_token)}`,
        `${metric(r.gcc_native_min_token)} → ${metric(r.clang_native_min_token)}`,
      ]), "wrap")
  ]));
  s.append(h("p", { class: "claim", html: P(
    "At q16, CSE-flat was {{arch.ladder.q16.gcc.cse}} on GCC but {{arch.ladder.q16.clang.cse}} on " +
    "Clang: a threshold straddle, not a portable crossover. At q64 it was " +
    "{{arch.ladder.q64.gcc.cse}} and {{arch.ladder.q64.clang.cse}}, won " +
    "{{arch.ladder.q64.gcc.cse_wins}} and {{arch.ladder.q64.clang.cse_wins}} of " +
    "{{arch.ladder.q64.cases}} cases, and kept " +
    "minimums of {{arch.ladder.q64.gcc.cse_min}} and {{arch.ladder.q64.clang.cse_min}}.") }));
  s.append(h("p", { class: "claim", html: P(
    "Native q64 remained cohort-dependent: the observed C36 cohort was {{arch.ladder.q64.gcc.native_observed}} " +
    "→ {{arch.ladder.q64.clang.native_observed}}, while the fresh cohort was " +
    "{{arch.ladder.q64.gcc.native_fresh}} → {{arch.ladder.q64.clang.native_fresh}}. This is why the " +
    "aggregate native result is shown without promoting it to a default.") }));

  s.append(h("h3", { text: "Smaller queries — fixed task-matched winner over the CM arm" }));
  s.append(h("div", { class: "tablewrap" }, [
    table(["task / lifecycle", "fastest fixed backend", "winner speedup over CM"],
      A.small_queries.rows.map(r => [
        `<code>${r.task}</code>`,
        `<code>${r.winner}</code>`,
        metric(r.over_cm_token),
      ]), "wrap")
  ]));

  s.append(banner("note", "Boundary of this update", [
    P("Both query-ladder hosts recorded {{arch.ladder.memory_nonzero_rows}} rows with nonzero incremental " +
      "child RSS. That field therefore cannot calibrate a memory router or support a memory-win claim."),
    "No neural training or selector fit was performed; no production routing changed; no universal native " +
    "default or universal break-even point is claimed. This local website change is distinct from publication.",
  ]));

  const provenance = h("details", { class: "prov" });
  provenance.append(h("summary", { text: "Current architecture evidence files" }));
  const sources = h("ul");
  A.provenance.forEach(src => sources.append(h("li", {}, [
    h("a", { href: src.href, text: src.label }),
    document.createTextNode(" — " + src.scope),
  ])));
  provenance.append(sources);
  s.append(provenance);
  app.append(s);
}

/* ------------------------------------------------------------ verdicts */
{
  const s = section("verdicts", "0", "Campaign verdicts", null);
  s.append(h("div", { class: "tablewrap" }, [
    table(["leg", "verdict"], Object.entries(M.verdicts).map(([k, v]) => [k, v]), "wrap")]));
  s.append(h("div", { class: "tablewrap" }, [
    table(["corpus", "SHA-256"], Object.entries(M.corpora_sha256).map(([k, v]) => [k, `<code>${v}</code>`]), "wrap")]));
  app.append(s);
}

/* ------------------------------------------------------------ kernel */
{
  const s = section("x1", "1", "Kernel-level results",
    "Two arms, three scopes, never pooled. Each row carries its own resampling unit.");
  s.append(FIG.kernelForest());
  s.append(FIG.flatForest());
  s.append(techBlock([
    "Mechanism, stated as a falsifiable prediction rather than a post-hoc explanation: CM's advantage over " +
    "a plain CSE comes from n-ary instruction merging over associative operator chains. On a corpus with no " +
    "mergeable chains beyond what flattening already captures, the mechanism predicts parity. The external " +
    "corpus is AND/INV form — every gate binary — and the instruction-count and executed-operation ratios " +
    "against CSE-flat are both exactly {{mech.instr_ratio}}. Parity was predicted and parity was measured.",
    "The residual against CSE-flat is {{flat.local}} locally, {{flat.epfl}} externally and " +
    "{{flat.pod.min}}–{{flat.pod.max}} across pods — straddling parity in both directions. A quantity whose " +
    "sign is not stable across scopes is reported as equivalence.",
  ], null));
  s.append(FIG.strata());
  s.append(FIG.epflCircuits());
  s.append(FIG.pods());
  app.append(s);
}

/* ------------------------------------------------------------ boundary */
{
  const s = section("x2", "2", "Wrapper boundary and workload axis",
    "The end-to-end call, its overhead decomposition, the irrelevance of ambient namespace size, and the " +
    "explicit-output guard.");
  s.append(FIG.wrapperRatio());
  s.append(FIG.wrapperCost());
  s.append(FIG.ambientN());
  s.append(FIG.guard());
  app.append(s);
}

/* ------------------------------------------------------------ economics */
{
  const s = section("x3", "3", "Preparation and break-even economics",
    "Compilation scaling, then the break-even distributions with their baselines matched.");
  s.append(FIG.compileScaling());
  s.append(FIG.breakeven());
  s.append(techBlock([
    "Break-even is the preparation premium divided by the per-evaluation kernel gain. Never-break-even " +
    "classification depends only on the sign of that gain; preparation cost scales the finite counts but " +
    "plays no part in the classification. Matched-baseline pairs: synthetic vs plain CSE median " +
    "{{be.syn.median}} ({{be.syn.never}}/{{be.syn.total}} never, prep {{be.syn.prep}}) against EPFL vs " +
    "plain CSE median {{be.epfl.median.matched}} ({{be.epflcse.never}}/{{be.epfl.total}} never, prep " +
    "{{be.epflcse.prep}}). The EPFL-vs-CSE-flat arm — median {{be.epfl.median}}, {{be.epfl.never}}/" +
    "{{be.epfl.total}} never, prep {{be.epfl.prep}} — is a different baseline and is never paired with the " +
    "synthetic figure.",
  ], null));
  s.append(FIG.engines());
  app.append(s);
}

/* ------------------------------------------------------------ symbolic */
{
  const s = section("x4", "4", "Symbolic construction and extraction",
    "Construction and evaluation as separate panels, then order sensitivity. The two runs use different " +
    "build-window conventions and are never plotted on a shared axis.");
  s.append(FIG.cudd());
  s.append(FIG.cuddOrders());
  app.append(s);
}

/* ------------------------------------------------------------ protocol */
{
  const s = section("x5", "5", "Protocol and measurement discipline",
    C.discipline.lede);
  s.append(FIG.schedule());
  s.append(FIG.auditLadder());
  {
    const t = h("div", { class: "tablewrap" });
    t.append(table(["rule", "technical statement", "failure mode it prevents"],
      C.discipline.rules.map(r => [r.rule, P(r.technical_explanation), P(r.what_goes_wrong_without_it)]), "wrap"));
    s.append(t);
  }
  app.append(s);
}

/* ------------------------------------------------------------ corrections */
{
  const s = section("x6", "6", "Corrections of record and open discrepancies",
    "Every superseded figure, with the mechanism of the error. These appear nowhere else on this page.");
  s.append(moreBlock([FIG.correctionsTable()], "View corrections ledger"));
  s.append(h("h3", { text: "Discrepancies between summary prose and raw evidence" }));
  s.append(h("p", { text:
    "Found while re-reading every number from its source file for this page. Neither changes a campaign " +
    "verdict; both change how a sentence should be worded." }));
  s.append(FIG.discrepancies());
  s.append(FIG.flagsBlock());
  app.append(s);
}

/* ------------------------------------------------------------ open */
{
  const s = section("x7", "7", "Open frontier", C.frontier.lede);
  s.append(FIG.frontierMap());
  s.append(FIG.roadmap());
  C.frontier.items.forEach(it => {
    const c = h("div", { class: "card" });
    c.append(h("h2", { style: "font-size:16.5px" }, [
      document.createTextNode(it.title + " "),
      h("span", { class: "pill " + (it.status === "partially-answered" ? "ok" : "open"),
                  text: it.status.replace(/-/g, " ") })]));
    c.append(techBlock(it.technical_statement, null));
    c.append(moreBlock([
      h("p", { class: "claim", html: "<b>Why it matters.</b> " + P(it.why_it_matters) }),
      h("p", { class: "claim", html: "<b>Success / failure interpretation.</b> " + P(it.what_would_change_the_picture) }),
    ], "Why it matters"));
    if (it.sources && it.sources.length) {
      const d = h("details", { class: "prov" });
      d.append(h("summary", { text: "Where this is written down" }));
      const ul = h("ul");
      it.sources.forEach(x => ul.append(h("li", { html: `<code>${x}</code>` })));
      d.append(ul);
      c.append(d);
    }
    s.append(c);
  });
  s.append(h("h3", { text: "Closed by this campaign" }));
  s.append(h("div", { class: "tablewrap" }, [
    table(["question", "how it was closed", "result"],
      C.frontier.closed.map(x => [x.title, P(x.how), P(x.result)]), "wrap")]));
  app.append(s);
}

/* ------------------------------------------------------------ provenance */
{
  const s = section("x8", "8", "Provenance and scope limits", null);

  s.append(h("h3", { text: "Every named figure on this site, with the file and field it came from" }));
  s.append(h("p", { text:
    "The build script reads each of these from an evidence file and refuses to build if any prose token has " +
    "no backing entry. Hovering a bold figure anywhere on this site shows the same string." }));
  {
    const rows = Object.entries(DATA._numbers)
      .sort(([a], [b]) => a.localeCompare(b))
      .map(([k, v]) => [`<code>${k}</code>`, (FMT[v.fmt] || FMT.text)(v.value), `<code>${v.prov}</code>`]);
    const d = h("details");
    d.append(h("summary", { text: `Named-number provenance table (${rows.length} entries)` }));
    d.append(h("div", { class: "tablewrap" }, [table(["token", "value", "source"], rows, "wrap")]));
    s.append(d);
  }

  s.append(h("h3", { text: "Environment" }));
  s.append(h("div", { class: "tablewrap" }, [
    table(["what", "value"], [
      ["Local platform", M.local_env.platform],
      ["Local CPU", M.local_env.cpu],
      ["Local Python / numpy", M.local_env.python + " / " + M.local_env.numpy],
      ["Pod CPU", DATA.e12_cudd.pod.cpu_model],
      ["Pod platform", DATA.e12_cudd.pod.platform],
      ["Pod flavour / vCPU", DATA.e12_cudd.pod.flavor + " / " + DATA.e12_cudd.pod.vcpu],
      ["Decision-diagram library", "CUDD " + DATA.e12_cudd.pod.cudd_version + " via native dd.cudd (" + DATA.e12_cudd.pod.dd_cudd + ")"],
      ["Matched-run conventions", DATA.e12_cudd.pod.conventions],
      ["External corpus source", `<code>${M.epfl_source.url}</code> at <code>${M.epfl_source.commit}</code> — staged or committed: ${M.epfl_source.staged_or_committed}`],
      ["Test suite", M.tests],
      ["Campaign cloud spend", FMT.usd(M.cost_usd) + " of $" + M.cost_cap_usd.toFixed(2) + " cap; all pods terminated: " + M.all_pods_terminated],
    ], "wrap")]));

  s.append(h("h3", { text: "Scope limits" }));
  s.append(h("ul", { html: P(
    "<li>One synthetic generator and one external circuit family. The external corpus is AND/INV form — " +
    "precisely the case where the merging mechanism predicts parity. Informative as a mechanism test; not a " +
    "sample of all real workloads.</li>" +
    "<li>No BDD-hard or deliberately order-sensitive families measured. At {{bx2.max_nodes}} nodes and " +
    "below, dynamic reordering never triggers, so the order question is answered only where ordering barely " +
    "matters.</li>" +
    "<li>Bounded direct kernels above live_k = {{guard.k}} completed exactly, but the supported public wrapper " +
    "refused every case. This is feasibility evidence, not an above-guard public speed claim.</li>" +
    "<li>No real deployed workload measured. Reuse counts — the decision variable for the entire cost " +
    "argument — have never been observed in production, only computed as break-even thresholds.</li>" +
    "<li>Current CM keys provide engineering identity under documented normalization and collision assumptions; " +
    "they are not a theorem of global semantic canonicality.</li>" +
    "<li>Wrapper-boundary, guard, engine-crossover and order-sensitivity runs are blocked-schedule only and " +
    "say so; only the kernel experiment, its replay, the pod replication and the external validation measure " +
    "both schedules.</li>") }));

  s.append(h("h3", { text: "Regenerating this page" }));
  s.append(h("p", { html:
    "<code>.venv\\Scripts\\python.exe deliverables_n22_24\\master_explainer_2026_08_03\\cm_master_build_2026_08_03.py</code>" +
    " — reads the evidence files, re-derives every figure, validates every prose token against a backing " +
    "measurement, and regenerates all four pages. No benchmark is re-run; no evidence file is opened for " +
    "writing." }));

  const nav = h("div", { class: "pagenav" });
  [
    ["index.html", "The full knowledge base", "The same evidence with the explanatory layers restored."],
    ["usecases.html", "CM Use Cases", "Field-specific hypotheses, alternatives, and proof requirements."],
    ["investor.html", "Investor Brief", "Problem breadth, evidence chain, roadmap."],
    ["layperson.html", "Simple One-Pager", "The plain-language route through the same evidence."],
  ].forEach(([href, t, d]) => nav.append(h("a", { href }, [h("b", { text: t }), h("span", { text: d })])));
  s.append(nav);
  app.append(s);
}

app.append(pageFooter("Expert cut of the master knowledge base. Identical figures from identical data — " +
  "both pages render the same chart objects from the same generated payload, so they cannot drift apart."));
</script>
