<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Correspondence Matrices — data and downloads</title>
<meta name="description" content="Reviewed, commit-pinned CM evidence, result tables, audit records, verifiers and tests with SHA-256 checksums.">
<meta property="og:title" content="Correspondence Matrices — data and downloads">
<meta property="og:description" content="Immutable evidence files behind the published CM findings.">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="og.png">
<style>/*__CM_CSS__*/</style>
</head>
<body>
<main id="app">
  <section class="sec">
    <h1>Data and downloads</h1>
    <p>This source template is populated by the site builder. <a href="data-downloads.html">Open the generated page</a>.</p>
  </section>
</main>
<script>
const IS_SOURCE_TEMPLATE = /(?:^|\/)cm_downloads_template\.html$/i.test(location.pathname);
if (IS_SOURCE_TEMPLATE) location.replace("data-downloads.html");
const DATA = IS_SOURCE_TEMPLATE ? { _numbers: {} } : /*__CM_DATA__*/null;
</script>
<script>
/*__CM_LIB__*/
</script>
<script>
if (!IS_SOURCE_TEMPLATE) {
const E = DATA.e24_downloads;
const app = document.getElementById("app");
app.replaceChildren();
document.body.prepend(topbar({
  brand: "Correspondence Matrices <span>· data & downloads</span>",
  links: [["index.html", "Full knowledge base"], ["layperson.html", "Simple One-Pager"],
          ["investor.html", "Investor overview"], ["expert.html", "Technical Summary"], ["usecases.html", "CM Use Cases"],
          ["feature-model-evidence.html", "Results & audit"], ["learning-neural-evidence.html", "Learning & neural"]],
}));

const formatBytes = value => value < 1024 ? `${value} B`
  : value < 1024 * 1024 ? `${(value / 1024).toFixed(1)} KiB`
  : `${(value / (1024 * 1024)).toFixed(1)} MiB`;

function artifactTable(records, label) {
  const table = h("table", { class: "download-table", "aria-label": label });
  table.append(h("thead", {}, [h("tr", {}, ["Artifact", "Role and contract", "Host / split", "Integrity", "Reuse review", "Links"].map(text => h("th", { scope: "col", text })))]));
  const body = h("tbody");
  records.forEach(record => body.append(h("tr", {}, [
    h("td", {}, [h("strong", { text: record.name }), h("code", { text: record.path })]),
    h("td", {}, [h("strong", { text: record.role }), document.createTextNode(` — ${record.contract}`)]),
    h("td", { text: record.scope }),
    h("td", {}, [h("span", { text: formatBytes(record.bytes) }), h("code", { text: `SHA-256 ${record.sha256}` })]),
    h("td", {}, [h("span", { text: record.license }), h("span", { text: record.privacy })]),
    h("td", {}, [h("a", { href: record.view, text: "View" }), document.createTextNode(" · "), h("a", { href: record.raw, download: record.name, text: "Raw" })]),
  ])));
  table.append(body);
  return h("div", { class: "download-scroll", tabindex: "0", role: "region", "aria-label": label }, [table]);
}

app.append(h("header", { class: "page" }, [
  h("p", { class: "eyebrow", text: `Website reviewed · ${DATA._freshness.reviewed}` }),
  h("h1", { text: "Data & downloads" }),
  h("p", { class: "lede", text: "Current result summaries and the September 15 multi-host confirmation are included with this site and checked against sealed research sources. Earlier evidence sets retain their original immutable commit links." }),
  h("p", { class: "meta", text: `${E.artifact_count} earlier commit-pinned files, plus current source summaries and the 24-file confirmation bundle below · commit ${E.revision}` }),
]));
app.append(latestResultsUpdate());

{
  const current = DATA.e25_latest_results;
  const s = section("current-results", `Current results · ${current.reviewed}`, "Download the exact data behind the latest graphs",
    "These files are shipped with the website. Their checksums identify the same source summaries used to build its graphs; new results are never linked to an older commit where they do not exist.");
  s.append(h("p", {}, [h("a", { href: "results/2026-09-16/current-results.json", download: "current-results.json", text: "Complete chart-ready snapshot (all cases and refusals)" })]));
  s.append(h("p", {}, [h("a", { href: "results/2026-09-16/full-site-data.json", download: "full-site-data.json", text: "All website data, including every earlier study chart and numerical token" })]));
  s.append(h("p", {}, [h("a", { href: "results/2026-09-16/chart-freshness.json", download: "chart-freshness.json", text: "Chart inventory, measurement dates and source checksums" }), " Older text-source checksums normalize CRLF to LF, as labelled in the inventory. Current downloadable evidence checksums verify the exact file bytes."]));
  const records = Object.entries(current.sources).map(([key, source]) => ({
    name: key+".json", path: source.path, role: source.role, contract: "See the named task and timing boundary in Latest results",
    scope: "Measured "+source.measured, bytes: source.bytes, sha256: source.sha256,
    license: "Research evidence; upstream/project rights remain as documented", privacy: "Selected numerical evidence; no operational cloud bundle",
    view: source.href, raw: source.href,
  }));
  s.append(artifactTable(records, "Current source summaries"));
  app.append(s);
}

{
  const confirmation = DATA.e25_latest_results.post_integration_confirmation;
  const s = section("september-16-confirmation", `Measured ${confirmation.measured} · reviewed ${confirmation.published_review}`,
    "Post-integration performance confirmation",
    "Original B2/B4 and corrected-E3 schedules on three Windows workers and one disposable Linux CPU host. The manifest drives this index and the publication verifier checks every listed byte.");
  s.append(tiles([
    ["Artifacts", String(confirmation.manifest.artifact_count), "raw data, analyses, environment records, report, protocol, and verification"],
    ["Source commit", confirmation.source_commit.slice(0, 12), "immutable code and frozen corpora"],
    ["Manifest", "SHA-256", confirmation.manifest_sha256.slice(0, 12)+"…; full identity in the manifest"],
    ["Accepted exact rows", "1,824", "792 + 264 B2/B4; 576 + 192 corrected-E3"],
  ]));
  s.append(banner("warn", "What this evidence says", [
    "The current bare CM kernel advantage reproduced on Windows and Linux.",
    "The whole-call wrapper ratio is less favorable than the historical ratio even though absolute wrapper time improved.",
    "Break-even remains a machine-specific planning estimate.",
  ]));
  s.append(h("div", { class: "benchmark-downloads" }, [
    h("a", { href: confirmation.report_href, text: "Read the report" }),
    h("a", { href: confirmation.protocol_href, text: "Read the reproduction protocol" }),
    h("a", { href: confirmation.verification_href, text: "Download verification" }),
    h("a", { href: confirmation.manifest_href, text: "Download manifest" }),
  ]));
  const records = confirmation.manifest.artifacts.map(record => ({
    name: record.name, path: record.href, role: record.role, contract: record.contract,
    scope: record.scope, bytes: record.bytes, sha256: record.sha256,
    license: record.license, privacy: record.privacy, view: record.href, raw: record.href,
  }));
  s.append(artifactTable(records, "September 15 confirmation artifacts"));
  app.append(s);
}

{
  const R = DATA.e25_latest_results.september16_research;
  const s = section("september-16-research", "September 16 research source", "Exact counting and decomposition downloads",
    "Download the exact-count prototype and benchmark, C39–C41 analysis and adapter code, cut-fusion code, tests, and aggregate results. This explicit allowlist excludes third-party corpus vectors and native binaries. The source ZIP is a repository overlay, not a standalone installation.");
  s.append(h("div", { class: "benchmark-downloads" }, [
    h("a", { href: "latest-results.html#exact-count-and-decomposition", text: "Read the findings" }),
    h("a", { href: R.report_href, text: "Report and reproduction scope" }),
    h("a", { href: R.bundle_href, download: "research-source-and-evidence.zip", text: "Download all source and evidence" }),
    h("a", { href: R.manifest_href, text: "SHA-256 manifest" }),
  ]));
  s.append(artifactTable(R.artifacts.map(record => ({
    name: record.path, path: record.href, role: record.role,
    contract: "Research source / scoped aggregate evidence", scope: "September 16 measured studies; see report for limits",
    bytes: record.bytes, sha256: record.sha256,
    license: "No new license grant; dd patch includes BSD-3-Clause DD-LICENSE",
    privacy: "Explicit source/evidence allowlist; no corpus vectors or operational credentials",
    view: record.href, raw: record.href,
  })), "September 16 Python files and evidence"));
  app.append(s);
}

{
  const s = section("scope", "Publication contract", "Pinned evidence, visible boundaries",
    "Every View and Raw link below targets the reviewed commit, not a moving branch. The latest repository is offered separately and may contain newer, unaudited work.");
  s.append(tiles([
    ["Reviewed commit", E.revision.slice(0, 12), "immutable source for every listed artifact"],
    ["Reviewed files", String(E.artifact_count), "explicit allowlist; no directory dumps"],
    ["Candidate inventory", String(E.candidate_artifact_count), "complete inventory remains downloadable for audit"],
    ["Evidence sets", String(E.sets.length), "audit, results, verifiers and tests"],
    ["Checksums", "SHA-256", "computed from the LF-normalized Git content"],
  ]));
  s.append(banner("warn", "Reuse and privacy boundary", [E.license_status, E.privacy_status]));
  s.append(h("div", { class: "benchmark-downloads" }, [
    h("a", { href: `${E.repository}/tree/${E.revision}`, text: "Browse the reviewed commit" }),
    h("a", { href: E.latest_repository, text: "Open the latest repository (may be newer)" }),
  ]));
  app.append(s);
}

E.sets.forEach(group => {
  const s = section(group.id, "Reviewed evidence set", group.title, group.description);
  s.append(artifactTable(group.artifacts, `${group.title} downloadable artifacts`));
  s.append(h("p", { class: "meta", text: `${group.artifacts.length} files. “Raw” downloads the exact reviewed Git content; “View” opens the same revision with repository context.` }));
  app.append(s);
});

app.append(h("footer", { class: "footer" }, [
  h("p", { text: `Earlier commit-pinned download index reviewed ${E.reviewed} at ${E.revision}.` }),
  h("p", {}, [h("a", { href: "index.html", text: "Return to the knowledge base" })]),
]));
}
</script>
</body>
</html>
