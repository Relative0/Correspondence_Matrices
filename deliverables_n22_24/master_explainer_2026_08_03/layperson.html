t_it":"Without a threshold fixed in advance, any result can be narrated as a success. Pre-registration is what makes a negative result informative instead of merely disappointing.","sources":["deliverables_n22_24/CM_GAP_EPFL_PROTOCOL_2026-08-03.md","deliverables_n22_24/CM_GAP_EPFL_VALIDATION_2026-08-03.md §3"]},{"rule":"Confidence intervals are clustered on the right unit","lay_explanation":"If you time the same expression seven times, you have not measured seven expressions — you have measured one, seven times. Treating those as seven independent facts makes your error bars look far tighter than they are. Every interval on this site is built by resampling the thing that is actually independent.","technical_explanation":"The inferential unit is the formula, the cell, the source circuit, or the machine — never the timing round. The synthetic corpus uses a stratified-by-cell bootstrap; the external corpus uses a circuit-clustered bootstrap, because {{epfl.n_cones}} cones come from only {{epfl.n_circuits}} circuits and cones from one circuit share structure; machines are reported individually and never pooled. Circuit clustering makes the external interval wider than a cone-level interval would be, and that width is the honest one.","what_goes_wrong_without_it":"Pseudo-replication. Repeated rounds inflate the effective sample size, intervals shrink toward zero width, and a difference that is well within run-to-run noise acquires the appearance of statistical significance.","sources":["deliverables_n22_24/CM_GAP_EPFL_PROTOCOL_2026-08-03.md","deliverables_n22_24/epfl_run_2026_08_03/","deliverables_n22_24/b6_pod_replication_2026_08_03/"]},{"rule":"The two measurement orders are reported separately and never averaged","lay_explanation":"You can time one method fully and then the other, or you can alternate between them. Those two orders leave the computer's fast temporary memory in different states, so they are genuinely two different measurements. Reporting only their average hides which one you did — so both are always shown.","technical_explanation":"Blocked and round-robin schedules are reported as separate columns wherever both are measured, and are never pooled into a single figure. The campaigns that measure both are the corrected kernel experiment, its replay, the cross-machine replication and the external validation. The wrapper-boundary, guard, engine-crossover and order-sensitivity runs are blocked-only and say so on their reports.","what_goes_wrong_without_it":"An earlier pass in this project attributed a schedule effect to a real performance difference. Once the two orders were separated the effect was visible as what it was. Pooling would have hidden it permanently.","sources":["deliverables_n22_24/b1_e3_replay_2026_08_03/","deliverables_n22_24/b6_pod_replication_2026_08_03/","deliverables_n22_24/b2_wrapper_2026_08_03/"]},{"rule":"Every summary number is recomputed from the raw rows by someone other than the code that produced it","lay_explanation":"The program that runs a benchmark also prints a summary. That summary is not trusted. A separate program re-reads the individual measurements and recomputes every headline figure from scratch, and the two have to match before anything is published.","technical_explanation":"Independent reaggregation from the raw per-formula rows precedes citation of any statistic. The corrected kernel experiment was reaggregated by a third-party pass in which every summary row reproduced to within floating-point tolerance, break-even reproduced exactly on all formulas, and all stratified intervals agreed. This page does the same thing again: every figure here is recomputed by the build script from the raw evidence files, never copied from a report's prose.","what_goes_wrong_without_it":"A bug in the summarising code becomes a published result. Two separate passes in this project's history found exactly that.","sources":["deliverables_n22_24/CM_GAP_INDEPENDENT_SPOT_REPLICATION_2026-08-03.md","deliverables_n22_24/epfl_run_2026_08_03/"]},{"rule":"Corpora are frozen and fingerprinted","lay_explanation":"The set of test expressions is fixed and given a short fingerprint derived from its exact contents. Every machine that runs the benchmark re-checks that fingerprint first. If one character changed, the run stops. So when five machines report different timings, you know it is the machines that differ and not the questions they were asked.","technical_explanation":"Corpora carry SHA-256 digests recorded in the campaign manifest and verified at each point of use. The cross-machine replication verified the corpus digest on every machine and additionally required the identity fields of every row to match exactly. The external corpus's upstream source is pinned to a specific commit with per-file digests and a licence digest recorded.","what_goes_wrong_without_it":"Silent corpus drift. Two runs disagree and there is no way to tell whether the workload or the machine changed.","sources":["deliverables_n22_24/cm_benchmark_refresh_manifest_2026_08_03.json","deliverables_n22_24/cm_gap_epfl_provenance_2026_08_03.json","deliverables_n22_24/b6_pod_replication_2026_08_03/"]},{"rule":"Every timing is labelled with what it actually includes","lay_explanation":"“How long did it take?” is ambiguous. Did that include building the compiled program, or not? Did it include getting the answer back out? Every number here says which, because comparing a figure that includes setup against one that does not is the easiest way to publish a wrong ratio.","technical_explanation":"Timings are typed: preparation, kernel, end-to-end call, extraction, and — for decision diagrams — build, sampled evaluation and full extraction, each reported separately. The build window convention is stated explicitly wherever two runs use different ones: the matched comparison's build includes creating a fresh manager and declaring variables, while the order-sensitivity run's build is expression-to-diagram conversion only. Those two are never plotted on the same axis.","what_goes_wrong_without_it":"A superseded wrapper-overhead figure in this project's history was carried forward from a different corpus and timing protocol without re-measurement, and understated the real cost by a large factor.","sources":["deliverables_n22_24/b5_cudd_2026_08_03_run5/","deliverables_n22_24/bx2_cudd_orders_2026_08_03/","deliverables_n22_24/b2_wrapper_2026_08_03/"]},{"rule":"Only matched pairs are aggregated, and every refusal is recorded","lay_explanation":"If one method manages a hard case and the other gives up, that pair cannot be averaged into a speed comparison — you would be crediting one method for the cases where its competitor was absent. Only cases where both methods answered are counted, and every case where one declined is reported separately.","technical_explanation":"Failure-aware paired reporting: unmatched observations are excluded from ratio aggregation, and skips, guard trips and runtime refusals are counted and published rather than dropped. The external campaign reported {{epfl.n_cones}} of {{epfl.n_cones}} rows successful with zero runtime-guard skips; the guard sweep reports the decline rate for every cell alongside the timings.","what_goes_wrong_without_it":"Survivorship bias. The arm that fails more often on hard inputs is measured only on easy ones and appears faster than it is.","sources":["deliverables_n22_24/CM_GAP_EPFL_VALIDATION_2026-08-03.md §2","deliverables_n22_24/b4_sweep_2026_08_03/"]},{"rule":"Building a thing and using a thing are never merged into one ranking","lay_explanation":"Some tools spend effort up front to make later questions cheap; others do no setup and pay on every question. Adding those two costs into a single “speed” number produces a ranking that is meaningless for both. They are always shown as separate panels.","technical_explanation":"Construction cost and evaluation or extraction cost are measured, reported and plotted as distinct quantities. There is no three-way winner anywhere on this site, and there is deliberately no blended ranking across tools that produce different primary artifacts.","what_goes_wrong_without_it":"A canonical-form engine looks terrible at a job it was never designed for, or an evaluator looks free because its setup was charged to a different column.","sources":["deliverables_n22_24/b5_cudd_2026_08_03_run5/","deliverables_n22_24/CM_BENCHMARK_REFRESH_CLAIM_MAP_2026-08-03.md row 13"]},{"rule":"The workload axis is live_k, not how many variables exist","lay_explanation":"How big a job is depends on how many things actually matter, not on how many things are lying around. Charts plotted against the total number of variables silently mix easy sparse problems with hard dense ones and produce curves that mean nothing.","technical_explanation":"Semantic support is measured, not assumed, and is the horizontal axis of every chart here with one stated exception: the guard chart, whose question — how often is a randomly drawn expression from a namespace of this size declined — is genuinely about the namespace. The axis choice was itself verified: holding semantic support fixed while varying the ambient namespace across {{b4.ambient_ns}} moves the ratio by {{b4.k16.spread}}, and on that chart nominal n appears as the series rather than the axis.","what_goes_wrong_without_it":"Shallow sparse formulas and all-live formulas get compared as if they were the same size of problem, and any resulting scaling curve is an artifact of the mix.","sources":["deliverables_n22_24/b4_sweep_2026_08_03/","deliverables_n22_24/CM_BENCHMARK_REFRESH_CLAIM_MAP_2026-08-03.md row 6"]},{"rule":"Withdrawn numbers are named, not deleted","lay_explanation":"When a published figure turns out to be wrong, it is listed in a standing correction table alongside the reason it was wrong and what replaced it — rather than quietly disappearing. Anyone who read the old material can find out exactly what changed.","technical_explanation":"A standing erratum and claim map name every superseded figure with its status — confirmed, revised, or superseded — and its replacement. On this site those figures appear in exactly one place, the corrections ledger, struck through, and are never plotted. Where the summary prose and the raw evidence still disagree, that disagreement is published too rather than resolved silently in favour of the nicer number.","what_goes_wrong_without_it":"Superseded figures leak back into later material because nobody recorded that they were withdrawn. This has happened in the project's history and is what the ledger exists to prevent.","sources":["deliverables_n22_24/CM_GAP_CONSOLIDATED_AUDIT_AND_ERRATUM_2026-08-02.md","deliverables_n22_24/CM_GAP_FILE_INDEX_AND_SUPERSESSION_2026-08-02.md","deliverables_n22_24/CM_BENCHMARK_REFRESH_CLAIM_MAP_2026-08-03.md"]},{"rule":"Reproduce a reported finding before fixing it — and be willing to refute it","lay_explanation":"When an outside reviewer reports a problem, the first step is to reproduce it independently, not to fix it. Several reported problems turned out to be real; at least one turned out to be wrong, and was recorded as refuted rather than fixed to be agreeable.","technical_explanation":"Externally reported findings are independently reproduced before any change is made, and are refuted where the evidence does not support them. In the consolidated corrective pass, six of seven external findings were confirmed and addressed and one was refuted on the evidence. A separate formal argument about decision-diagram size was refuted as stated while its practical conclusion was upheld — the exact bound in the argument was wrong, and node counts do not imply byte size or runtime, but the practical conclusion it supported survived.","what_goes_wrong_without_it":"Agreeableness masquerading as rigour. Fixing a non-problem adds risk and hides the fact that the reviewer's model was wrong.","sources":["deliverables_n22_24/CM_GAP_CONSOLIDATED_AUDIT_AND_ERRATUM_2026-08-02.md","deliverables_n22_24/CM_GAP_DEEP_FOLLOWUP_2026-08-02.md"]}]},"chain":[{"stage":"Audit V2 — review of unreviewed third-party changes","date":"2026-07-21","what_was_checked":"Whether a set of externally contributed changes should be kept, and whether seven associated claims held up.","outcome":"All third-party changes kept. A real fairness bug was confirmed: a large-namespace flag was being applied asymmetrically between the arms, so published ratios at larger namespaces were not like-for-like and were superseded."},{"stage":"Audit V3 — adversarial review, then an independent review of that review","date":"2026-07-23","what_was_checked":"Seven findings about evaluator correctness, variance estimation, generator structure and engine parity — then all seven re-checked by a separate pass.","outcome":"All seven findings confirmed, including one that <em>refuted</em> a prior claim rather than supporting it. Several survived only with narrower wording. Latent gaps identified in the same pass were fixed."},{"stage":"Audit V4 — latent-fix verification and three matched comparisons","date":"2026-07-24","what_was_checked":"Whether the V3 fixes were correct within their stated blast radius, plus three honest head-to-head comparisons including native decision-diagram construction.","outcome":"All fixes confirmed correct with no production mismatch. This is the state the slide deck is frozen at — and the state most of whose measured numbers the 2026-08-03 campaign has since superseded."},{"stage":"Gap audit — adversarial review of the benchmark gap analysis","date":"2026-08-01","what_was_checked":"Corpus construction, compilation risk, formula-level replication, schedule labelling, survivorship, and the fairness of the baseline.","outcome":"Directionally right on every count, and it exposed that the controlled strata were built from a single formula each — so the inferential unit was one, not seven."},{"stage":"Deep follow-up — audit of both the gap analysis and the gap audit","date":"2026-08-02","what_was_checked":"Whether the two preceding documents were themselves correct.","outcome":"Both contained load-bearing errors. The decisive new defect: an instruction count was being used as an executed-operation count, which is not the same thing — and flattening duplicates shared work, so a naive flattened baseline was doing more work than it needed to. That is the finding that eventually retracted the largest headline in the project."},{"stage":"Gap repair — production repair, then an adversarial merge review","date":"2026-08-02","what_was_checked":"Whether the defects could be removed at the cause rather than annotated, and whether the repair itself was sound.","outcome":"All gating claims confirmed and then removed at the cause: sharing-aware flattening added to the baseline, a memoised evaluator, and a proper CSE baseline. The merge review found further concerns, which were fixed in a final pass."},{"stage":"Corrected kernel experiment and consolidated erratum","date":"2026-08-02","what_was_checked":"Seven externally reported findings, and a rebuilt experiment on a balanced corpus with the repaired baseline.","outcome":"Six findings confirmed and addressed, one refuted on the evidence. The rebuilt experiment produced the current headline. The archived figure it replaced, and the retracted compression headline, were entered into a standing erratum."},{"stage":"Final acceptance review, then independent spot replication","date":"2026-08-03","what_was_checked":"Whether the corrective pass was ready for outside review; then, by a third party, whether every summary statistic could be reproduced from the raw rows.","outcome":"Accepted, then INDEPENDENT REAGGREGATION PASSED. The corpus regenerates byte-identically under different hash seeds; every summary row reproduced to floating-point tolerance; break-even reproduced exactly on every formula; all stratified intervals agreed."},{"stage":"Post-acceptance optimisation decision — kernel equivalence declared provisional","date":"2026-08-03","what_was_checked":"Given the accepted evidence, what to optimise next — and what not to.","outcome":"Kernel equivalence with a flattened CSE selected as the operating posture, explicitly PROVISIONAL pending the external campaign. Kernel work on the residual rejected as below the materiality bar. Priorities moved to preparation cost, cache behaviour and backend selection."},{"stage":"Benchmark refresh, local legs — replay, wrapper boundary, compile scaling, guard sweep","date":"2026-08-03","what_was_checked":"Whether the headline replays; where the whole-call boundary actually sits; whether compilation tracks the shared graph; whether the guard is ever wrong.","outcome":"Replay confirmed with identity fields exact. Wrapper claim REVISED — the earlier “CM ahead at 12 and 16” did not survive. Compile scaling confirmed. Guard confirmed with {{guard.wrong}} wrong decisions in {{guard.trials}} trials."},{"stage":"Matched decision-diagram comparison on a Linux machine","date":"2026-08-03","what_was_checked":"Construction and extraction costs against the packed kernels, on the same box, with full extraction equality rather than sampled checks.","outcome":"Confirmed with matched-cost evidence that a prior audit had been unable to obtain. Correctness gates held on all {{cudd.rows}} rows."},{"stage":"Cross-platform replication on five independent machines","date":"2026-08-03","what_was_checked":"Whether the kernel headline is a property of one Windows box.","outcome":"CROSS-PLATFORM REPLICATION PASSED on {{kernel.pod.count}} of {{kernel.pod.count}} evidence machines, spread {{kernel.pod.spread}}, every interval excluding parity. Two further machines failed before measurement on an infrastructure fault and are recorded as such."},{"stage":"External validation on real circuits","date":"2026-08-03","what_was_checked":"The pre-registered protocol, on {{epfl.n_cones}} cones from {{epfl.n_circuits}} published circuits, with the materiality rule fixed in advance.","outcome":"EXTERNAL VALIDATION SUPPORTS GENERALIZATION. The materiality rule failed, converting kernel equivalence from provisional to FINAL. The mechanism check — instruction and executed-operation ratios both exactly {{mech.instr_ratio}} — predicted parity on this corpus before it was observed."},{"stage":"Optional gap runs — engine crossover and order sensitivity","date":"2026-08-03","what_was_checked":"The two claim-map rows that had not been re-run: the engine crossover point, and decision-diagram order search.","outcome":"Crossover REVISED to workload-dependent. Order search CLOSED with data: best-of-ten is genuinely smaller at a real search cost, and dynamic reordering never triggers at these graph sizes."}],"glossary":[{"term":"Boolean function","group":"boolean-basics","lay":"A rule that takes a set of yes/no inputs and produces a single yes/no answer. “Is this person allowed in?” given whether they are staff, whether their pass is valid, and whether it is out of hours.","technical":"A mapping from {0,1}ⁿ to {0,1}. Everything on this site is about representing, evaluating and comparing such mappings."},{"term":"truth table","group":"boolean-basics","lay":"A complete list: every possible combination of inputs, and the answer for each. It says nothing about how the answer is produced — only what it is.","technical":"The explicit enumeration of a Boolean function's outputs over all 2ⁿ input assignments, under a fixed variable ordering. Complete, canonical for that ordering, and exponential in size."},{"term":"variable ordering","group":"boolean-basics","lay":"The sequence in which you consider the inputs. It makes no difference to the answer, but for some representations it makes an enormous difference to how big the representation is.","technical":"A total order on the variable set. Decision diagrams are canonical only with respect to a fixed order, and their size can vary from linear to exponential across orders for the same function."},{"term":"canonical form","group":"boolean-basics","lay":"A standard way of writing something down such that two things that mean the same thing look identical. Once you have it, checking sameness is just checking whether the two look alike.","technical":"A representation with the property that semantically equivalent objects map to syntactically identical artifacts under fixed conventions. Reduces equivalence checking to identity comparison."},{"term":"equivalence checking","group":"boolean-basics","lay":"Proving that two differently written rules always give the same answer — for every possible input, not just the ones you tried.","technical":"Deciding whether two Boolean functions are identical. Approaches differ fundamentally: compare complete outputs, compare canonical graphs in a shared manager, or prove the difference unsatisfiable."},{"term":"satisfiability (SAT)","group":"boolean-basics","lay":"The question “is there any way at all to make this come out true?” Answering it does not require listing every possibility — good solvers find one answer, or prove none exists, without enumerating.","technical":"The decision problem for existence of a satisfying assignment. An existential question, distinct from the exhaustive-enumeration questions the evaluators on this site answer."},{"term":"cofactor","group":"boolean-basics","lay":"What is left of a rule once you fix one of its inputs. Fix “is staff = yes” and you get a simpler rule about everything else.","technical":"The restriction of a function obtained by fixing one variable to a constant. The basic operation underlying decision-diagram construction and partial evaluation."},{"term":"AIG / AND-INV graph","group":"boolean-basics","lay":"A way of writing a circuit using only two-input ANDs and inverters. Restrictive, but it makes a lot of automated reasoning simpler, so it is a common exchange format for real designs.","technical":"An And-Inverter Graph: a DAG of two-input AND nodes with optional edge complementation. The format of the external benchmark circuits used on this site."},{"term":"combinational cone","group":"boolean-basics","lay":"One output of a circuit, together with everything feeding into it. Circuits have many outputs; a cone is the self-contained rule behind one of them.","technical":"The transitive fan-in of a single output in a combinational network. The external corpus is built from cones admitted by semantic-support bounds."},{"term":"two-level minimisation","group":"boolean-basics","lay":"Rewriting a rule as a short list of “all of these at once” groups joined by OR — and making that list as short as possible. It is what you want if the next step is turning the rule into physical gates.","technical":"Minimisation to sum-of-products form. The AND-groups are called product terms or implicants; the dual form, OR-groups joined by AND, is the one whose groups are called clauses. Optimises expression size, not evaluation speed."},{"term":"common subexpression elimination (CSE)","group":"boolean-basics","lay":"Noticing that the same sub-calculation appears several times and doing it only once. The workhorse optimisation behind every compiled evaluator here, and the baseline CM has to beat.","technical":"Rewriting an expression tree into a shared DAG so structurally identical subexpressions become a single node, typically by hash-consing. Evaluated once per node rather than once per occurrence."},{"term":"hash-consing","group":"boolean-basics","lay":"Giving every distinct piece of an expression a fingerprint, and keeping only one copy of each. If you build the same piece twice, you get the same object back rather than a duplicate.","technical":"Interning structurally identical subterms via a hash table keyed on the node's constructor and children, so structural equality becomes pointer equality. The mechanism underlying both CSE and CM's canonical keys."},{"term":"sharing-aware flattening","group":"boolean-basics","lay":"Collapsing a chain of the same operation into one wide operation — but only where doing so does not force you to redo work you were already sharing. Adding this to the baseline is what closed most of CM's apparent kernel advantage.","technical":"n-ary flattening of associative operator chains that respects the shared DAG, avoiding the duplication a naive flatten introduces at shared nodes. Its absence from an earlier baseline is the cause of a retracted headline in this project's history."},{"term":"n-ary instruction merging","group":"boolean-basics","lay":"Turning “A and B, then and C, then and D” into a single “and all four of these”. Fewer, wider steps. This is the entire mechanism behind CM's measured kernel advantage over an unflattened baseline.","technical":"Emitting one wide instruction for an associative operator chain instead of one instruction per binary application. Predicts parity on corpora with no mergeable chains — which is exactly what the AND/INV external corpus showed."},{"term":"DAG versus tree (sharing)","group":"boolean-basics","lay":"The same expression can be drawn as a tree, where every repeated piece is written out again, or as a graph, where repeats point back to one copy. The tree can be astronomically bigger for the same rule.","technical":"The sharing factor is unfolded occurrences divided by structural DAG nodes. Compilation cost tracking DAG nodes rather than unfolded occurrences is what makes highly shared expressions cheap to compile."},{"term":"bit-parallel / packed evaluation","group":"boolean-basics","lay":"Instead of working out the answer for one input combination at a time, pack many combinations into a single machine word and compute them all at once with one instruction.","technical":"Evaluating a Boolean function over many assignments simultaneously by packing assignment bits into machine words and applying bitwise operations. The output remains exponential in semantic support."},{"term":"word-packed versus big-integer evaluation","group":"boolean-basics","lay":"Two ways to hold the packed bits: as a list of machine-sized chunks, or as one arbitrarily large number. Chunks are faster once there is enough work; the big number wins when there is not, because it has less setup.","technical":"The words engine operates over arrays of fixed-width words with a fixed dispatch cost; the bigint engines operate over Python arbitrary-precision integers. Which is faster is an amortisation question, not a fixed variable-count threshold."},{"term":"BitSet","group":"representations","lay":"The plain packed-bit executor: it computes the whole answer table using ordinary bitwise instructions and essentially no setup. It is the comparison arm CM has to beat at the whole-call boundary, and it wins at every size measured here.","technical":"The bare packed kernel used as the wrapper-boundary baseline. No structural artifact, no cache, no canonical key — and correspondingly no overhead to amortise."},{"term":"CM (Correspondence Matrix)","group":"representations","lay":"A Boolean operator written as an ordered grid of bits, treated as an object in its own right rather than as a list of answers.","technical":"An ordered binary matrix representation of a Boolean operator. Uniqueness is relative to an ordered variable basis; matrix equality requires the same normalised ordered basis on both sides."},{"term":"LM (Logic Matrix)","group":"representations","lay":"A second matrix form built under a different construction convention. It expresses the same things a CM does, written a different way.","technical":"A related matrix representation in the CM family, distinguished by its construction convention rather than by what it can express."},{"term":"dense CM","group":"representations","lay":"The fully written-out matrix. Only built when the matrix itself is what you asked for — it grows exponentially with the number of variables that matter.","technical":"The materialised CM matrix, exponential in semantic support. Not the artifact produced on the packed evaluation path, and not optimised for raw execution speed."},{"term":"no-reinflate","group":"representations","lay":"Producing the packed answer without ever building the full matrix along the way. Building it and then throwing it away would cost far more than the answer is worth.","technical":"The CM execution path that emits reduced packed output directly, skipping dense matrix materialisation when the requested artifact is a truth vector."},{"term":"IR (intermediate representation)","group":"representations","lay":"The internal form a system compiles your expression into before running it — not what you wrote, and not the final answer, but the working form in between.","technical":"CM's structural IR is a shared DAG over interned nodes, from which an executable instruction program is lowered."},{"term":"structural hash / persistent cache","group":"representations","lay":"A fingerprint of the compiled form, used to remember what has already been built so an identical expression can reuse it instead of being compiled again.","technical":"A digest-keyed cache of compiled structural IR, returning one object per digest. Its steady-state hit rate and size sensitivity under realistic mixes are unmeasured — one of the named open items."},{"term":"ordered CM basis","group":"representations","lay":"The agreed sequence of variables that a matrix is written relative to. Two matrices only mean the same thing if they were written against the same sequence.","technical":"The ordered variable basis defining CM uniqueness. Basis-normalised comparison is a precondition for any matrix-equality claim."},{"term":"bra/ket measurement","group":"representations","lay":"Reading one specific fact out of the matrix by multiplying it against a pair of pick-one-thing vectors — the equivalent of asking the operator a single question instead of unpacking all of its answers.","technical":"Logical measurement using ordered bra and ket vectors against the CM. Present in the formalism; its practical performance advantage has not been benchmarked."},{"term":"ROBDD","group":"representations","lay":"A compressed decision tree with all duplicate branches merged. For a fixed variable order it is canonical: two functions are the same exactly when their graphs are the same.","technical":"Reduced Ordered Binary Decision Diagram. Canonical under a fixed variable order; size is order-sensitive, and extracting an explicit truth vector requires one traversal per assignment."},{"term":"CUDD","group":"representations","lay":"The widely used library that implements decision diagrams. When this site says “CUDD”, it means measurements made with the real native library, not a re-implementation.","technical":"The Colorado University Decision Diagram package, used natively. Every measured row carries a flag confirming the native library was in use, and full-extraction equality against the packed bits was verified on every row."},{"term":"fixed-order build","group":"representations","lay":"Building a decision diagram using one prescribed variable order, without searching for a better one.","technical":"A single build under a prescribed natural order, with no order search and no dynamic reordering. The convention used for the matched cost comparison."},{"term":"selected isolated build","group":"representations","lay":"The build time of whichever attempt a search decided to keep. Importantly, that is not necessarily the fastest attempt — it is the one that produced the smallest graph.","technical":"The build interval of the trial retained by the configured selection objective, which prioritises node count and only then build time. Quoting it without the search total understates the true cost."},{"term":"order search total","group":"representations","lay":"The full cost of trying several variable orders and keeping the best. It is the honest figure to quote if you searched, because you paid for every attempt, not just the winner.","technical":"The summed cost of all trial builds in a best-of-k order search. On this site it is reported beside the single-build cost and never omitted."},{"term":"dynamic reordering","group":"representations","lay":"A decision-diagram library rearranging its own variable order automatically when the graph grows too large. On the graphs measured here it never activated, because they never got big enough to trigger it.","technical":"Automatic variable-reordering triggered by node-count growth thresholds. Node ratio was exactly {{bx2.reorder_ratio}} across all strata here, which characterises this corpus as small for the library rather than characterising reordering."},{"term":"nominal n","group":"workload-and-timing","lay":"How many variables exist in the surrounding system. Not a measure of how big the job is — most of them may be irrelevant to the expression at hand.","technical":"The size of the variable namespace. Measured here to be irrelevant to cost at fixed semantic support."},{"term":"syntactically used variables","group":"workload-and-timing","lay":"The variables that literally appear in the expression as written. Some of them may still have no effect on the answer.","technical":"Variables occurring in the expression's syntax. An upper bound on semantic support, not equal to it."},{"term":"semantic support / live_k","group":"workload-and-timing","lay":"How many variables actually change the answer. This is the honest measure of how big a job is, and it is the horizontal axis of nearly every chart here.","technical":"The number of variables the function genuinely depends on, measured rather than assumed. Explicit output size is 2^live_k. A variable can appear syntactically and be semantically dead."},{"term":"guard skip","group":"workload-and-timing","lay":"The system declining to produce an explicit answer table because it would be too large. A deliberate refusal, recorded as such, not a failure.","technical":"An intentional refusal above the explicit-output guard at live_k={{guard.k}}. Skips are counted and reported; across {{guard.trials}} fresh trials there were {{guard.wrong}} incorrect guard decisions and {{guard.oversized}} oversized outputs."},{"term":"wrapper","group":"workload-and-timing","lay":"The whole end-to-end call: everything from handing over your inputs to getting the answer back, including all the bookkeeping in between — not just the computation itself.","technical":"The full call path including argument binding, environment setup, cache lookup, kernel execution and result extraction. Distinguished throughout from the kernel."},{"term":"kernel","group":"workload-and-timing","lay":"The computation proper, with the setup and teardown stripped away. Two systems can have identical kernels and very different end-to-end costs.","technical":"The steady-state execution of the compiled program with environment and program prebuilt. The level at which CM and CSE-flat are equivalent."},{"term":"wrapper overhead","group":"workload-and-timing","lay":"The difference between the end-to-end call and the computation proper — the fixed price of using the system at all. Roughly constant, which is why it dominates when the actual work is small.","technical":"End-to-end call time minus kernel time, {{wrap.ovh.min}}–{{wrap.ovh.max}} median on the current corpus and protocol. Not separable at the smallest stratum, where the fallback engine is used."},{"term":"preparation (prep) cost","group":"workload-and-timing","lay":"The one-time cost of compiling an expression before you can evaluate it. The prep <em>multiple</em> is that cost expressed as a ratio against a named baseline — and the baseline must always be named, because it changes the number.","technical":"Compilation cost, linear in structural DAG nodes. Geometric-mean multiple against plain CSE and against CSE-flat differ and are never interchanged. Currently unprofiled, and the top-ranked optimisation surface."},{"term":"prepared evaluation","group":"workload-and-timing","lay":"Running an expression that has already been compiled and bound, so the setup is not paid again.","technical":"Execution after binding preparation is complete. Preparation is a separate one-time cost and is never folded into the per-call figure."},{"term":"break-even reuse count","group":"workload-and-timing","lay":"How many times you must evaluate the same expression before the compilation cost is repaid. Below it you lose; above it you win. It is the single most useful number to know about your workload.","technical":"Preparation premium divided by per-evaluation kernel gain. A formula is classified never-break-even exactly when that gain is not positive — preparation cost sets the magnitude of finite counts but plays no part in the classification."},{"term":"paired observation","group":"workload-and-timing","lay":"One timing of the same expression under two different methods, so the comparison is like-for-like. Only pairs where both methods succeeded are counted.","technical":"A matched measurement across arms for one formula. Unmatched observations are excluded from ratio aggregation to avoid survivorship bias."},{"term":"arm (baseline arm)","group":"workload-and-timing","lay":"One of the methods being compared in an experiment. Saying “CM was 10% faster” is meaningless without saying faster than which arm.","technical":"A measurement condition in a paired comparison — here CM, plain CSE, CSE-flat, BitSet, or a decision diagram. Every ratio on this site names both arms."},{"term":"formula-level sample","group":"workload-and-timing","lay":"The set of distinct expressions in a group. Timing one expression seven times gives you seven measurements but still only one expression.","technical":"The set of distinct formulas in a stratum — the inferential unit. An earlier pass in this project discovered that a controlled stratum contained one formula re-bound several ways, making the effective sample size one."},{"term":"ratio of medians","group":"workload-and-timing","lay":"Take the typical time for each method, then divide. Different from taking each pair's ratio and finding the typical one — the two can disagree, so which was used is always stated.","technical":"median(A) ÷ median(B) across a stratum's observations. Distinct from the median paired ratio; both appear on this site and each is labelled."},{"term":"median paired ratio","group":"workload-and-timing","lay":"Work out the ratio for each expression individually, then take the typical one. More robust to one expression being unusual than dividing the two typical times.","technical":"The median of per-observation A÷B ratios. Preferred where formula-to-formula variation is large."},{"term":"timing artifact / type","group":"workload-and-timing","lay":"Exactly what a stopwatch reading includes. Setup? Extraction? Both? Every figure here says which, because comparing an inclusive figure to an exclusive one is the easiest way to publish a wrong ratio.","technical":"The labelled timing boundary: prep, kernel, end-to-end call, extraction, build. Build-window conventions that differ between runs are stated and never plotted on a shared axis."},{"term":"geometric mean","group":"statistics-and-protocol","lay":"The right kind of average for ratios. If one measurement says “twice as fast” and another says “half as fast”, an ordinary average says 1.25 — which is wrong. The geometric mean correctly says 1.","technical":"The exponential of the mean of the logs. Used for all ratio aggregation here because ratios are multiplicative and their distribution is skewed in linear space."},{"term":"bootstrap confidence interval","group":"statistics-and-protocol","lay":"A way of asking “how much would this number move if I had happened to test a different sample?” — by repeatedly re-drawing from the data you have and watching how far the answer wanders.","technical":"A resampling interval. The resampling unit is the crucial choice: resample the wrong unit and the interval is meaningless regardless of how many draws you take."},{"term":"clustered bootstrap","group":"statistics-and-protocol","lay":"Re-drawing whole groups rather than individual measurements, when the measurements inside a group are related. Cones from one circuit are not independent, so whole circuits are re-drawn.","technical":"Resampling at the cluster level — circuit, cell, or machine. Produces wider and more honest intervals than naive resampling when within-cluster correlation exists."},{"term":"pseudo-replication","group":"statistics-and-protocol","lay":"The error of counting repeated measurements of the same thing as if they were measurements of different things. It makes error bars look far tighter than they are, and can turn ordinary noise into an apparently solid finding.","technical":"Treating within-unit repeated measures as independent observations, inflating effective sample size and understating variance. The specific failure clustered intervals exist to prevent."},{"term":"degrees of freedom","group":"statistics-and-protocol","lay":"Roughly, how much independent information your data actually contains after accounting for everything you estimated from it. Getting it wrong makes your spread estimate too small.","technical":"Residual degrees of freedom after estimating cell means. An earlier pass in this project divided a residual sum of squares by the raw observation count rather than the residual degrees of freedom, understating the spread estimate; units in singleton cells contribute no residual information."},{"term":"blocked schedule","group":"statistics-and-protocol","lay":"Timing all of one method, then all of the other. Each method gets a run where the data it needs is likely still sitting in the computer's fast temporary memory.","technical":"All measurements of one arm, then all of the next. Reported as its own column and never pooled with the alternating order."},{"term":"round-robin schedule","group":"statistics-and-protocol","lay":"Alternating between the methods, one after another. This keeps the two on a more even footing over time, but each one is more likely to find the computer's fast memory holding the other method's data.","technical":"Interleaved measurement across arms. Stresses cache and CPU state differently from the blocked order; agreement between the two is reported, not assumed."},{"term":"pre-registration","group":"statistics-and-protocol","lay":"Writing down what you are going to measure and what would count as a positive result — before you have the data. It is what makes a negative result meaningful rather than merely disappointing.","technical":"Fixing corpus source, selection rules, arms, schedules, clustering basis and decision thresholds in a frozen protocol before any measurement exists."},{"term":"materiality rule","group":"statistics-and-protocol","lay":"The pass mark, agreed in advance: how big an effect would have to be, and how confident you would have to be about it, before it is worth acting on. On the decisive experiment here, the pass mark was not met.","technical":"A conjunction of pre-registered conditions — an effect-size threshold, an interval excluding parity, and a break-even bound — all of which must hold for optimisation to be warranted. Its failure is what made the kernel-equivalence posture final."},{"term":"packed-equality gate","group":"statistics-and-protocol","lay":"The check that runs before any timing: every method must produce exactly the same answer bits. Fail it and the run stops rather than producing a number.","technical":"Bit-for-bit output agreement across all arms as a precondition for measurement. Strengthened to full-extraction equality rather than sampled checks for the decision-diagram comparison."},{"term":"independent reaggregation","group":"statistics-and-protocol","lay":"Having a second, separate piece of code recompute every headline number from the individual measurements — so a bug in the summariser cannot become a published result.","technical":"Recomputation of every summary statistic from raw per-formula rows by a pass independent of the driver. Required before citation; performed again by this page's build script."},{"term":"survivorship bias","group":"statistics-and-protocol","lay":"Judging a method only on the cases it managed to finish. If it gives up on the hard ones and its rival does not, it will look faster than it is.","technical":"Aggregation over unmatched observations, where one arm's failures are silently excluded. Prevented by failure-aware paired reporting: only matched pairs are aggregated and every refusal is counted."},{"term":"supersession","group":"statistics-and-protocol","lay":"Formally retiring a published number — recording that it is withdrawn, why, and what replaced it — instead of quietly deleting it. Anyone who read the old version can find out exactly what changed.","technical":"A standing erratum and claim map assigning each prior claim a status of confirmed, revised or superseded with its replacement. Superseded figures appear on this site only in the corrections ledger and are never plotted."},{"term":"EPFL benchmark suite","group":"statistics-and-protocol","lay":"A published, freely available collection of real hardware circuit designs, widely used for comparing logic tools. Using it means testing against something the project did not choose or shape.","technical":"The external combinational benchmark suite from which {{epfl.n_cones}} AND/INV cones across {{epfl.n_circuits}} circuits were extracted, at a pinned upstream commit with per-file digests recorded."},{"term":"identity fields","group":"statistics-and-protocol","lay":"The parts of a benchmark row that say <em>which</em> expression it is, as opposed to how fast it ran. If those match exactly between two runs, you know both runs asked the same questions.","technical":"Non-timing row fields — formula id, truth digest, support, structural counts. Exact match across runs establishes that a difference is timing, not workload."},{"term":"sanity gate","group":"statistics-and-protocol","lay":"A cheap check that runs before the expensive work and stops everything if it fails — such as a small pilot run, or verifying the test set's fingerprint.","technical":"A deterministic pilot plus a pre-registered runtime bound before each full run, alongside corpus digest verification and truth-digest re-verification at measurement time."}]},"_numbers":{"kernel.local":{"value":0.8876462484974261,"fmt":"ratio4","prov":"deliverables_n22_24/b1_e3_replay_2026_08_03/b1_acceptance_check_results_2026_08_03.json :: new_geomean_all_blocked","note":""},"kernel.local.lo":{"value":0.8731024896723113,"fmt":"ratio3","prov":"deliverables_n22_24/b1_e3_replay_2026_08_03/b1_acceptance_check_results_2026_08_03.json :: new_ci95_stratified[0]","note":""},"kernel.local.hi":{"value":0.9021611022286631,"fmt":"ratio3","prov":"deliverables_n22_24/b1_e3_replay_2026_08_03/b1_acceptance_check_results_2026_08_03.json :: new_ci95_stratified[1]","note":""},"kernel.local.pct":{"value":11.235375150257386,"fmt":"pct0","prov":"deliverables_n22_24/b1_e3_replay_2026_08_03/b1_acceptance_check_results_2026_08_03.json :: 100*(1-new_geomean_all_blocked)","note":""},"kernel.epfl":{"value":0.9267718238139802,"fmt":"ratio4","prov":"deliverables_n22_24/epfl_run_2026_08_03/cm_gap_epfl_analysis_2026_08_03.json :: secondary_blocked_cm_cse.geomean","note":""},"kernel.epfl.lo":{"value":0.9026106253016197,"fmt":"ratio3","prov":"deliverables_n22_24/epfl_run_2026_08_03/cm_gap_epfl_analysis_2026_08_03.json :: secondary_blocked_cm_cse.ci95_lo","note":""},"kernel.epfl.hi":{"value":0.9507014629561136,"fmt":"ratio3","prov":"deliverables_n22_24/epfl_run_2026_08_03/cm_gap_epfl_analysis_2026_08_03.json :: secondary_blocked_cm_cse.ci95_hi","note":""},"kernel.epfl.pct":{"value":7.322817618601984,"fmt":"pct0","prov":"deliverables_n22_24/epfl_run_2026_08_03/cm_gap_epfl_analysis_2026_08_03.json :: 100*(1-secondary_blocked_cm_cse.geomean)","note":""},"kernel. <script>
/* CM master knowledge base — shared render library.
   Injected into every page by cm_master_build_2026_08_03.py at the
   /*__CM_LIB__*​/ marker, after `const DATA = …` is defined.

   Contract: this file NEVER contains a measured result. Every number reaches
   the page through DATA (evidence arrays) or through DATA._numbers (named
   tokens the build script read from an evidence file). Prose in the content
   file writes a double-brace token; `P()` resolves it here against `_numbers`,
   and the build script refuses to build if a token has no backing evidence. */

/* ---------------------------------------------------------------- colour */
const S1 = "var(--series-1)", S2 = "var(--series-2)", S3 = "var(--series-3)", S4 = "var(--series-4)";

/* ---------------------------------------------------------------- dom */
const el = (t, a = {}, kids = []) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", t);
  for (const k in a) if (a[k] !== null && a[k] !== undefined) n.setAttribute(k, a[k]);
  for (const c of [].concat(kids)) n.append(c);
  return n;
};
const h = (t, a = {}, kids = []) => {
  const n = document.createElement(t);
  for (const k in a) {
    if (k === "html") n.innerHTML = a[k];
    else if (k === "text") n.textContent = a[k];
    else n.setAttribute(k, a[k]);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
};
const frag = (kids) => { const d = document.createDocumentFragment(); [].concat(kids).forEach(c => c && d.append(c)); return d; };

/* ---------------------------------------------------------------- format */
const f = (x, d = 3) => (x === null || x === undefined) ? "—" : Number(x).toFixed(d);
const us = (x) => x === null || x === undefined ? "—"
  : x >= 100000 ? (x / 1000).toFixed(0) + " ms"
  : x >= 1000 ? (x / 1000).toFixed(x >= 10000 ? 1 : 2) + " ms"
  : x.toFixed(x < 10 ? 2 : 1) + " µs";
const commas = (x) => Number(x).toLocaleString("en-US");

const FMT = {
  ratio2: (v) => Number(v).toFixed(2),
  ratio3: (v) => Number(v).toFixed(3),
  ratio4: (v) => Number(v).toFixed(4),
  num1: (v) => Number(v).toFixed(1),
  /* Repetition counts: one decimal when it carries information, none when it
     would render a spurious tenth on a whole number ("78" not "78.0"). */
  num1s: (v) => Number(v).toFixed(1).replace(/\.0$/, ""),
  int: (v) => commas(Math.round(v)),
  big: (v) => commas(Math.round(v)),
  x0: (v) => commas(Math.round(v)) + "×",
  x1: (v) => Number(v).toFixed(1) + "×",
  x2: (v) => Number(v).toFixed(2) + "×",
  xcomma: (v) => commas(Math.round(v)) + "×",
  pct0: (v) => Math.round(v) + "%",
  pct1: (v) => Number(v).toFixed(1) + "%",
  pct2: (v) => Number(v).toFixed(2) + "%",
  pctsign2: (v) => (v >= 0 ? "+" : "") + Number(v).toFixed(2) + "%",
  us0: (v) => us(v),
  ms0: (v) => Number(v).toFixed(v < 10 ? 1 : 0) + " ms",
  usd: (v) => "$" + Number(v).toFixed(4),
  text: (v) => String(v),
};

/* Named-number lookup. Fails loudly rather than rendering a blank. */
const NUM = DATA._numbers;
function T(token) {
  const rec = NUM[token];
  if (!rec) { console.error("unknown number token:", token); return "‹?" + token + "›"; }
  return (FMT[rec.fmt] || FMT.text)(rec.value);
}
function TV(token) {
  const rec = NUM[token];
  if (!rec) { console.error("unknown number token:", token); return NaN; }
  return rec.value;
}
/* Resolve double-brace tokens in authored prose. Each resolved number is wrapped in a
   span carrying its provenance, so hovering any figure on the page shows the
   file and field it was read from. */
function P(s) {
  if (s == null) return "";
  return String(s).replace(/\{\{([a-zA-Z0-9_.]+)\}\}/g, (_, tok) => {
    const rec = NUM[tok];
    if (!rec) { console.error("unknown number token:", tok); return "‹?" + tok + "›"; }
    const val = (FMT[rec.fmt] || FMT.text)(rec.value);
    const title = (rec.prov + (rec.note ? " — " + rec.note : "")).replace(/"/g, "&quot;");
    return `<span class="num" title="${title}">${val}</span>`;
  });
}

/* ---------------------------------------------------------------- tooltip */
const tip = (() => {
  let n = document.getElementById("tip");
  if (!n) { n = h("div", { id: "tip", role: "status", "aria-live": "polite" }); document.body.prepend(n); }
  return n;
})();
function bindTip(node, html) {
  const show = (e) => {
    tip.innerHTML = html;
    tip.style.opacity = 1;
    const r = tip.getBoundingClientRect();
    let x = e.clientX + 14, y = e.clientY + 14;
    if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
    if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  };
  node.addEventListener("mousemove", show);
  node.addEventListener("mouseenter", show);
  node.addEventListener("mouseleave", () => tip.style.opacity = 0);
  node.setAttribute("tabindex", "0");
  node.addEventListener("focus", () => {
    const b = node.getBoundingClientRect();
    show({ clientX: b.left + b.width / 2, clientY: b.top });
  });
  node.addEventListener("blur", () => tip.style.opacity = 0);
}

/* ---------------------------------------------------------------- scales */
const linScale = (d0, d1, r0, r1) => (v) => r0 + (v - d0) / (d1 - d0) * (r1 - r0);
const logScale = (d0, d1, r0, r1) => {
  const l0 = Math.log10(d0), l1 = Math.log10(d1);
  return (v) => r0 + (Math.log10(v) - l0) / (l1 - l0) * (r1 - r0);
};
/* Domain helper. Hard-coded axis literals silently clip data when the evidence
   moves under them, so every ratio axis derives its domain from the values it is
   about to draw (plus any reference line). */
const pad = (vals, m) => {
  const v = vals.filter(x => x != null && isFinite(x));
  return [Math.min(...v) - m, Math.max(...v) + m];
};
function niceTicks(lo, hi, n = 5) {
  const raw = (hi - lo) / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || 10 * mag;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
function logTicks(lo, hi) {
  const out = [];
  for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++) {
    const v = Math.pow(10, e);
    if (v >= lo * 0.999 && v <= hi * 1.001) out.push(v);
  }
  return out;
}

/* ---------------------------------------------------------------- card */
function card(o) {
  const c = h("section", { class: "card", id: o.id });
  if (o.scope) c.append(h("p", { class: "scope", text: o.scope }));
  c.append(h(o.h || "h2", { text: o.title }));
  if (o.caption) c.append(h("p", { class: "caption", html: P(o.caption) }));
  if (o.legend) {
    const lg = h("div", { class: "legend" });
    o.legend.forEach(([col, lab]) =>
      lg.append(h("span", {}, [h("i", { style: `background:${col}` }), h("span", { text: lab })])));
    c.append(lg);
  }
  if (o.svg) c.append(h("div", { class: "figwrap" }, [o.svg]));
  if (o.svg2) c.append(h("div", { class: "figwrap" }, [o.svg2]));
  if (o.note) c.append(h("p", { class: "claim", html: P(o.note) }));
  if (o.table) {
    const d = h("details");
    d.append(h("summary", { text: "Table view (every plotted value)" }));
    d.append(h("div", { class: "tablewrap" }, [o.table]));
    c.append(d);
  }
  if (o.prov) {
    const d = h("details", { class: "prov" });
    d.append(h("summary", { text: "Data provenance" }));
    const ul = h("ul");
    o.prov.forEach(p => ul.append(h("li", { html: `<code>${p.replace("::", "</code> :: <code>")}</code>` })));
    d.append(ul);
    c.append(d);
  }
  if (o.claim) c.append(h("p", { class: "claim", html: P(o.claim) }));
  return c;
}
function table(headers, rows, cls) {
  const t = h("table", cls ? { class: cls } : {});
  const th = h("tr");
  headers.forEach(x => th.append(h("th", { html: x })));
  t.append(h("thead", {}, [th]));
  const tb = h("tbody");
  rows.forEach(r => {
    const tr = h("tr");
    r.forEach(x => tr.append(h("td", { html: String(x) })));
    tb.append(tr);
  });
  t.append(tb);
  return t;
}

/* --------------------------------------------- forest (dot + CI, horizontal) */
function forest(rows, opt) {
  const W = opt.width || 900, padL = opt.padL || 250, padR = 92, padT = 30, rowH = 30;
  const H = padT + rows.length * rowH + 46;
  const lo = opt.domain[0], hi = opt.domain[1];
  const x = linScale(lo, hi, padL, W - padR);
  const g = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img",
                        "aria-label": opt.title || "forest plot" });

  niceTicks(lo, hi, opt.ticks || 6).forEach(t => {
    g.append(el("line", { x1: x(t), x2: x(t), y1: padT - 8, y2: padT + rows.length * rowH,
                          stroke: "var(--grid)", "stroke-width": 1 }));
    g.append(el("text", { x: x(t), y: padT + rows.length * rowH + 18, class: "tick",
                          "text-anchor": "middle" }, [document.createTextNode(f(t, 2))]));
  });
  if (opt.ref !== undefined && opt.ref >= lo && opt.ref <= hi) {
    g.append(el("line", { x1: x(opt.ref), x2: x(opt.ref), y1: padT - 12, y2: padT + rows.length * rowH,
                          stroke: "var(--ref)", "stroke-width": 1.5 }));
    g.append(el("text", { x: x(opt.ref), y: padT - 17, class: "axtitle", "text-anchor": "middle" },
                        [document.createTextNode(opt.refLabel || "parity 1.00")]));
  }
  g.append(el("text", { x: (padL + W - padR) / 2, y: H - 8, class: "axtitle", "text-anchor": "middle" },
                      [document.createTextNode(opt.xTitle)]));

  rows.forEach((r, i) => {
    const cy = padT + i * rowH + rowH / 2;
    const col = r.group === "pod" ? S3 : r.group === "external" ? S2 : S1;
    g.append(el("text", { x: padL - 12, y: cy + 4, class: "lab", "text-anchor": "end" },
                        [document.createTextNode(r.label)]));
    if (r.lo !== null && r.lo !== undefined) {
      g.append(el("line", { x1: x(r.lo), x2: x(r.hi), y1: cy, y2: cy, stroke: col, "stroke-width": 2,
                            "stroke-linecap": "round" }));
      [r.lo, r.hi].forEach(v => g.append(el("line", { x1: x(v), x2: x(v), y1: cy - 5, y2: cy + 5,
                                                      stroke: col, "stroke-width": 2 })));
    }
    g.append(el("circle", { cx: x(r.value), cy, r: 5.5, fill: col,
                            stroke: "var(--surface-1)", "stroke-width": 2 }));
    g.append(el("text", { x: W - padR + 10, y: cy + 4, class: "val" },
                        [document.createTextNode(f(r.value, 4))]));
    const hit = el("rect", { x: padL - 4, y: cy - rowH / 2, width: W - padR - padL + 8, height: rowH, class: "hit" });
    bindTip(hit, `<b>${r.label}</b><span class="r">${opt.arm}: ${f(r.value, 4)}` +
      (r.lo != null ? ` &nbsp;95% CI [${f(r.lo, 4)}, ${f(r.hi, 4)}]` : "") +
      `</span><br><span class="r">${r.scope}</span><br><span class="r">${r.basis}</span>`);
    g.append(hit);
  });
  return g;
}

/* ---------------------------------------------------- grouped columns */
function groupedCols(cfg) {
  const W = cfg.width || 900, padL = cfg.padL || 74, padR = 22, padT = 22, padB = cfg.padB || 62;
  const H = cfg.height || 320;
  const groups = cfg.groups, series = cfg.series;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const isLog = !!cfg.log;
  const allV = groups.flatMap(g => series.map(s => g.values[s.key]).filter(v => v != null && (!isLog || v > 0)));
  const maxV = cfg.max || Math.max(...allV) * 1.12;
  const minV = isLog ? (cfg.min || Math.pow(10, Math.floor(Math.log10(Math.min(...allV))))) : 0;
  const y = isLog ? logScale(minV, maxV, padT + plotH, padT) : linScale(minV, maxV, padT + plotH, padT);
  const g = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img",
                        "aria-label": cfg.title || "grouped columns" });

  (isLog ? logTicks(minV, maxV) : niceTicks(minV, maxV, 5)).forEach(t => {
    g.append(el("line", { x1: padL, x2: W - padR, y1: y(t), y2: y(t), stroke: "var(--grid)", "stroke-width": 1 }));
    g.append(el("text", { x: padL - 10, y: y(t) + 4, class: "tick", "text-anchor": "end" },
                        [document.createTextNode(cfg.fmtTick ? cfg.fmtTick(t) : f(t, cfg.tickDigits ?? 2))]));
  });
  g.append(el("line", { x1: padL, x2: W - padR, y1: padT + plotH, y2: padT + plotH,
                        stroke: "var(--axis)", "stroke-width": 1 }));
  if (cfg.ref != null) {
    g.append(el("line", { x1: padL, x2: W - padR, y1: y(cfg.ref), y2: y(cfg.ref),
                          stroke: "var(--ref)", "stroke-width": 1.5 }));
    g.append(el("text", { x: W - padR - 2, y: y(cfg.ref) - 6, class: "axtitle", "text-anchor": "end" },
                        [document.createTextNode(cfg.refLabel || "parity 1.00")]));
  }
  g.append(el("text", { x: 16, y: padT + plotH / 2, class: "axtitle", "text-anchor": "middle",
                        transform: `rotate(-90 16 ${padT + plotH / 2})` },
                      [document.createTextNode(cfg.yTitle)]));
  g.append(el("text", { x: padL + plotW / 2, y: H - 8, class: "axtitle", "text-anchor": "middle" },
                      [document.createTextNode(cfg.xTitle)]));

  const bandW = plotW / groups.length;
  const inner = Math.min(cfg.barW || 24, (bandW - 26) / series.length);
  groups.forEach((grp, gi) => {
    const cx = padL + bandW * (gi + 0.5);
    const total = series.length * inner + (series.length - 1) * 2;
    series.forEach((s, si) => {
      const v = grp.values[s.key];
      if (v == null || (isLog && v <= 0)) return;
      const bx = cx - total / 2 + si * (inner + 2);
      const by = y(v), bh = Math.max(1, padT + plotH - by);
      const r = Math.min(4, bh / 2);
      const path = `M${bx},${by + bh} L${bx},${by + r} Q${bx},${by} ${bx + r},${by}` +
                   ` L${bx + inner - r},${by} Q${bx + inner},${by} ${bx + inner},${by + r}` +
                   ` L${bx + inner},${by + bh} Z`;
      const bar = el("path", { d: path, fill: s.color });
      bindTip(bar, `<b>${grp.label} · ${s.label}</b><span class="r">${cfg.fmtVal ? cfg.fmtVal(v) : f(v, 3)}</span>` +
        (grp.tip ? `<br><span class="r">${grp.tip}</span>` : ""));
      g.append(bar);
      if (cfg.labelBars) {
        g.append(el("text", { x: bx + inner / 2, y: by - 6, class: "val", "text-anchor": "middle",
                              "font-size": 10.5 },
                            [document.createTextNode(cfg.fmtVal ? cfg.fmtVal(v) : f(v, 2))]));
      }
    });
    g.append(el("text", { x: cx, y: padT + plotH + 18, class: "lab", "text-anchor": "middle" },
                        [document.createTextNode(grp.label)]));
    if (grp.sub) g.append(el("text", { x: cx, y: padT + plotH + 33, class: "tick", "text-anchor": "middle",
                                       "font-size": 11 }, [document.createTextNode(grp.sub)]));
  });
  return g;
}

/* ------------------------------------- dumbbell (2 series, horizontal cats) */
function dumbbell(cats, cfg) {
  const W = cfg.width || 900, padL = cfg.padL || 175, padR = 30, padT = 26, rowH = cfg.rowH || 24;
  const H = padT + cats.length * rowH + 48;
  const x = linScale(cfg.domain[0], cfg.domain[1], padL, W - padR);
  const g = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": cfg.title });
  niceTicks(cfg.domain[0], cfg.domain[1], 6).forEach(t => {
    g.append(el("line", { x1: x(t), x2: x(t), y1: padT - 6, y2: padT + cats.length * rowH,
                          stroke: "var(--grid)", "stroke-width": 1 }));
    g.append(el("text", { x: x(t), y: padT + cats.length * rowH + 18, class: "tick", "text-anchor": "middle" },
                        [document.createTextNode(f(t, 2))]));
  });
  if (cfg.ref != null) {
    g.append(el("line", { x1: x(cfg.ref), x2: x(cfg.ref), y1: padT - 12, y2: padT + cats.length * rowH,
                          stroke: "var(--ref)", "stroke-width": 1.5 }));
    g.append(el("text", { x: x(cfg.ref), y: padT - 17, class: "axtitle", "text-anchor": "middle" },
                        [document.createTextNode("parity 1.00")]));
  }
  g.append(el("text", { x: (padL + W - padR) / 2, y: H - 8, class: "axtitle", "text-anchor": "middle" },
                      [document.createTextNode(cfg.xTitle)]));
  cats.forEach((c, i) => {
    const cy = padT + i * rowH + rowH / 2;
    g.append(el("text", { x: padL - 12, y: cy + 4, class: "lab", "text-anchor": "end" },
                        [document.createTextNode(c.label)]));
    g.append(el("line", { x1: x(Math.min(c.a, c.b)), x2: x(Math.max(c.a, c.b)), y1: cy, y2: cy,
                          stroke: "var(--axis)", "stroke-width": 2, "stroke-linecap": "round" }));
    g.append(el("circle", { cx: x(c.b), cy, r: 4.5, fill: S2, stroke: "var(--surface-1)", "stroke-width": 2 }));
    g.append(el("circle", { cx: x(c.a), cy, r: 4.5, fill: S1, stroke: "var(--surface-1)", "stroke-width": 2 }));
    const hit = el("rect", { x: padL - 4, y: cy - rowH / 2, width: W - padR - padL + 8, height: rowH, class: "hit" });
    bindTip(hit, `<b>${c.label}</b><span class="r">${cfg.aLabel}: ${f(c.a, 4)}<br>${cfg.bLabel}: ${f(c.b, 4)}</span>` +
      (c.tip ? `<br><span class="r">${c.tip}</span>` : ""));
    g.append(hit);
  });
  return g;
}

/* ------------------------------------------------- xy scatter / lines */
function xyPlot(cfg) {
  const W = cfg.width || 900, padL = cfg.padL || 78, padR = cfg.padR || 30, padT = 24, padB = 58;
  const H = cfg.height || 320, plotW = W - padL - padR, plotH = H - padT - padB;
  const x = cfg.logX ? logScale(cfg.xDomain[0], cfg.xDomain[1], padL, W - padR)
                     : linScale(cfg.xDomain[0], cfg.xDomain[1], padL, W - padR);
  const y = cfg.logY ? logScale(cfg.yDomain[0], cfg.yDomain[1], padT + plotH, padT)
                     : linScale(cfg.yDomain[0], cfg.yDomain[1], padT + plotH, padT);
  const g = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": cfg.title });

  (cfg.logY ? logTicks(cfg.yDomain[0], cfg.yDomain[1]) : niceTicks(cfg.yDomain[0], cfg.yDomain[1], 5)).forEach(t => {
    g.append(el("line", { x1: padL, x2: W - padR, y1: y(t), y2: y(t), stroke: "var(--grid)", "stroke-width": 1 }));
    g.append(el("text", { x: padL - 10, y: y(t) + 4, class: "tick", "text-anchor": "end" },
                        [document.createTextNode(cfg.fmtY ? cfg.fmtY(t) : f(t, 2))]));
  });
  (cfg.xTicks || (cfg.logX ? logTicks(cfg.xDomain[0], cfg.xDomain[1]) : niceTicks(cfg.xDomain[0], cfg.xDomain[1], 6)))
    .forEach(t => {
      g.append(el("text", { x: x(t), y: padT + plotH + 18, class: "tick", "text-anchor": "middle" },
                          [document.createTextNode(cfg.fmtX ? cfg.fmtX(t) : f(t, 0))]));
    });
  g.append(el("line", { x1: padL, x2: W - padR, y1: padT + plotH, y2: padT + plotH,
                        stroke: "var(--axis)", "stroke-width": 1 }));
  if (cfg.ref != null) {
    g.append(el("line", { x1: padL, x2: W - padR, y1: y(cfg.ref), y2: y(cfg.ref),
                          stroke: "var(--ref)", "stroke-width": 1.5, "stroke-dasharray": "4 3" }));
    g.append(el("text", { x: W - padR - 2, y: y(cfg.ref) - 6, class: "axtitle", "text-anchor": "end" },
                        [document.createTextNode(cfg.refLabel || "parity 1.00")]));
  }
  g.append(el("text", { x: 16, y: padT + plotH / 2, class: "axtitle", "text-anchor": "middle",
                        transform: `rotate(-90 16 ${padT + plotH / 2})` },
                      [document.createTextNode(cfg.yTitle)]));
  g.append(el("text", { x: padL + plotW / 2, y: H - 8, class: "axtitle", "text-anchor": "middle" },
                      [document.createTextNode(cfg.xTitle)]));

  cfg.series.forEach(s => {
    if (s.line) {
      const d = s.points.map((p, i) => `${i ? "L" : "M"}${x(p.x)},${y(p.y)}`).join(" ");
      g.append(el("path", { d, fill: "none", stroke: s.color, "stroke-width": 2,
                            "stroke-dasharray": s.dash || null,
                            "stroke-linejoin": "round", "stroke-linecap": "round" }));
    }
    s.points.forEach(p => {
      g.append(el("circle", { cx: x(p.x), cy: y(p.y), r: s.r || 4.5, fill: s.color,
                              stroke: "var(--surface-1)", "stroke-width": 2 }));
      const hit = el("circle", { cx: x(p.x), cy: y(p.y), r: 13, class: "hit" });
      bindTip(hit, `<b>${p.label || s.label}</b><span class="r">${p.tip}</span>`);
      g.append(hit);
      if (p.direct) {
        g.append(el("text", { x: x(p.x) + (p.dx || 0), y: y(p.y) - 12, class: "val",
                              "text-anchor": p.anchor || "middle", "font-size": 11 },
                            [document.createTextNode(p.direct)]));
      }
    });
  });
  return g;
}

/* ------------------------------------------------- horizontal bar (single) */
function hBars(rows, cfg) {
  const W = cfg.width || 880, padL = cfg.padL || 190, padR = 74, padT = 22, rowH = cfg.rowH || 26;
  const H = padT + rows.length * rowH + 44;
  const maxV = cfg.max || Math.max(...rows.map(r => r.value)) * 1.1;
  const x = linScale(0, maxV, padL, W - padR);
  const g = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": cfg.title });
  niceTicks(0, maxV, 5).forEach(t => {
    g.append(el("line", { x1: x(t), x2: x(t), y1: padT - 6, y2: padT + rows.length * rowH,
                          stroke: "var(--grid)", "stroke-width": 1 }));
    g.append(el("text", { x: x(t), y: padT + rows.length * rowH + 18, class: "tick", "text-anchor": "middle" },
                        [document.createTextNode(cfg.fmtTick ? cfg.fmtTick(t) : f(t, 0))]));
  });
  g.append(el("text", { x: (padL + W - padR) / 2, y: H - 6, class: "axtitle", "text-anchor": "middle" },
                      [document.createTextNode(cfg.xTitle)]));
  rows.forEach((r, i) => {
    const cy = padT + i * rowH + rowH / 2, bh = Math.min(15, rowH - 9);
    g.append(el("text", { x: padL - 12, y: cy + 4, class: "lab", "text-anchor": "end" },
                        [document.createTextNode(r.label)]));
    const bar = el("rect", { x: padL, y: cy - bh / 2, width: Math.max(1, x(r.value) - padL), height: bh,
                             rx: 3, fill: r.color || cfg.color || S1 });
    bindTip(bar, `<b>${r.label}</b><span class="r">${cfg.fmtVal ? cfg.fmtVal(r.value) : f(r.value, 2)}</span>` +
      (r.tip ? `<br><span class="r">${r.tip}</span>` : ""));
    g.append(bar);
    g.append(el("text", { x: x(r.value) + 8, y: cy + 4, class: "val", "font-size": 11.5 },
                        [document.createTextNode(cfg.fmtVal ? cfg.fmtVal(r.value) : f(r.value, 2))]));
  });
  return g;
}

/* -------------------------------------------- log dot plot (never log bars) */
function dotLog(rows, cfg) {
  const W = cfg.width || 880, padL = cfg.padL || 180, padR = 96, padT = 26, rowH = cfg.rowH || 26;
  const H = padT + rows.length * rowH + 46;
  const vals = rows.flatMap(r => r.points.map(p => p.v)).filter(v => v > 0);
  const lo = cfg.min || Math.pow(10, Math.floor(Math.log10(Math.min(...vals))));
  const hi = cfg.max || Math.pow(10, Math.ceil(Math.log10(Math.max(...vals))));
  const x = logScale(lo, hi, padL, W - padR);
  const g = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": cfg.title });
  logTicks(lo, hi).forEach(t => {
    g.append(el("line", { x1: x(t), x2: x(t), y1: padT - 6, y2: padT + rows.length * rowH,
                          stroke: "var(--grid)", "stroke-width": 1 }));
    g.append(el("text", { x: x(t), y: padT + rows.length * rowH + 18, class: "tick", "text-anchor": "middle" },
                        [document.createTextNode(cfg.fmtTick ? cfg.fmtTick(t) : String(t))]));
  });
  g.append(el("text", { x: (padL + W - padR) / 2, y: H - 6, class: "axtitle", "text-anchor": "middle" },
                      [document.createTextNode(cfg.xTitle)]));
  rows.forEach((r, i) => {
    const cy = padT + i * rowH + rowH / 2;
    g.append(el("text", { x: padL - 12, y: cy + 4, class: "lab", "text-anchor": "end" },
                        [document.createTextNode(r.label)]));
    const xs = r.points.filter(p => p.v > 0).map(p => x(p.v));
    if (xs.length > 1) {
      g.append(el("line", { x1: Math.min(...xs), x2: Math.max(...xs), y1: cy, y2: cy,
                            stroke: "var(--axis)", "stroke-width": 1.5, "stroke-linecap": "round" }));
    }
    r.points.forEach(p => {
      if (!(p.v > 0)) return;
      const c = el("circle", { cx: x(p.v), cy, r: 5, fill: p.color, stroke: "var(--surface-1)", "stroke-width": 2 });
      bindTip(c, `<b>${r.label} · ${p.label}</b><span class="r">${cfg.fmtVal ? cfg.fmtVal(p.v) : us(p.v)}</span>` +
        (p.tip ? `<br><span class="r">${p.tip}</span>` : ""));
      g.append(c);
    });
    if (r.right) {
      g.append(el("text", { x: W - padR + 10, y: cy + 4, class: "val", "font-size": 11.5 },
                          [document.createTextNode(r.right)]));
    }
  });
  return g;
}

/* -------------------------------------------------- histogram (counts) */
function histogram(cfg) {
  const W = cfg.width || 880, padL = 60, padR = 22, padT = 24, padB = 62;
  const H = cfg.height || 260, plotW = W - padL - padR, plotH = H - padT - padB;
  const maxV = Math.max(...cfg.series.flatMap(s => s.counts)) * 1.15;
  const y = linScale(0, maxV, padT + plotH, padT);
  const g = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": cfg.title });
  niceTicks(0, maxV, 4).forEach(t => {
    g.append(el("line", { x1: padL, x2: W - padR, y1: y(t), y2: y(t), stroke: "var(--grid)", "stroke-width": 1 }));
    g.append(el("text", { x: padL - 9, y: y(t) + 4, class: "tick", "text-anchor": "end" },
                        [document.createTextNode(f(t, 0))]));
  });
  g.append(el("line", { x1: padL, x2: W - padR, y1: padT + plotH, y2: padT + plotH,
                        stroke: "var(--axis)", "stroke-width": 1 }));
  g.append(el("text", { x: 16, y: padT + plotH / 2, class: "axtitle", "text-anchor": "middle",
                        transform: `rotate(-90 16 ${padT + plotH / 2})` },
                      [document.createTextNode(cfg.yTitle || "formulas")]));
  g.append(el("text", { x: padL + plotW / 2, y: H - 8, class: "axtitle", "text-anchor": "middle" },
                      [document.createTextNode(cfg.xTitle)]));
  const bandW = plotW / cfg.labels.length;
  const inner = Math.min(30, (bandW - 12) / cfg.series.length);
  cfg.labels.forEach((lab, li) => {
    const cx = padL + bandW * (li + 0.5);
    const total = cfg.series.length * inner + (cfg.series.length - 1) * 2;
    cfg.series.forEach((s, si) => {
      const v = s.counts[li];
      const bx = cx - total / 2 + si * (inner + 2);
      const by = y(v), bh = Math.max(0.5, padT + plotH - by);
      const bar = el("rect", { x: bx, y: by, width: inner, height: bh, rx: 2.5, fill: s.color });
      bindTip(bar, `<b>${s.label}</b><span class="r">${v} formulas break even at ${lab} evaluations</span>`);
      g.append(bar);
    });
    g.append(el("text", { x: cx, y: padT + plotH + 17, class: "tick", "text-anchor": "middle", "font-size": 11 },
                        [document.createTextNode(lab)]));
  });
  return g;
}

/* ---------------------------------------------------- heat grid (ratios) */
function heatGrid(cfg) {
  const cellW = cfg.cellW || 118, cellH = 40, padL = cfg.padL || 110, padT = 34;
  const W = padL + cfg.cols.length * cellW + 16;
  const H = padT + cfg.rows.length * cellH + 16;
  const g = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": cfg.title });
  const vals = cfg.cells.map(c => c.value);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  cfg.cols.forEach((c, ci) =>
    g.append(el("text", { x: padL + cellW * (ci + 0.5), y: padT - 12, class: "lab", "text-anchor": "middle" },
                        [document.createTextNode(c)])));
  cfg.rows.forEach((r, ri) =>
    g.append(el("text", { x: padL - 10, y: padT + cellH * (ri + 0.5) + 4, class: "lab", "text-anchor": "end" },
                        [document.createTextNode(r)])));
  cfg.cells.forEach(cell => {
    const ci = cfg.cols.indexOf(cell.col), ri = cfg.rows.indexOf(cell.row);
    if (ci < 0 || ri < 0) return;
    const t = hi === lo ? 0.5 : (cell.value - lo) / (hi - lo);
    const x0 = padL + ci * cellW + 3, y0 = padT + ri * cellH + 3;
    const rect = el("rect", { x: x0, y: y0, width: cellW - 6, height: cellH - 6, rx: 5,
                              fill: S1, "fill-opacity": (0.13 + 0.42 * (1 - t)).toFixed(3),
                              stroke: "var(--border)" });
    bindTip(rect, `<b>${cell.row} × ${cell.col}</b><span class="r">${cfg.arm} ${f(cell.value, 4)}` +
      (cell.lo != null ? `<br>95% CI [${f(cell.lo, 4)}, ${f(cell.hi, 4)}]` : "") +
      (cell.n != null ? `<br>${cell.n} formulas` : "") + `</span>` +
      (cell.basis ? `<br><span class="r">${cell.basis}</span>` : ""));
    g.append(rect);
    g.append(el("text", { x: x0 + (cellW - 6) / 2, y: y0 + (cellH - 6) / 2 + 4, class: "val",
                          "text-anchor": "middle", "font-size": 12.5 },
                        [document.createTextNode(f(cell.value, 3))]));
  });
  return g;
}

/* ================================================== page furniture */
function topbar(cfg) {
  const bar = h("div", { class: "topbar" });
  const inner = h("div", { class: "inner" });
  inner.append(h("div", { class: "brand", html: cfg.brand }));
  if (cfg.links && cfg.links.length) {
    const nav = h("nav");
    cfg.links.forEach(([href, lab]) => nav.append(h("a", { href, text: lab })));
    inner.append(nav);
  }
  const tog = h("button", { class: "themetog", type: "button", "aria-label": "Toggle light or dark theme", text: "◑ theme" });
  tog.addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.getAttribute("data-theme") === "dark" ||
      (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", dark ? "light" : "dark");
  });
  if (!cfg.links || !cfg.links.length) tog.style.marginLeft = "auto";
  inner.append(tog);
  bar.append(inner);
  return bar;
}

function section(id, eyebrow, title, lede) {
  const s = h("section", { class: "sec", id });
  if (eyebrow) s.append(h("p", { class: "eyebrow", text: eyebrow }));
  if (title) s.append(h("h2", { text: title }));
  if (lede) s.append(h("p", { class: "sectionlede", html: P(lede) }));
  return s;
}
function layBlock(paras, tag) {
  const d = h("div", { class: "lay" });
  d.append(h("span", { class: "tag", text: tag || "In plain language" }));
  [].concat(paras).forEach(p => d.append(h("p", { html: P(p) })));
  return d;
}
function techBlock(paras, tag) {
  const d = h("div", { class: "tech" });
  if (tag !== null) d.append(h("span", { class: "tag", text: tag || "The technical layer" }));
  [].concat(paras).forEach(p => d.append(h("p", { html: P(p) })));
  return d;
}
function banner(kind, title, bodyHtml) {
  const b = h("div", { class: "banner " + (kind || "") });
  if (title) b.append(h("h3", { text: title }));
  [].concat(bodyHtml).forEach(x => b.append(h("p", { html: P(x) })));
  return b;
}
function tiles(items) {
  const g = h("div", { class: "tiles" });
  items.forEach(([k, v, n]) => g.append(h("div", { class: "tile" }, [
    h("div", { class: "k", text: k }),
    h("div", { class: "v", html: v }),
    h("div", { class: "n", html: P(n) }),
  ])));
  return g;
}

/* ------------------------------------------------------ content blocks */
function domainGrid(domains) {
  const g = h("div", { class: "grid2" });
  domains.forEach(d => g.append(h("div", { class: "dom" }, [
    h("h4", { text: d.name }),
    h("p", { class: "q", html: "“" + P(d.question) + "”" }),
    h("p", { class: "t", html: P(d.lay) }),
    h("p", { class: "why", html: P(d.technical) }),
  ])));
