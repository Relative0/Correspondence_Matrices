es are compared.</b> Against plain CSE: synthetic median {{be.syn.median}} with {{be.syn.never}} of {{be.syn.total}} never, prep {{be.syn.prep}}; EPFL median {{be.epfl.median.matched}} with {{be.epflcse.never}} of {{be.epfl.total}} never, prep {{be.epflcse.prep}}. Against CSE-flat on EPFL: median {{be.epfl.median}} with {{be.epfl.never}} of {{be.epfl.total}} never ({{be.epfl.never_pct}}), prep {{be.epfl.prep}}. The synthetic-versus-plain-CSE figure and the EPFL-versus-CSE-flat figure are not a like-for-like pair and are never quoted as one.","The distributions are right-skewed with a substantial never-break-even mass in every arm, which is why the median alone is a poor summary and the histogram is shown.","Because break-even is a ratio of two small timings it moves with ordinary run-to-run variation, as does the preparation multiple. The archived run of the same synthetic corpus reports slightly different values for both; the discrepancy is recorded in section 6 under “Open discrepancies between the summary prose and the raw evidence”, and the workload-dependence conclusion is identical either way. The headline kernel ratio, by contrast, is stable across the two runs."],"figs":["breakeven","kernelForest"],"lay_verdict":"It depends on how many times — and you should find that out first","lay_verdictWhy":"this is the number that decides everything","lay_question":"I need to answer the same question thousands of times."},{"id":"sc-size","n":"03","question":"My expressions have very few live variables — or quite a lot.","verdict":"The right evaluation engine changes with the workload, not at a fixed variable count","verdictWhy":"and a rule based on variable count alone gets it wrong","lay":["There are several ways to actually compute the answer bits. One walks the expression recursively. One flattens it first and works over big integers. One packs bits into machine words and processes them in blocks.","The word-packed engine is the fastest of the three when there is enough work to do — but it pays a fixed setup cost on every call. On the expressions measured here that cost is not repaid until a fairly large number of variables matter, and below that the simple flattened approach wins by a wide margin.","The practical lesson is that a rule of the form “switch engines above six variables” is not safe. What matters is how much work there is to pack, which depends on the shape of the expression and not just on how many variables matter."],"technical":["Flat big-integer evaluation beats the recursive kernel at every support measured, with ratios of {{bx1.fvr.min}}–{{bx1.fvr.max}}. That part is unconditional.","The word-packed engine's fixed dispatch cost keeps flat fastest through live_k={{bx1.last_flat_k}} on this corpus; words only wins at live_k={{bx1.first_words_k}}, at {{bx1.k16.wvf}} of flat. At live_k=6 — where a support-only rule would have switched — words is {{bx1.k6.wvf}} <em>slower</em> than flat.","Restate the rule as an amortisation condition: word-packed evaluation wins when the packed work, roughly 2<sup>live_k</sup> words times the operation count, is large enough to absorb the fixed dispatch cost. Deck-era corpora with larger operation counts genuinely did cross at smaller supports. Both statements are corpus-scoped; neither is a universal threshold. A validated backend selector is listed as open work for exactly this reason.","Above live_k={{guard.k}} the explicit path declines rather than producing an output that doubles in size with each further variable. Across {{guard.trials}} fresh trials the guard made {{guard.wrong}} wrong decisions and let through {{guard.oversized}} oversized outputs."],"figs":["engines","guard"],"lay_verdict":"Measure it; do not use a rule of thumb","lay_verdictWhy":"the fastest choice shifts with the work, not the variable count","lay_question":"Only a few of my inputs actually change the answer — or a great many do."},{"id":"sc-canonical","n":"04","question":"I need a canonical form, an equivalence check, or a compact symbolic object.","verdict":"Use CUDD for a canonical ROBDD; use BitSet for one full vector and measure CM reuse","verdictWhy":"the required artifact and timing boundary decide the method","lay":["If your real question is “are these two things the same?” or “can I keep asking questions about this rule cheaply?”, you want a standard shape. A decision diagram gives you one: build both rules the same way, testing the inputs in the same sequence, and they are the same rule exactly when the two diagrams come out identical. No need to check every case.","In the controlled B5 test, CUDD returned exact compact graphs, but its fresh-manager build was not a speed win over CM preparation. Asking CUDD to hand back the complete answer table then forces it to do the work its graph is designed to avoid: enumerate every combination, doubling the answer count with every added variable.","The practical answer is task-specific. Use CUDD when the canonical graph or symbolic operations are the deliverable. BitSet led the measured one-shot full-vector wrapper; if you are considering CM for repeated full vectors, measure its break-even against the actual baseline rather than assuming reuse makes it win. The later real feature-model audit passed saved-artifact correctness but keeps its performance rankings provisional because several timing boundaries were not matched."],"technical":["Construction and evaluation are separate jobs that produce different artifacts. In B5, fixed-natural-order CUDD construction took {{cudd.build.min_us}}–{{cudd.build.max_us}} including fresh-manager creation and variable declaration, yielding exact graphs of {{cudd.nodes.k16}} nodes or fewer. Compactness is the result here; this fresh-manager timing is not a CUDD speed win over CM preparation.","When the endpoint was changed to the same complete packed vector, CUDD enumeration ran {{cudd.extract.min_x}}–{{cudd.extract.max_x}} slower than the CM kernel ({{cudd.kernel.min_us}}–{{cudd.kernel.max_us}}), reaching {{cudd.extract.k16_ms}} at live_k=16. The growth is structural: full extraction is linear in 2<sup>live_k</sup> assignments. This makes CM the measured winner over CUDD for that endpoint; it is not a claim that CM beats every explicit-vector method, nor that CM is a canonical symbolic replacement for CUDD.","The comparison is like-for-like: <code>robdd_is_cudd</code> held on all {{cudd.rows}} rows and CUDD's full extraction matched the CM packed bits exactly on every one, so both sides genuinely produced the same answer.","The later real feature-model battery independently replayed the saved bounded relations without correctness mismatches, but its audit labels performance provisional: cold construction was incomplete, some warm comparisons included asymmetric first-touch work, and the historical dirty implementation state was not reconstructable. Those results do not justify a newer blanket speed ranking.","Variable ordering is a real cost centre. Trying ten seeded orders and keeping the smallest graph gave {{bx2.node_saving.min_pct}}–{{bx2.node_saving.max_pct}} fewer nodes at about {{bx2.search_x.min}}–{{bx2.search_x.max}} the single-build cost. CUDD's dynamic reordering never triggered at {{bx2.max_nodes}} nodes and below — its node ratio is exactly {{bx2.reorder_ratio}} — which says this corpus is small for CUDD, not that reordering is ineffective."],"figs":["cudd","cuddOrders"],"lay_verdict":"Use CUDD for the canonical graph; use BitSet for one full vector and measure CM reuse","lay_verdictWhy":"the requested output and timing boundary determine the right method","lay_question":"I need to prove two rules are the same, or ask lots of questions about one rule."},{"id":"sc-real","n":"05","question":"My workload is real circuits, not generated formulas.","verdict":"Expect a tie against a well-built compiled baseline","verdictWhy":"the external validation is the strongest evidence here","lay":["Everything above could have been an artifact of the formula generator. So the project took a published benchmark suite of real hardware circuits it had never measured against, wrote down in advance what result would count as meaningful, and ran it.","The answer: against a carelessly built competitor CM is genuinely faster — about {{kernel.epfl.pct}}. Against a carefully built one the two came out level, with the measured difference smaller than the uncertainty in the measurement itself.","That is the honest headline. CM's case does not rest on being quicker than a well-built competitor at the computation itself, and this measurement is what settled it."],"technical":["{{epfl.n_cones}} AND/INV combinational cones extracted from {{epfl.n_circuits}} circuits in the EPFL suite ({{epfl.n_aig_files}} AIG files, upstream commit {{epfl.clone_commit}}, corpus SHA-256 {{epfl.corpus_sha}}). Confidence intervals are circuit-clustered, because cones from the same circuit are not independent observations.","Primary arm CM ÷ CSE-flat: {{flat.epfl}} [{{flat.epfl.lo}}, {{flat.epfl.hi}}]. Secondary arm CM ÷ plain CSE: {{kernel.epfl}} [{{kernel.epfl.lo}}, {{kernel.epfl.hi}}].","The mechanism check is what makes “kernel-equivalent” a claim rather than a shrug. CM's advantage over a plain CSE comes from merging chains of the same operator into single wide instructions. On AND/INV circuits every gate is binary, so flattening has already captured everything there is to merge — and the instruction-count and executed-operation ratios against CSE-flat are both exactly {{mech.instr_ratio}}. The mechanism predicted parity on this corpus, and parity is what was measured.","The cost side is worse on real circuits than on synthetic ones: preparation {{be.epfl.prep}}, and {{be.epfl.never}} of {{be.epfl.total}} cones never break even against CSE-flat."],"figs":["epflCircuits","flatForest"],"lay_verdict":"Expect a tie against a well-built competitor","lay_verdictWhy":"this is the measurement that settled the question","lay_question":"My rules come from real hardware designs, not from a generator."}],"flowchart":{"lede":"The whole of section 4 in one pass. Start at the top and stop at the first line that matches.","nodes":[{"ask":"1 · What artifact do you actually need?","arms":[{"cond":"a canonical object","then":"CUDD / ROBDD","why":"equivalence, repeated querying, compact storage"},{"cond":"just “is it satisfiable?”","then":"a SAT solver","why":"existence, not enumeration — a different question entirely"},{"cond":"the smallest expression","then":"Espresso","why":"minimisation optimises size, not evaluation speed"},{"cond":"arbitrary algebraic rewriting","then":"SymPy","why":"generality over speed"},{"cond":"an explicit answer table","then":"keep going ↓","why":"this is the regime everything below is about"}]},{"ask":"2 · How many live variables? (live_k — variables that actually change the answer, not how many exist)","arms":[{"cond":"above {{guard.k}}","then":"stop and reconsider","why":"the explicit output doubles with each further variable; this project's guard declines rather than producing it"},{"cond":"{{guard.k}} or fewer","then":"keep going ↓","why":""}]},{"ask":"3 · How many times will you evaluate this same expression?","arms":[{"cond":"once, or a handful","then":"BitSet","why":"no setup to amortise; measured fastest end-to-end at every support tested"},{"cond":"many times","then":"keep going ↓","why":"now compilation can pay for itself"}]},{"ask":"4 · What are you comparing a compiled path against?","arms":[{"cond":"a plain CSE, no flattening","then":"CM wins on the kernel","why":"about {{kernel.local.pct}} on synthetic, {{kernel.epfl.pct}} on real circuits — by merging same-operator chains"},{"cond":"a sharing-aware flattened CSE","then":"measure the actual workload and timing boundary","why":"EPFL measured {{flat.epfl}}; current B2/B4 V3 bare CM measured {{symv3.bare.overall}}, while its wrapper measured {{symv3.wrapper.overall}}"}]},{"ask":"5 · Given equivalence on speed, do you want what CM adds?","arms":[{"cond":"canonical keys, persistent cache, serialisation","then":"CM is the reason to choose CM","why":"these are structural capabilities a CSE pipeline does not give you"},{"cond":"none of those","then":"CSE-flat","why":"cheaper to prepare — {{prep.min}}–{{prep.max}} less — and just as fast per evaluation"}]},{"ask":"6 · Which evaluation kernel, once you have chosen a compiled path?","arms":[{"cond":"measure it","then":"do not use a support-only rule","why":"flat big-integer beat word-packed through live_k={{bx1.last_flat_k}} here, and word-packed was {{bx1.wvf.max}} slower at the support where a naive rule would have switched"}]}]},"flowchartLay":{"lede":"Start at the top and stop at the first line that matches your situation.","nodes":[{"ask":"1 · What do you actually want back?","arms":[{"cond":"“are these two the same?”","then":"CUDD","why":"it compresses a rule into a standard shape, so sameness becomes a quick look"},{"cond":"“is there any way at all?”","then":"a SAT solver","why":"it finds one example, or proves there is none — a different question"},{"cond":"“what is the shortest version?”","then":"Espresso","why":"it makes rules smaller, not faster"},{"cond":"“rewrite this algebraically”","then":"SymPy","why":"it can do almost anything — but it is fast at none of it"},{"cond":"the complete answer table","then":"keep going ↓","why":"everything below is about this case"}]},{"ask":"2 · How many of your inputs actually change the answer?","arms":[{"cond":"more than sixteen","then":"stop and rethink","why":"the answer table doubles with each extra one; past that it stops being something you can hold"},{"cond":"sixteen or fewer","then":"keep going ↓","why":""}]},{"ask":"3 · How many times will you ask this same question?","arms":[{"cond":"once, or a few times","then":"BitSet","why":"no setup to pay off — fastest end to end at every size measured"},{"cond":"hundreds of times","then":"keep going ↓","why":"now the setup has a chance to pay for itself"}]},{"ask":"4 · What are you comparing against?","arms":[{"cond":"something built quickly","then":"CM is genuinely faster","why":"modestly — think one part in ten, not twice as fast"},{"cond":"something built carefully","then":"do not assume either parity or a speed win","why":"the accepted CSE-flat result changes with workload structure and wrapper cost"}]},{"ask":"5 · Do you want what CM adds beyond speed?","arms":[{"cond":"recognising work it has done before, saving it, reloading it","then":"that is the reason to pick CM","why":"a plain evaluator does not offer these"},{"cond":"none of that","then":"the plain compiled evaluator","why":"cheaper to set up and just as fast to run"}]}]}},"corrections":[{"superseded_number":"0.843 [0.780, 0.894]","what_it_claimed":"The kernel advantage of CM over structural CSE, from the archived E3 experiment on a 96-formula corpus.","why_wrong":"The corpus was degenerate — its strata did not vary the structural properties the experiment was meant to isolate — so the aggregate was carrying corpus artifacts rather than a kernel effect. The corrected experiment rebuilt the corpus with a balanced generator and re-measured.","replaced_by":"{{kernel.local}} [{{kernel.local.lo}}, {{kernel.local.hi}}] on the corrected 192-formula corpus, independently reaggregated and replayed.","date_or_pass":"corrected E3, 2026-08-02"},{"superseded_number":"128× / 240×","what_it_claimed":"A multiplier-compression headline: that CM executed dramatically fewer operations than the baseline.","why_wrong":"The comparison counted CM's merged wide instructions against a baseline that had not been given sharing-aware flattening, so it was measuring the baseline's missing optimisation rather than a CM capability. Once the baseline flattens correctly, CM executes essentially the CSE operation count.","replaced_by":"Retracted outright. No replacement figure is claimed; the mechanism is n-ary instruction merging, which is a real but modest effect, and it is already reflected in the kernel ratios.","date_or_pass":"gap repair, 2026-08-02"},{"superseded_number":"CM modestly ahead at controlled live_k 12 and 16 (0.944 / 0.925)","what_it_claimed":"That at the whole-call boundary CM overtook BitSet once semantic support reached about 12, with a clear lead by 16.","why_wrong":"Measured before the gap repair and on corpora whose admission rules did not hold exact support fixed, so the strata were not comparing like with like. Re-run on corrected-admission corpora under the same protocol, the sign reverses.","replaced_by":"BitSet leads at every supported public-wrapper support measured: {{wrap.min_median}}–{{wrap.k4.median}} on the dedicated sweep, and {{b4.geomean.min}}–{{b4.geomean.max}} on the original-protocol rerun. Bounded direct kernels later completed above live_k={{guard.k}}, but the public wrapper refused every case; there is no above-guard public speed claim.","date_or_pass":"benchmark refresh B2 + B4, 2026-08-03"},{"superseded_number":"23 µs median wrapper overhead","what_it_claimed":"The fixed per-call cost of the CM wrapper.","why_wrong":"An archived figure from a different corpus and timing protocol, carried forward without re-measurement. The decomposition on the current corpus and protocol puts it much higher.","replaced_by":"{{wrap.ovh.min}}–{{wrap.ovh.max}} median on the current corpus and protocol. Note this makes the qualitative claim <em>stronger</em>, not weaker: overhead dominates the small-support boundary more decisively than the old figure suggested.","date_or_pass":"benchmark refresh B2, 2026-08-03"},{"superseded_number":"pre-repair guard and headline sweeps at n ≥ 18","what_it_claimed":"Decline rates and headline ratios for larger nominal variable counts.","why_wrong":"Measured before the gap repair changed both the baseline and the admission rules, so the numbers describe a system that no longer exists.","replaced_by":"A fresh post-repair sweep of {{guard.trials}} trials across 15 cells: depth-8 decline rates {{guard.depth8.min_pct}}–{{guard.depth8.max_pct}}, with {{guard.wrong}} wrong guards and {{guard.oversized}} oversized outputs.","date_or_pass":"benchmark refresh B4, 2026-08-03"},{"superseded_number":"“the word-packed engine wins at six variables and above”","what_it_claimed":"A universal crossover point between big-integer and word-packed evaluation at live_k = 6.","why_wrong":"The threshold was read off deck-era corpora with larger operation counts and stated as if it were a property of the support size alone. It is actually an amortisation condition on total packed work, which depends on the expression as well as its support.","replaced_by":"Workload-dependent. On the corrected-E3-scale corpus, flat big-integer stayed fastest through live_k={{bx1.last_flat_k}} and word-packed only won at live_k={{bx1.first_words_k}}. Both statements are corpus-scoped and neither is universal.","date_or_pass":"benchmark refresh BX1, 2026-08-03"},{"superseded_number":"“no cross-platform claim” (local-box scope only)","what_it_claimed":"That the kernel result was scoped to one Windows machine and no cross-machine statement was supportable.","why_wrong":"Not an error — a scope limit that has since been lifted by evidence. Recorded here because a reader of the earlier material should know the scope changed.","replaced_by":"Upgraded. Five independent Linux pods on AMD EPYC reproduced the result at {{kernel.pod.min}}–{{kernel.pod.max}}, spread {{kernel.pod.spread}}, every interval excluding parity. A cross-machine statement for this finding is now supportable.","date_or_pass":"benchmark refresh B6, 2026-08-03"}],"frontier":{"lede":"The 2026-08-03 campaign established parity against CSE-flat on B1/E3 and EPFL. The accepted 2026-08-25 V3 correction narrowed that conclusion: current B2/B4 measured a workload-specific bare CM advantage, while the public wrapper remained slower. Three fresh same-host repetitions ranged from {{symv3.repeat.min}} to {{symv3.repeat.max}}, confirming the direction while exposing run-level variation that a within-run formula interval cannot measure. A later three-pod preparation confirmation passed, while a genuinely held-out i10 feature selector failed and the simple k=16 rule transferred well. The remaining questions are therefore about preparation, boundary cost, reuse, and choosing by workload rather than declaring one universal kernel ratio.","lay":["It is worth being clear about what kind of problem is left. “Is CM faster?” has no workload-free answer: B1/E3 and EPFL measured parity at the kernel, current B2/B4 V3 measured a modest bare CM lead, and the public wrapper remained slower. The remaining questions are about total cost, choosing, and capabilities that exist on paper but have never been shown to pay.","Three of them are cheap to answer and would move the picture immediately. Three more are the experiments that would actually test whether the structural idea is worth anything beyond re-running the same expression. Two are engineering and formal gaps. And two are honest boundary questions — regions the measurements simply do not cover.","The preparation replication and first untouched selector transfer test are complete. Synthetic cache, family, context, and tracing studies now narrow the hypotheses, and a strict workload manifest makes the missing input concrete. The next useful work starts with owner-declared real traffic; dependency-gated native comparators come only if that traffic justifies them."],"technical":["The B1/E3 CM-versus-CSE-flat residual remains below its pre-registered materiality bar and is not an optimisation target. V3's separate B2/B4 bare-program result is accepted as workload-specific, not universal. Preparation remains the leading raw optimisation surface; cache, family, context, selector, and native economics require a real workload and the strongest applicable incumbent.","Several items below are marked <em>partially answered</em>. That means a preliminary experiment exists and produced a result — often a negative or CM-versus-CM one — that does not meet the success criterion the project wrote for it. Those are reported as they stand rather than upgraded by optimism."],"items":[{"id":"fr-realworkload","title":"No real deployed workload has ever been measured","status":"ranked-next-test","visual_label":"Measure real reuse","lay_statement":"Everything here answers “how many times would you have to re-run this before compiling pays off?” Nobody has yet gone and measured how many times real systems actually do re-run the same expression. Without that number, the economics stay hypothetical in both directions.","technical_statement":"This is distinct from what the external validation delivered. The EPFL campaign supplied real circuit cones and validated kernel ratios and the structure of the preparation and break-even economics on real expressions — but it measured per-formula kernel and preparation costs, not an application's actual reuse distribution or end-to-end task cost. The ranked next test is a reuse-distribution measurement on a real consumer workload, to calibrate expected reuse against predicted break-even. The candidate validation domains named by the project remain untested as workloads: configuration and policy systems, hardware verification and EDA, compiler and program analysis, and constraint satisfaction in AI systems.","why_it_matters":"Reuse count is the decision variable for the entire cost argument. Every recommendation in section 4 that says “it depends how many times” is waiting on this measurement.","what_would_change_the_picture":"<b>If it succeeds</b> — a measured reuse distribution with typical reuse well above the measured break-even — CM's economics convert from “depends on your workload” into a quantified applicability statement, and the selector gets its calibration data. <b>If it fails</b> — a distribution concentrated below break-even — real systems do not reuse compiled expressions often enough for the preparation multiple to amortise, and CM becomes a correct structural layer with no cost argument on real workloads.","sources":["deliverables_n22_24/CM_GAP_POST_ACCEPTANCE_OPTIMIZATION_DECISION_2026-08-03.md §7 ranked next tests, item 2","deliverables_n22_24/CM_GAP_EPFL_VALIDATION_2026-08-03.md — scope of what the external campaign did and did not measure"],"downside":"If real systems turn out to re-evaluate rarely, the setup premium never amortises in practice — CM becomes a correct structural layer with no cost argument on real workloads at all."},{"id":"fr-prep","title":"Preparation is profiled — and remains the top optimisation surface","status":"partially-answered","visual_label":"Reduce preparation","lay_statement":"Before CM can answer anything it does a one-time setup step costing roughly {{prep.min}}–{{prep.max}} what the simple alternative's setup costs. The deep audit traced that work and removed one redundant compilation memo safely. That improvement then reproduced on {{memo.pods}} Linux machines; a more ambitious compact-ordering idea was exact but much slower and was removed.","technical_statement":"Preparation costs {{be.syn.prep}} plain-CSE prep on the synthetic corpus, {{be.epflcse.prep}} on the external corpus against the same baseline, and {{be.epfl.prep}} against CSE-flat, with a per-case range of {{b3.prep_ratio.min}}–{{b3.prep_ratio.max}} across the compile-scaling cases. The 2026-08-25 deep audit measured a distributed profile led by interning, lowering, live-support work, structural hashing, rewrite, and canonicalisation. It removed the redundant identity memo only from the sharing-aware builder path, with exact ordered-DAG and packed-output gates. Three independent Runpod CPU flavors then measured candidate/baseline preparation at {{memo.bx1b2.min}}–{{memo.bx1b2.max}} on BX1+B2 and {{memo.epfl.min}}–{{memo.epfl.max}} on EPFL, with {{memo.mismatches}} exact mismatches, cost {{memo.cost}}, and {{memo.postflight_pods}} postflight pods. The subsequent exact rational compact-order prototype preserved all {{dpr1.rows}} smoke outputs but cost {{dpr1.time}} time and {{dpr1.peak}} traced peak memory; it was rejected and reverted.","why_it_matters":"Break-even is the preparation premium divided by the per-evaluation kernel gain, so preparation sets how large every finite break-even count is. Halving it roughly halves those counts and widens the band of workloads where compiling pays. It does not, however, rescue the never-break-even population — a formula is classified “never” exactly when the per-evaluation gain is not positive, which is a property of the comparison, not of the setup cost.","what_would_change_the_picture":"The small one-memo improvement is now cross-host confirmed. Any further preparation change needs a different measured mechanism from the rejected compact-order prototype, paired exact evidence on representative and high-sharing cases, and benefit large enough to repay compatibility and maintenance risk.","sources":["deliverables_n22_24/CM_GAP_POST_ACCEPTANCE_OPTIMIZATION_DECISION_2026-08-03.md §7 ranked next tests, item 3; §8 ranked optimizations, item 1","deliverables_n22_24/CM_BENCHMARK_REFRESH_CLAIM_MAP_2026-08-03.md rows 8 and 9","deliverables_n22_24/b3_scaling_2026_08_03/","docs/audits/2026-08-25-cm-deep-performance/CM-DEEP-PERFORMANCE-AUDIT.md","deliverables_n22_24/memo_runpod_2026_08_26/memo_runpod_audit_2026_08_26.json","docs/audits/2026-08-25-cm-deep-performance/reruns/campaign-20260826-132038/dpr1_smoke_summary.json"],"downside":"If the cost is spread thinly across several stages with no dominant one, the setup premium is intrinsic to building a reusable, storable structure — and CM is a high-reuse-only layer whose case rests entirely on what it stores, not on cost."},{"id":"fr-cache","title":"The process-local cache has synthetic all-hit evidence, not a production policy","status":"partially-answered","visual_label":"Capture real cache traffic","lay_statement":"The cache has now been tested under a deliberately easy all-hit pattern. It helped CM compared with running CM cold, but cached CM still took longer than BitSet. That answers the stale ‘never studied’ statement without proving that a durable cache would help a real application.","technical_statement":"The flag historically called persistent cache is process-local. Synthetic all-hit whole-call CM remained {{cache.whole.min}}–{{cache.whole.max}} behind BitSet, and {{cache.evals}}-evaluation execution-only ratios remained {{cache.exec.k16}} at k=16 through {{cache.exec.k4}} at k=4. No byte-LRU, durable store, production access order, working-set distribution, hit curve, eviction churn, invalidation lifecycle, RSS plateau, or production cache policy has been validated. Sampled metrics traces cannot supply exact access order for offline policy replay.","why_it_matters":"Without a universal kernel advantage, reuse is one of the remaining potential differentiators. The synthetic result narrows the claim to a real workload-distribution question.","what_would_change_the_picture":"A named owner-approved workload with artifact bytes, compile and lookup cost, exact bounded access order where separately approved, process boundaries, lifecycle and cache budgets could compare no cache, entry-LRU, byte-LRU, and cost-aware admission. Until then no production cache-policy change is justified.","sources":["docs/audits/2026-08-25-cm-deep-performance/reruns/campaign-20260826-132038/cache_process_local_summary.csv","docs/audits/2026-08-25-cm-deep-performance/reruns/campaign-20260826-132038/cache_reuse50_summary.csv","docs/audits/2026-08-25-cm-deep-performance/reruns/campaign-20260826-132038/RUN-RESULTS.md — Cache and repeated evaluation"],"downside":"If hit rates are low or highly sensitive to how much is retained, one of the three remaining differentiators is fragile, and the amortisation argument weakens on top of an already-substantial setup cost."},{"id":"fr-selector","title":"The simple k=16 rule transferred; a richer feature selector did not","status":"partially-answered","visual_label":"Validate selection","lay_statement":"CM has several internal engines. The old switch at six variables was badly wrong, so the implementation moved to a conservative switch at sixteen. On a new circuit that simple rule stayed close to the best engine. A more complicated rule trained on the old data looked plausible there but made many disastrous choices on the new circuit, so it was rejected.","technical_statement":"The older rule — big-integer evaluation below six live variables, word-packed at six and above — remains rejected: flat big-integer beat the recursive kernel at every support ({{bx1.fvr.min}}–{{bx1.fvr.max}}), stayed fastest through live_k={{bx1.last_flat_k}}, and words won only at live_k={{bx1.first_words_k}}; at k=6 words was {{bx1.k6.wvf}} slower. The current k=16 control then transferred to {{i10.rows}} untouched Berkeley ABC i10 cones spanning k={{i10.min_k}}–{{i10.max_k}}, with raw and CM regret {{i10.current.raw}} and {{i10.current.cm}} and zero catastrophic routes. A preregistered ridge selector trained only on BX1 features failed the same held-out gate: regret {{i10.feature.raw}} raw and {{i10.feature.cm}} CM, with {{i10.feature.raw.cat}} and {{i10.feature.cm.cat}} catastrophic routes. It was rejected without retuning on i10. No production feature selector is integrated.","why_it_matters":"Selection is where “different tools answer different questions” becomes an engineering deliverable rather than a slogan. Getting it wrong costs multiples silently. And a selector that cannot be shown to generalise out of sample is indistinguishable from a rule overfitted to the two corpora this project happens to own.","what_would_change_the_picture":"A replacement must first clear its tuning-corpus cross-validation catastrophe gate, then beat k=16 on another independently frozen circuit family without using i10 for tuning. Until then the honest response is to keep the simple documented threshold and treat richer automatic routing as rejected research, not a shipped advantage.","sources":["deliverables_n22_24/CM_BENCHMARK_REFRESH_CLAIM_MAP_ADDENDUM_2026-08-03.md row 15 revisited","deliverables_n22_24/CM_GAP_POST_ACCEPTANCE_OPTIMIZATION_DECISION_2026-08-03.md §4 selector proposal; §8 item 2","deliverables_n22_24/bx1_crossover_2026_08_03/","deliverables_n22_24/heldout_abc_i10_2026_08_26/CM_ABC_I10_HELDOUT_SELECTOR_PREREGISTRATION_2026-08-26.md","deliverables_n22_24/heldout_abc_i10_2026_08_26/abc_i10_selector_audit.json"],"downside":"If a fitted rule does not transfer to data it was not fitted on, it is overfitted to the two test sets this project owns, and any “automatic routing” language has to narrow to the simple policy already shipped."},{"id":"fr-canonical","title":"Current CM keys are engineering identity, not global semantic canonicality","status":"formal-not-demonstrated","visual_label":"Prove equivalence","lay_statement":"CM can give normalized structures stable engineering keys under documented rules. That is useful for caching and identity checks, but it is not a proof that every two semantically equal expressions always become one globally canonical object.","technical_statement":"The current path establishes output equality, including full 2<sup>live_k</sup> packed equality against CUDD on all {{cudd.rows}} matched rows. None of that is a canonical CM-equivalence proof. Matrix equality requires the same normalised ordered basis; a truth table, a normalised CM and a reduced ordered BDD each identify a Boolean function under their own conventions, and none of those conventions is interchangeable with the others. What CM does have is compact interned canonical <em>keys</em>, resting on a documented hash-collision assumption, with one interned twin per builder — which is an engineering property, not a promise of global object identity, and the project's own clarifications say so.","why_it_matters":"This is the capability that would distinguish CM from “a structural IR with a good cache”. Without it, the differentiator list reduces to keys, caching and serialisation — all real, all reproducible by other means.","what_would_change_the_picture":"<b>If it succeeds</b> — a defined normal form with proven invariants, exhaustive validation over small Boolean functions and bases, and canonicalisation-cost and artifact-size figures comparable to ROBDDs — “canonical keys” becomes a defensible formal claim. <b>If it fails</b>, the negative result is still worth having: it would pin down that CM canonicality depends on arbitrary basis and order choices, fix the public language permanently at “output-based equivalence”, and force the prior question the project has not answered — whether the canonical artifact offers anything that ROBDDs, AIG normalisation or canonical truth representations do not already supply.","sources":["CM slide deck, frozen at Audit V4 (2026-07-24), not in-repo — “CM Equivalence Caveat” and “Basis-Normalized Representation” slides; framing quoted, never its numbers","deliverables_n22_24/CM_GAP_POST_ACCEPTANCE_CLARIFICATIONS_2026-08-03.md","deliverables_n22_24/b5_cudd_2026_08_03_run5/"],"downside":"If no workable normal form exists, CM's most distinctive claim stays informal permanently, the public language is fixed at “same answers” rather than “same object”, and the prior question — what this buys over existing canonical forms — becomes unavoidable."},{"id":"fr-family","title":"Related-family reuse stayed behind BitSet in the accepted synthetic study","status":"partially-answered","visual_label":"Retest family reuse","lay_statement":"Synthetic families with heavy shared structure have now been measured. Reuse sometimes helped CM compared with itself and sometimes added overhead; BitSet still finished the reported high-reuse cells {{family.bitset.min}}–{{family.bitset.max}} faster. Real revisions remain unmeasured.","technical_statement":"The accepted high-reuse cells report cached CM/BitSet ratios {{family.bitset.min}}–{{family.bitset.max}}. Process-local reuse did not establish dominance over the strongest task-matched incumbent. The next test must use real edit, version, and query families and compare total task work against hash-consed CSE-flat, compiler memoisation, and applicable symbolic or incremental baselines; independently generated related formulas are not an edit trace.","why_it_matters":"This is the workload shape a structural layer is supposed to be for. If it does not pay here, the persistent cache's story collapses back to “re-run the same compiled formula many times”, and the family and versioning domains — policy versions, circuit revisions, compiler passes — drop out of scope.","what_would_change_the_picture":"<b>Question:</b> does CM's structural IR reduce cost when evaluating a family of related expressions? <b>Success:</b> preparation amortised across the family with total family cost below repeated BitSet evaluation, under fair total-cost accounting — the first demonstration that the structural layer buys something on a workload shape BitSet cannot exploit. <b>Failure:</b> structural reuse does not generalise beyond same-expression prepared evaluation, and the honest claim narrows to a scoped same-expression preparation cache.","sources":["docs/audits/2026-08-25-cm-deep-performance/reruns/campaign-20260826-132038/family_high_reuse_summary.csv","docs/audits/2026-08-25-cm-deep-performance/reruns/campaign-20260826-132038/RUN-RESULTS.md — Related-expression families"],"downside":"If reuse does not generalise past re-running one identical expression, the caching story collapses to exactly that, and the versioning and family use cases — policy revisions, circuit revisions, compiler passes — drop out of scope."},{"id":"fr-partial","title":"Partial-context reuse produced a synthetic near-parity hypothesis surface","status":"partially-answered","visual_label":"Retest partial contexts","lay_statement":"A larger synthetic grid found that caching made CM {{context.speedup.min}}–{{context.speedup.max}} faster than uncached CM. Three high-reuse n=16 cells came close to BitSet, but with only {{context.trials}} trials and artificial contexts this is a place to investigate, not a production route.","technical_statement":"At n=16 and 500 contexts, cached CM/full-recompute BitSet ratios were {{context.f25.ratio}}, {{context.f5.ratio}}, and {{context.f75.ratio}} for fixed fractions 0.25/0.50/0.75. The grid used synthetic expressions and sliding-window contexts, only {{context.trials}} trials, remaining-variable outputs, and no native CUDD restriction comparator. A real trace must preserve original and remaining support, context overlap/locality and phase changes, query counts, output kind, process/cache lifetime, and separate BDD build, restriction, query, and extraction windows.","why_it_matters":"Combined with the already-measured BitSet lead at every semantic support up to the guard, a second negative result here would mean the structural layer offers no execution-time advantage on incremental workloads either — and the value proposition would have to rest entirely on the artifacts rather than on time.","what_would_change_the_picture":"<b>Question:</b> does CM preserve reusable structure across related variable assignments? <b>Success:</b> established on real traces against CUDD restrict/cofactor and incremental SAT — not merely against uncached CM — this gives CM a defensible operational niche independent of raw kernel speed, and populates the break-even surface the selector needs. <b>Failure:</b> partial-context reuse provides no measurable advantage over BitSet.","sources":["docs/audits/2026-08-25-cm-deep-performance/reruns/campaign-20260826-132038/partial_f*_summary.csv","docs/audits/2026-08-25-cm-deep-performance/reruns/campaign-20260826-132038/partial_sliding_100_summary.csv","docs/audits/2026-08-25-cm-deep-performance/reruns/campaign-20260826-132038/RUN-RESULTS.md — Partial-context break-even surface"],"downside":"If incremental workloads show no advantage either, then combined with the already-measured loss at the whole-call boundary, the structural layer offers no execution-time advantage anywhere, and the case must rest entirely on stored artifacts."},{"id":"fr-operator","title":"Operator difference and quotient — implemented and correct, practical value unproven","status":"formal-not-demonstrated","visual_label":"Show operator value","lay_statement":"The formalism lets you ask structural questions about operators themselves: what is the difference between these two rules, can this one be factored. Those operations have been implemented and shown to be correct. Nobody has yet shown a real task where using them is cheaper or better than the obvious alternative.","technical_statement":"Directional quotienting, transpose, complement, rotations, operand swap, expression negation and operand-negation transforms are implemented and validated. The measured comparison is where care is needed: BitSet was faster for the semantic-delta task, and CM's quotient computes a <em>different artifact</em> — it is not a faster semantic XOR. The project records this as a standing anti-pattern: never benchmark the quotient as though it were a semantic-difference speed contest, because that compares two different outputs. This sits squarely in the formalism column: the artifact is a structural operator representation, and its practical performance advantage has not been benchmarked.","why_it_matters":"This is the only capability on the list that could not be reproduced by bolting CSE plus flattening onto an existing evaluator. If it never demonstrates value, the operator calculus remains a correct but unused feature and CM's public claim reduces to a well-engineered structural IR with a well-tested explicit-output path.","what_would_change_the_picture":"<b>Question:</b> do CM-native transformations produce practical workload value? <b>Success:</b> lower measured total cost than a clearly specified baseline, <em>or</em> a formally defined operator result whose practical value is demonstrated on a representative workload — this would be a capability claim rather than a speed claim. <b>Failure:</b> CM-native transformations provide no measurable advantage for this workload type.","sources":["CM_experiment_C_operator_difference_quotient_report.md","CM slide deck (frozen at V4), “Three CM-Value Experiments” card 3 — framing only"],"downside":"If no task is found where the operator transformations are cheaper or better, the formalism stays a correct but unused feature and the public claim reduces to a well-engineered structural representation with a well-tested output path."},{"id":"fr-bddhard","title":"The decision-diagram comparison has only been run where ordering barely matters","status":"partially-answered","visual_label":"Test BDD-hard families","lay_statement":"The order in which a decision diagram tests its variables can change its size dramatically — for some functions, catastrophically. The expressions measured here are all easy in that respect, so the comparison against decision diagrams has been made only in the region where their hardest failure mode never appears.","technical_statement":"The order-search question is closed with data: best-of-ten order search yielded {{bx2.node_saving.min_pct}}–{{bx2.node_saving.max_pct}} smaller graphs at {{bx2.search_x.min}}–{{bx2.search_x.max}} the single-build cost, and dynamic reordering never triggered — node ratio exactly {{bx2.reorder_ratio}} — because at {{bx2.max_nodes}} nodes and below the trigger threshold is never reached. That last fact <em>is</em> the limitation. What remains open is a controlled study over standard parameterised families with known behaviour — easy and reducible, parity-like, multiplexer, arithmetic and circuit-derived, and deliberately order-sensitive — reporting for each: fixed order, explicitly stated alternative orders, best-of-k with the full search cost, the dynamic-reordering method and its total cost, and node count, peak memory, build time and each downstream query kept separate.","why_it_matters":"Comparing a packed evaluator against decision diagrams only on diagram-friendly inputs risks reading a favourable extraction ratio as a general property. On genuinely hard families the packed path may become infeasible before the diagram does.","what_would_change_the_picture":"<b>If it succeeds</b> — a controlled sweep across friendly, hard and order-sensitive families with search and reordering costs quoted separately — the result is a defensible boundary atlas showing where each representation is feasible at all. <b>If it goes against CM</b> — diagram compactness holds on hard families while the packed path becomes infeasible because the explicit output is exponential in live support — the honest conclusion is that CM's operating region is strictly bounded by explicit-output size, and every comparison here must be scoped to workloads where a packed truth vector is the required artifact.","sources":["deliverables_n22_24/CM_BENCHMARK_REFRESH_CLAIM_MAP_ADDENDUM_2026-08-03.md row 14 revisited","deliverables_n22_24/bx2_cudd_orders_2026_08_03/","CM slide deck (frozen at V4), ongoing caveats — framing only"],"downside":"If decision diagrams stay compact on genuinely hard functions while the explicit-output path becomes infeasible, CM's operating region is strictly bounded by output size, and every comparison here must be scoped to workloads where an explicit answer table is what you actually need."},{"id":"fr-aboveguard","title":"Above the guard limit, bounded kernels work but the public boundary still refuses","status":"partially-answered","visual_label":"Map the guard boundary","lay_statement":"The system refuses to produce an explicit answer table above sixteen live variables, because the table doubles in size with every variable after that. A bounded follow-up did run the underlying exact kernels from {{guard.followup.min_k}} through {{guard.followup.max_k}}: all {{guard.followup.cases}} cases completed with {{guard.followup.mismatches}} wrong answers and {{guard.followup.timeouts}} timeouts. The public wrapper still refused every case, so this proves a small feasibility band, not permission to raise the limit or a CM speed win.","technical_statement":"The original guard remains correct: {{guard.wrong}} wrong decisions and {{guard.oversized}} oversized outputs across {{guard.trials}} earlier trials. The bounded subprocess follow-up then exercised exact direct kernels for live_k={{guard.followup.min_k}}–{{guard.followup.max_k}} under a 64 MiB estimate cap, 512 MiB RSS cap, 45-second timeout and three repetitions: {{guard.followup.cases}}/{{guard.followup.cases}} completed, with {{guard.followup.mismatches}} mismatches, {{guard.followup.timeouts}} timeouts and {{guard.followup.wrapper_non_refusals}} wrapper non-refusals. This closes the claim that nothing above the guard has been measured, but it did not compare equivalent whole-call CM and BitSet artifacts or justify a production policy change.","why_it_matters":"The evidence now separates three facts: bounded direct kernels are feasible just above the line, complete output still grows exponentially, and the supported public API intentionally refuses that region.","what_would_change_the_picture":"A caller-backed, memory-safe study would need equivalent whole-call artifacts, paired CM/BitSet timings, retained and temporary memory, and a pre-allocated refusal policy. Only then could the public guard be reconsidered; a direct-kernel feasibility result alone is insufficient.","sources":["deliverables_n22_24/b4_sweep_2026_08_03/","deliverables_n22_24/b2_wrapper_2026_08_03/","deliverables_n22_24/CM_BENCHMARK_REFRESH_CLAIM_MAP_2026-08-03.md rows 4 and 7","docs/audits/2026-08-25-cm-deep-performance/reruns/campaign-20260826-132038/above_guard_audit.json","docs/audits/2026-08-25-cm-deep-performance/reruns/campaign-20260826-132038/above_guard_raw.csv"],"downside":"Every additional live variable doubles complete-output size. Extending the sweep without a caller, equivalent artifact boundary, and hard memory protocol would spend resources without supporting a production decision."}],"roadmap":[{"priority":1,"experiment":"Measure real reuse","decision":"Commercial applicability","cost_level":1,"cost_label":"Low","what_it_settles":"Whether deployed systems repeat logic often enough for preparation to amortise."},{"priority":2,"experiment":"Harden temporary-memory estimators","decision":"Fail-closed safety","cost_level":2,"cost_label":"Medium","what_it_settles":"Whether representation-specific estimates can support a compatible default policy; no default changes during estimator work."},{"priority":3,"experiment":"Reduce measured preparation allocations","decision":"Raw optimisation","cost_level":2,"cost_label":"Medium","what_it_settles":"Whether another exact, representative, cross-host preparation improvement exists after the one-memo change."},{"priority":4,"experiment":"Capture lane-specific real traces","decision":"Cache/version/context evidence","cost_level":2,"cost_label":"Medium","what_it_settles":"Whether owner-approved traffic clears the cache, edit/version, context, or selector entry gate."},{"priority":5,"experiment":"Retest structural reuse on real traces","decision":"Execution niche","cost_level":2,"cost_label":"Medium","what_it_settles":"Whether family reuse or partial contexts beat real competitors, not merely uncached CM."},{"priority":6,"experiment":"Define and prove canonical equivalence","decision":"Formal differentiator","cost_level":3,"cost_label":"High","what_it_settles":"Whether “same structural object” can become a demonstrated claim."}],"closed":[{"title":"Does the kernel result generalise beyond the synthetic generator?","how":"External validation on real AND/INV circuit cones from a published benchmark suite, under a protocol and a materiality rule pre-registered before any external number existed.","result":"SUPPORTS GENERALIZATION TO THIS AND/INV WORKLOAD. CM ÷ CSE-flat {{flat.epfl}} [{{flat.epfl.lo}}, {{flat.epfl.hi}}]; CM ÷ plain CSE {{kernel.epfl}}. The materiality rule failed for EPFL. Later B2/B4 V3 evidence prevents upgrading that workload-scoped result into universal kernel equivalence."},{"title":"Is the result an artifact of one machine?","how":"The frozen corpus and driver replayed on {{kernel.pod.count}} independent Linux machines with SHA-256 corpus verification and exact identity-field matching.","result":"CROSS-PLATFORM REPLICATION PASSED. Per-pod geomeans {{kernel.pod.min}}–{{kernel.pod.max}}, spread {{kernel.pod.spread}}, every interval excluding parity. A cross-machine statement for this finding is now supportable, where previously none was claimed."},{"title":"How much does decision-diagram variable-order search actually cost, and does dynamic reordering help?","how":"A dedicated order-sensitivity run measuring fixed order, best-of-ten seeded orders, and dynamic reordering, with the search cost quoted separately from the build cost.","result":"CLOSED WITH DATA. Best-of-ten gave {{bx2.node_saving.min_pct}}–{{bx2.node_saving.max_pct}} smaller graphs at {{bx2.search_x.min}}–{{bx2.search_x.max}} the build cost; dynamic reordering never triggered at these sizes. The earlier caution to always quote the search total is confirmed."}]},"discipline":{"lede":"Each of these exists because breaking it produced a wrong published number at some point in this project's history.","rules":[{"rule":"Nothing is timed until both sides agree, bit for bit","lay_explanation":"Before the stopwatch starts, every method being compared has to produce exactly the same answer — every bit identical. If two methods disagree, that is a bug to fix, not a data point to quietly drop. Otherwise you can measure something fast that is simply computing the wrong thing.","technical_explanation":"Packed-equality gating across every arm and the wrapper, on every formula, before any timing is recorded. For the decision-diagram comparison this was strengthened from sampled checks to <em>full extraction equality</em> on all {{cudd.rows}} rows, so the timed comparison is provably of the same answer produced two ways. Compile-scaling cases likewise verified packed equality across all arms on every case.","what_goes_wrong_without_it":"A faster implementation that is subtly wrong looks like a win. Worse, an arm that fails on hard inputs and succeeds on easy ones gets timed only on the easy ones, which is survivorship bias dressed as a speedup.","sources":["deliverables_n22_24/CM_GAP_EPFL_VALIDATION_2026-08-03.md §2","deliverables_n22_24/b5_cudd_2026_08_03_run5/","deliverables_n22_24/b3_scaling_2026_08_03/"]},{"rule":"The pass mark for the decisive experiment was written down before the data existed","lay_explanation":"The most important measurement in the project had its success threshold fixed in advance, in a document, before anyone had a single external number. Then the experiment ran — and failed to meet the threshold. The project reported that and changed its claim, rather than looking for another way to slice the data.","technical_explanation":"The external protocol pre-registered the corpus source, cone-selection rules, arms, schedules, clustering basis and a three-condition materiality rule: the external CM ÷ CSE-flat geometric mean had to be at or below 0.95, <em>and</em> its circuit-clustered interval had to exclude parity, <em>and</em> the median break-even had to be at or below 1000. The measured result was {{flat.epfl}} [{{flat.epfl.lo}}, {{flat.epfl.hi}}] — the first two conditions failed. That failure makes parity the final posture for the EPFL AND/INV workload. The later B2/B4 V3 result is reported separately and rules out silently generalising that posture to every workload.","what_goes_wrong_without_it":"Without a threshold fixed in advance, any result can be narrated as a success. Pre-registration is what makes a negative result informative instead of merely disappointing.","sources":["deliverables_n22_24/CM_GAP_EPFL_PROTOCOL_2026-08-03.md","deliverables_n22_24/CM_GAP_EPFL_VALIDATION_2026-08-03.md §3"]},{"rule":"Confidence intervals are clustered on the right unit","lay_explanation":"If you time the same expression seven times, you have not measured seven expressions — you have measured one, seven times. Treating those as seven independent facts makes your error bars look far tighter than they are. Every interval on this site is built by resampling the thing that is actually independent.","technical_explanation":"The inferential unit is the formula, the cell, the source circuit, or the machine — never the timing round. The synthetic corpus uses a stratified-by-cell bootstrap; the external corpus uses a circuit-clustered bootstrap, because {{epfl.n_cones}} cones come from only {{epfl.n_circuits}} circuits and cones from one circuit share structure; machines are reported individually and never pooled. Circuit clustering makes the external interval wider than a cone-level interval would be, and that width is the honest one.","what_goes_wrong_without_it":"Pseudo-replication. Repeated rounds inflate the effective sample size, intervals shrink toward zero width, and a difference that is well within run-to-run noise acquires the appearance of statistical significance.","sources":["deliverables_n22_24/CM_GAP_EPFL_PROTOCOL_2026-08-03.md","deliverables_n22_24/epfl_run_2026_08_03/","deliverables_n22_24/b6_pod_replication_2026_08_03/"]},{"rule":"The two measurement orders are reported separately and never averaged","lay_explanation":"You can time one method fully and then the other, or you can alternate between them. Those two orders leave the computer's fast temporary memory in different states, so they are genuinely two different measurements. Reporting only their average hides which one you did — so both are always shown.","technical_explanation":"Blocked and round-robin schedules are reported as separate columns wherever both are measured, and are never pooled into a single figure. The campaigns that measure both are the corrected kernel experiment, its replay, the cross-machine replication and the external validation. The wrapper-boundary, guard, engine-crossover and order-sensitivity runs are blocked-only and say so on their reports.","what_goes_wrong_without_it":"An earlier pass in this project attributed a schedule effect to a real performance difference. Once the two orders were separated the effect was visible as what it was. Pooling would have hidden it permanently.","sources":["deliverables_n22_24/b1_e3_replay_2026_08_03/","deliverables_n22_24/b6_pod_replication_2026_08_03/","deliverables_n22_24/b2_wrapper_2026_08_03/"]},{"rule":"Every summary number is recomputed from the raw rows by someone other than the code that produced it","lay_explanation":"The program that runs a benchmark also prints a summary. That summary is not trusted. A separate program re-reads the individual measurements and recomputes every headline figure from scratch, and the two have to match before anything is published.","technical_explanation":"Independent reaggregation from the raw per-formula rows precedes citation of any statistic. The corrected kernel experiment was reaggregated by a third-party pass in which every summary row reproduced to within floating-point tolerance, break-even reproduced exactly on all formulas, and all stratified intervals agreed. This page does the same thing again: every figure here is recomputed by the build script from the raw evidence files, never copied from a report's prose.","what_goes_wrong_without_it":"A bug in the summarising code becomes a published result. Two separate passes in this project's history found exactly that.","sources":["deliverables_n22_24/CM_GAP_INDEPENDENT_SPOT_REPLICATION_2026-08-03.md","deliverables_n22_24/epfl_run_2026_08_03/"]},{"rule":"Corpora are frozen and fingerprinted","lay_explanation":"The set of test expressions is fixed and given a short fingerprint derived from its exact contents. Every machine that runs the benchmark re-checks that fingerprint first. If one character changed, the run stops. So when five machines report different timings, you know it is the machines that differ and not the questions they were asked.","technical_explanation":"Corpora carry SHA-256 digests recorded in the campaign manifest and verified at each point of use. The cross-machine replication verified the corpus digest on every machine and additionally required the identity fields of every row to match exactly. The external corpus's upstream source is pinned to a specific commit with per-file digests and a licence digest recorded.","what_goes_wrong_without_it":"Silent corpus drift. Two runs disagree and there is no way to tell whether the workload or the machine changed.","sources":["deliverables_n22_24/cm_benchmark_refresh_manifest_2026_08_03.json","deliverables_n22_24/cm_gap_epfl_provenance_2026_08_03.json","deliverables_n22_24/b6_pod_replication_2026_08_03/"]},{"rule":"Every timing is labelled with what it actually includes","lay_explanation":"“How long did it take?” is ambiguous. Did that include building the compiled program, or not? Did it include getting the answer back out? Every number here says which, because comparing a figure that includes setup against one that does not is the easiest way to publish a wrong ratio.","technical_explanation":"Timings are typed: preparation, kernel, end-to-end call, extraction, and — for decision diagrams — build, sampled evaluation and full extraction, each reported separately. The build window convention is stated explicitly wherever two runs use different ones: the matched comparison's build includes creating a fresh manager and declaring variables, while the order-sensitivity run's build is expression-to-diagram conversion only. Those two are never plotted on the same axis.","what_goes_wrong_without_it":"A superseded wrapper-overhead figure in this project's history was carried forward from a different corpus and timing protocol without re-measurement, and understated the real cost by a large factor.","sources":["deliverables_n22_24/b5_cudd_2026_08_03_run5/","deliverables_n22_24/bx2_cudd_orders_2026_08_03/","deliverables_n22_24/b2_wrapper_2026_08_03/"]},{"rule":"Only matched pairs are aggregated, and every refusal is recorded","lay_explanation":"If one method manages a hard case and the other gives up, that pair cannot be averaged into a speed comparison — you would be crediting one method for the cases where its competitor was absent. Only cases where both methods answered are counted, and every case where one declined is reported separately.","technical_explanation":"Failure-aware paired reporting: unmatched observations are excluded from ratio aggregation, and skips, guard trips and runtime refusals are counted and published rather than dropped. The external campaign reported {{epfl.n_cones}} of {{epfl.n_cones}} rows successful with zero runtime-guard skips; the guard sweep reports the decline rate for every cell alongside the timings.","what_goes_wrong_without_it":"Survivorship bias. The arm that fails more often on hard inputs is measured only on easy ones and appears faster than it is.","sources":["deliverables_n22_24/CM_GAP_EPFL_VALIDATION_2026-08-03.md §2","deliverables_n22_24/b4_sweep_2026_08_03/"]},{"rule":"Building a thing and using a thing are never merged into one ranking","lay_explanation":"Some tools spend effort up front to make later questions cheap; others do no setup and pay on every question. Adding those two costs into a single “speed” number produces a ranking that is meaningless for both. They are always shown as separate panels.","technical_explanation":"Construction cost and evaluation or extraction cost are measured, reported and plotted as distinct quantities. There is no three-way winner anywhere on this site, and there is deliberately no blended ranking across tools that produce different primary artifacts.","what_goes_wrong_without_it":"A canonical-form engine looks terrible at a job it was never designed for, or an evaluator looks free because its setup was charged to a different column.","sources":["deliverables_n22_24/b5_cudd_2026_08_03_run5/","deliverables_n22_24/CM_BENCHMARK_REFRESH_CLAIM_MAP_2026-08-03.md row 13"]},{"rule":"The workload axis is live_k, not how many variables exist","lay_explanation":"How big a job is depends on how many things actually matter, not on how many things are lying around. Charts plotted against the total number of variables silently mix easy sparse problems with hard dense ones and produce curves that mean nothing.","technical_explanation":"Semantic support is measured, not assumed, and is the horizontal axis of every chart here with one stated exception: the guard chart, whose question — how often is a randomly drawn expression from a namespace of this size declined — is genuinely about the namespace. The axis choice was itself verified: holding semantic support fixed while varying the ambient namespace across {{b4.ambient_ns}} moves the ratio by {{b4.k16.spread}}, and on that chart nominal n appears as the series rather than the axis.","what_goes_wrong_without_it":"Shallow sparse formulas and all-live formulas get compared as if they were the same size of problem, and any resulting scaling curve is an artifact of the mix.","sources":["deliverables_n22_24/b4_sweep_2026_08_03/","deliverables_n22_24/CM_BENCHMARK_REFRESH_CLAIM_MAP_2026-08-03.md row 6"]},{"rule":"Withdrawn numbers are named, not deleted","lay_explanation":"When a published figure turns out to be wrong, it is listed in a standing correction table alongside the reason it was wrong and what replaced it — rather than quietly disappearing. Anyone who read the old material can find out exactly what changed.","technical_explanation":"A standing erratum and claim map name every superseded figure with its status — confirmed, revised, or superseded — and its replacement. On this site those figures appear in exactly one place, the corrections ledger, struck through, and are never plotted. Where the summary prose and the raw evidence still disagree, that disagreement is published too rather than resolved silently in favour of the nicer number.","what_goes_wrong_without_it":"Superseded figures leak back into later material because nobody recorded that they were withdrawn. This has happened in the project's history and is what the ledger exists to prevent.","sources":["deliverables_n22_24/CM_GAP_CONSOLIDATED_AUDIT_AND_ERRATUM_2026-08-02.md","deliverables_n22_24/CM_GAP_FILE_INDEX_AND_SUPERSESSION_2026-08-02.md","deliverables_n22_24/CM_BENCHMARK_REFRESH_CLAIM_MAP_2026-08-03.md"]},{"rule":"Reproduce a reported finding before fixing it — and be willing to refute it","lay_explanation":"When an outside reviewer reports a problem, the first step is to reproduce it independently, not to fix it. Several reported problems turned out to be real; at least one turned out to be wrong, and was recorded as refuted rather than fixed to be agreeable.","technical_explanation":"Externally reported findings are independently reproduced before any change is made, and are refuted where the evidence does not support them. In the consolidated corrective pass, six of seven external findings were confirmed and addressed and one was refuted on the evidence. A separate formal argument about decision-diagram size was refuted as stated while its practical conclusion was upheld — the exact bound in the argument was wrong, and node counts do not imply byte size or runtime, but the practical conclusion it supported survived.","what_goes_wrong_without_it":"Agreeableness masquerading as rigour. Fixing a non-problem adds risk and hides the fact that the reviewer's model was wrong.","sources":["deliverables_n22_24/CM_GAP_CONSOLIDATED_AUDIT_AND_ERRATUM_2026-08-02.md","deliverables_n22_24/CM_GAP_DEEP_FOLLOWUP_2026-08-02.md"]}]},"chain":[{"stage":"Audit V2 — review of unreviewed third-party changes","date":"2026-07-21","what_was_checked":"Whether a set of externally contributed changes should be kept, and whether seven associated claims held up.","outcome":"All third-party changes kept. A real fairness bug was confirmed: a large-namespace flag was being applied asymmetrically between the arms, so published ratios at larger namespaces were not like-for-like and were superseded."},{"stage":"Audit V3 — adversarial review, then an independent review of that review","date":"2026-07-23","what_was_checked":"Seven findings about evaluator correctness, variance estimation, generator structure and engine parity — then all seven re-checked by a separate pass.","outcome":"All seven findings confirmed, including one that <em>refuted</em> a prior claim rather than supporting it. Several survived only with narrower wording. Latent gaps identified in the same pass were fixed."},{"stage":"Audit V4 — latent-fix verification and three matched comparisons","date":"2026-07-24","what_was_checked":"Whether the V3 fixes were correct within their stated blast radius, plus three honest head-to-head comparisons including native decision-diagram construction.","outcome":"All fixes confirmed correct with no production mismatch. This is the state the slide deck is frozen at — and the state most of whose measured numbers the 2026-08-03 campaign has since superseded."},{"stage":"Gap audit — adversarial review of the benchmark gap analysis","date":"2026-08-01","what_was_checked":"Corpus construction, compilation risk, formula-level replication, schedule labelling, survivorship, and the fairness of the baseline.","outcome":"Directionally right on every count, and it exposed that the controlled strata were built from a single formula each — so the inferential unit was one, not seven."},{"stage":"Deep follow-up — audit of both the gap analysis and the gap audit","date":"2026-08-02","what_was_checked":"Whether the two preceding documents were themselves correct.","outcome":"Both contained load-bearing errors. The decisive new defect: an instruction count was being used as an executed-operation count, which is not the same thing — and flattening duplicates shared work, so a naive flattened baseline was doing more work than it needed to. That is the finding that eventually retracted the largest headline in the project."},{"stage":"Gap repair — production repair, then an adversarial merge review","date":"2026-08-02","what_was_checked":"Whether the defects could be removed at the cause rather than annotated, and whether the repair itself was sound.","outcome":"All gating claims confirmed and then removed at the cause: sharing-aware flattening added to the baseline, a memoised evaluator, and a proper CSE baseline. The merge review found further concerns, which were fixed in a final pass."},{"stage":"Corrected kernel experiment and consolidated erratum","date":"2026-08-02","what_was_checked":"Seven externally reported findings, and a rebuilt experiment on a balanced corpus with the repaired baseline.","outcome":"Six findings confirmed and addressed, one refuted on the evidence. The rebuilt experiment produced the current headline. The archived figure it replaced, and the retracted compression headline, were entered into a standing erratum."},{"stage":"Final acceptance review, then independent spot replication","date":"2026-08-03","what_was_checked":"Whether the corrective pass was ready for outside review; then, by a third party, whether every summary statistic could be reproduced from the raw rows.","outcome":"Accepted, then INDEPENDENT REAGGREGATION PASSED. The corpus regenerates byte-identically under different hash seeds; every summary row reproduced to floating-point tolerance; break-even reproduced exactly on every formula; all stratified intervals agreed."},{"stage":"Post-acceptance optimisation decision — kernel equivalence declared provisional","date":"2026-08-03","what_was_checked":"Given the accepted evidence, what to optimise next — and what not to.","outcome":"Kernel equivalence with a flattened CSE selected as the operating posture, explicitly PROVISIONAL pending the external campaign. Kernel work on the residual rejected as below the materiality bar. Priorities moved to preparation cost, cache behaviour and backend selection."},{"stage":"Benchmark refresh, local legs — replay, wrapper boundary, compile scaling, guard sweep","date":"2026-08-03","what_was_checked":"Whether the headline replays; where the whole-call boundary actually sits; whether compilation tracks the shared graph; whether the guard is ever wrong.","outcome":"Replay confirmed with identity fields exact. Wrapper claim REVISED — the earlier “CM ahead at 12 and 16” did not survive. Compile scaling confirmed. Guard confirmed with {{guard.wrong}} wrong decisions in {{guard.trials}} trials."},{"stage":"Matched decision-diagram comparison on a Linux machine","date":"2026-08-03","what_was_checked":"Construction and extraction costs against the packed kernels, on the same box, with full extraction equality rather than sampled checks.","outcome":"Confirmed with matched-cost evidence that a prior audit had been unable to obtain. Correctness gates held on all {{cudd.rows}} rows."},{"stage":"Cross-platform replication on five independent machines","date":"2026-08-03","what_was_checked":"Whether the kernel headline is a property of one Windows box.","outcome":"CROSS-PLATFORM REPLICATION PASSED on {{kernel.pod.count}} of {{kernel.pod.count}} evidence machines, spread {{kernel.pod.spread}}, every interval excluding parity. Two further machines failed before measurement on an infrastructure fault and are recorded as such."},{"stage":"External validation on real circuits","date":"2026-08-03","what_was_checked":"The pre-registered protocol, on {{epfl.n_cones}} cones from {{epfl.n_circuits}} published circuits, with the materiality rule fixed in advance.","outcome":"EXTERNAL VALIDATION SUPPORTS GENERALIZATION. The materiality rule failed, converting kernel equivalence from provisional to FINAL. The mechanism check — instruction and executed-operation ratios both exactly {{mech.instr_ratio}} — predicted parity on this corpus before it was observed."},{"stage":"Optional gap runs — engine crossover and order sensitivity","date":"2026-08-03","what_was_checked":"The two claim-map rows that had not been re-run: the engine crossover point, and decision-diagram order search.","outcome":"Crossover REVISED to workload-dependent. Order search CLOSED with data: best-of-ten is genuinely smaller at a real search cost, and dynamic reordering never triggers at these graph sizes."},{"stage":"Deep performance and symmetric-boundary reconciliation","date":"2026-08-25/26","what_was_checked":"Preparation cost, exact backend selection, the strongest CSE-flat comparator, public-wrapper boundaries, above-guard feasibility, cache/family/context reuse, and held-out selector transfer.","outcome":"One redundant preparation memo was removed and replicated cross-host. Bare symmetric V3 measured {{symv3.bare.overall}} while the wrapper measured {{symv3.wrapper.overall}}; direct above-guard kernels completed exactly while the wrapper refused. Synthetic reuse narrowed hypotheses, and the frozen feature selector failed the untouched i10 gate."},{"stage":"Metrics tracing, workload intake, dependency feasibility, and memory safety","date":"2026-08-26/27","what_was_checked":"Whether low-overhead anonymous tracing could identify real opportunities, whether a real owner/caller existed, whether pinned native dependencies resolved under the authorized contract, and whether the temporary-memory estimate could support a default.","outcome":"One-in-{{trace.sample_every}} tracing was retained only as a bounded diagnostic at {{trace.v3.ratio}}. The strict workload template remains not ready with {{workload.blockers}} blockers. Dependency resolution stopped before Numba/CUDD algorithms. The dense estimate underpredicted diagnostic peaks by {{memory.multiple.min}}–{{memory.multiple.max}}, so no default changed."},{"stage":"Audit-tool consolidation and current validation","date":"2026-08-27","what_was_checked":"Whether exact-file provenance hashing could be consolidated without coupling distinct timing and corpus contracts, and whether the resulting repository remained green.","outcome":"{{dpr3.helpers.before}} duplicate SHA-256 helpers became {{dpr3.helpers.after}} streaming helper. Exactness/integration passed but the tiny smoke failed timing gates, so no performance claim is made. Current validation: {{tests.focused}} focused tests and {{tests.full}} tests plus {{tests.full.subtests}} subtests full-suite."}],"glossary":[{"term":"Boolean function","group":"boolean-basics","lay":"A rule that takes a set of yes/no inputs and produces a single yes/no answer. “Is this person allowed in?” given whether they are staff, whether their pass is valid, and whether it is out of hours.","technical":"A mapping from {0,1}ⁿ to {0,1}. Everything on this site is about representing, evaluating and comparing such mappings."},{"term":"truth table","group":"boolean-basics","lay":"A complete list: every possible combination of inputs, and the answer for each. It says nothing about how the answer is produced — only what it is.","technical":"The explicit enumeration of a Boolean function's outputs over all 2ⁿ input assignments, under a fixed variable ordering. Complete, canonical for that ordering, and exponential in size."},{"term":"variable ordering","group":"boolean-basics","lay":"The sequence in which you consider the inputs. It makes no difference to the answer, but for some representations it makes an enormous difference to how big the representation is.","technical":"A total order on the variable set. Decision diagrams are canonical only with respect to a fixed order, and their size can vary from linear to exponential across orders for the same function."},{"term":"canonical form","group":"boolean-basics","lay":"A standard way of writing something down such that two things that mean the same thing look identical. Once you have it, checking sameness is just checking whether the two look alike.","technical":"A representation with the property that semantically equivalent objects map to syntactically identical artifacts under fixed conventions. Reduces equivalence checking to identity comparison."},{"term":"equivalence checking","group":"boolean-basics","lay":"Proving that two differently written rules always give the same answer — for every possible input, not just the ones you tried.","technical":"Deciding whether two Boolean functions are identical. Approaches differ fundamentally: compare complete outputs, compare canonical graphs in a shared manager, or prove the difference unsatisfiable."},{"term":"satisfiability (SAT)","group":"boolean-basics","lay":"The question “is there any way at all to make this come out true?” Answering it does not require listing every possibility — good solvers find one answer, or prove none exists, without enumerating.","technical":"The decision problem for existence of a satisfying assignment. An existential question, distinct from the exhaustive-enumeration questions the evaluators on this site answer."},{"term":"cofactor","group":"boolean-basics","lay":"What is left of a rule once you fix one of its inputs. Fix “is staff = yes” and you get a simpler rule about everything else.","technical":"The restriction of a function obtained by fixing one variable to a constant. The basic operation underlying decision-diagram construction and partial evaluation."},{"term":"AIG / AND-INV graph","group":"boolean-basics","lay":"A way of writing a circuit using only two-input ANDs and inverters. Restrictive, but it makes a lot of automated reasoning simpler, so it is a common exchange format for real designs.","technical":"An And-Inverter Graph: a DAG of two-input AND nodes with optional edge complementation. The format of the external benchmark circuits used on this site."},{"term":"combinational cone","group":"boolean-basics","lay":"One output of a circuit, together with everything feeding into it. Circuits have many outputs; a cone is the self-contained rule behind one of them.","technical":"The transitive fan-in of a single output in a combinational network. The external corpus is built from cones admitted by semantic-support bounds."},{"term":"two-level minimisation","group":"boolean-basics","lay":"Rewriting a rule as a short list of “all of these at once” groups joined by OR — and making that list as short as possible. It is what you want if the next step is turning the rule into physical gates.","technical":"Minimisation to sum-of-products form. The AND-groups are called product terms or implicants; the dual form, OR-groups joined by AND, is the one whose groups are called clauses. Optimises expression size, not evaluation speed."},{"term":"common subexpression elimination (CSE)","group":"boolean-basics","lay":"Noticing that the same sub-calculation appears several times and doing it only once. The workhorse optimisation behind every compiled evaluator here, and the baseline CM has to beat.","technical":"Rewriting an expression tree into a shared DAG so structurally identical subexpressions become a single node, typically by hash-consing. Evaluated once per node rather than once per occurrence."},{"term":"hash-consing","group":"boolean-basics","lay":"Giving every distinct piece of an expression a fingerprint, and keeping only one copy of each. If you build the same piece twice, you get the same object back rather than a duplicate.","technical":"Interning structurally identical subterms via a hash table keyed on the node's constructor and children, so structural equality becomes pointer equality. The mechanism underlying both CSE and CM's canonical keys."},{"term":"sharing-aware flattening","group":"boolean-basics","lay":"Collapsing a chain of the same operation into one wide ope
