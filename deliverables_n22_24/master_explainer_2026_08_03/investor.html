ration — but only where doing so does not force you to redo work you were already sharing. Adding this to the baseline is what closed most of CM's apparent kernel advantage.","technical":"n-ary flattening of associative operator chains that respects the shared DAG, avoiding the duplication a naive flatten introduces at shared nodes. Its absence from an earlier baseline is the cause of a retracted headline in this project's history."},{"term":"n-ary instruction merging","group":"boolean-basics","lay":"Turning “A and B, then and C, then and D” into a single “and all four of these”. Fewer, wider steps. This is the entire mechanism behind CM's measured kernel advantage over an unflattened baseline.","technical":"Emitting one wide instruction for an associative operator chain instead of one instruction per binary application. Predicts parity on corpora with no mergeable chains — which is exactly what the AND/INV external corpus showed."},{"term":"DAG versus tree (sharing)","group":"boolean-basics","lay":"The same expression can be drawn as a tree, where every repeated piece is written out again, or as a graph, where repeats point back to one copy. The tree can be astronomically bigger for the same rule.","technical":"The sharing factor is unfolded occurrences divided by structural DAG nodes. Compilation cost tracking DAG nodes rather than unfolded occurrences is what makes highly shared expressions cheap to compile."},{"term":"bit-parallel / packed evaluation","group":"boolean-basics","lay":"Instead of working out the answer for one input combination at a time, pack many combinations into a single machine word and compute them all at once with one instruction.","technical":"Evaluating a Boolean function over many assignments simultaneously by packing assignment bits into machine words and applying bitwise operations. The output remains exponential in semantic support."},{"term":"word-packed versus big-integer evaluation","group":"boolean-basics","lay":"Two ways to hold the packed bits: as a list of machine-sized chunks, or as one arbitrarily large number. Chunks are faster once there is enough work; the big number wins when there is not, because it has less setup.","technical":"The words engine operates over arrays of fixed-width words with a fixed dispatch cost; the bigint engines operate over Python arbitrary-precision integers. Which is faster is an amortisation question, not a fixed variable-count threshold."},{"term":"BitSet","group":"representations","lay":"The plain packed-bit executor: it computes the whole answer table using ordinary bitwise instructions and essentially no setup. It is the comparison arm CM has to beat at the whole-call boundary, and it wins at every size measured here.","technical":"The bare packed kernel used as the wrapper-boundary baseline. No structural artifact, no cache, no canonical key — and correspondingly no overhead to amortise."},{"term":"CM (Correspondence Matrix)","group":"representations","lay":"A Boolean operator written as an ordered grid of bits, treated as an object in its own right rather than as a list of answers.","technical":"An ordered binary matrix representation of a Boolean operator. Uniqueness is relative to an ordered variable basis; matrix equality requires the same normalised ordered basis on both sides."},{"term":"LM (Logic Matrix)","group":"representations","lay":"A second matrix form built under a different construction convention. It expresses the same things a CM does, written a different way.","technical":"A related matrix representation in the CM family, distinguished by its construction convention rather than by what it can express."},{"term":"dense CM","group":"representations","lay":"The fully written-out matrix. Only built when the matrix itself is what you asked for — it grows exponentially with the number of variables that matter.","technical":"The materialised CM matrix, exponential in semantic support. Not the artifact produced on the packed evaluation path, and not optimised for raw execution speed."},{"term":"no-reinflate","group":"representations","lay":"Producing the packed answer without ever building the full matrix along the way. Building it and then throwing it away would cost far more than the answer is worth.","technical":"The CM execution path that emits reduced packed output directly, skipping dense matrix materialisation when the requested artifact is a truth vector."},{"term":"IR (intermediate representation)","group":"representations","lay":"The internal form a system compiles your expression into before running it — not what you wrote, and not the final answer, but the working form in between.","technical":"CM's structural IR is a shared DAG over interned nodes, from which an executable instruction program is lowered."},{"term":"structural hash / persistent cache","group":"representations","lay":"A fingerprint of the compiled form, used to remember what has already been built so an identical expression can reuse it instead of being compiled again.","technical":"A digest-keyed cache of compiled structural IR, returning one object per digest. Its steady-state hit rate and size sensitivity under realistic mixes are unmeasured — one of the named open items."},{"term":"ordered CM basis","group":"representations","lay":"The agreed sequence of variables that a matrix is written relative to. Two matrices only mean the same thing if they were written against the same sequence.","technical":"The ordered variable basis defining CM uniqueness. Basis-normalised comparison is a precondition for any matrix-equality claim."},{"term":"bra/ket measurement","group":"representations","lay":"Reading one specific fact out of the matrix by multiplying it against a pair of pick-one-thing vectors — the equivalent of asking the operator a single question instead of unpacking all of its answers.","technical":"Logical measurement using ordered bra and ket vectors against the CM. Present in the formalism; its practical performance advantage has not been benchmarked."},{"term":"ROBDD","group":"representations","lay":"A compressed decision tree with all duplicate branches merged. For a fixed variable order it is canonical: two functions are the same exactly when their graphs are the same.","technical":"Reduced Ordered Binary Decision Diagram. Canonical under a fixed variable order; size is order-sensitive, and extracting an explicit truth vector requires one traversal per assignment."},{"term":"CUDD","group":"representations","lay":"The widely used library that implements decision diagrams. When this site says “CUDD”, it means measurements made with the real native library, not a re-implementation.","technical":"The Colorado University Decision Diagram package, used natively. Every measured row carries a flag confirming the native library was in use, and full-extraction equality against the packed bits was verified on every row."},{"term":"fixed-order build","group":"representations","lay":"Building a decision diagram using one prescribed variable order, without searching for a better one.","technical":"A single build under a prescribed natural order, with no order search and no dynamic reordering. The convention used for the matched cost comparison."},{"term":"selected isolated build","group":"representations","lay":"The build time of whichever attempt a search decided to keep. Importantly, that is not necessarily the fastest attempt — it is the one that produced the smallest graph.","technical":"The build interval of the trial retained by the configured selection objective, which prioritises node count and only then build time. Quoting it without the search total understates the true cost."},{"term":"order search total","group":"representations","lay":"The full cost of trying several variable orders and keeping the best. It is the honest figure to quote if you searched, because you paid for every attempt, not just the winner.","technical":"The summed cost of all trial builds in a best-of-k order search. On this site it is reported beside the single-build cost and never omitted."},{"term":"dynamic reordering","group":"representations","lay":"A decision-diagram library rearranging its own variable order automatically when the graph grows too large. On the graphs measured here it never activated, because they never got big enough to trigger it.","technical":"Automatic variable-reordering triggered by node-count growth thresholds. Node ratio was exactly {{bx2.reorder_ratio}} across all strata here, which characterises this corpus as small for the library rather than characterising reordering."},{"term":"nominal n","group":"workload-and-timing","lay":"How many variables exist in the surrounding system. Not a measure of how big the job is — most of them may be irrelevant to the expression at hand.","technical":"The size of the variable namespace. Measured here to be irrelevant to cost at fixed semantic support."},{"term":"syntactically used variables","group":"workload-and-timing","lay":"The variables that literally appear in the expression as written. Some of them may still have no effect on the answer.","technical":"Variables occurring in the expression's syntax. An upper bound on semantic support, not equal to it."},{"term":"semantic support / live_k","group":"workload-and-timing","lay":"How many variables actually change the answer. This is the honest measure of how big a job is, and it is the horizontal axis of nearly every chart here.","technical":"The number of variables the function genuinely depends on, measured rather than assumed. Explicit output size is 2^live_k. A variable can appear syntactically and be semantically dead."},{"term":"guard skip","group":"workload-and-timing","lay":"The system declining to produce an explicit answer table because it would be too large. A deliberate refusal, recorded as such, not a failure.","technical":"An intentional refusal above the explicit-output guard at live_k={{guard.k}}. Skips are counted and reported; across {{guard.trials}} fresh trials there were {{guard.wrong}} incorrect guard decisions and {{guard.oversized}} oversized outputs."},{"term":"wrapper","group":"workload-and-timing","lay":"The whole end-to-end call: everything from handing over your inputs to getting the answer back, including all the bookkeeping in between — not just the computation itself.","technical":"The full call path including argument binding, environment setup, cache lookup, kernel execution and result extraction. Distinguished throughout from the kernel."},{"term":"kernel","group":"workload-and-timing","lay":"The computation proper, with the setup and teardown stripped away. Two systems can have identical kernels and very different end-to-end costs.","technical":"The steady-state execution of the compiled program with environment and program prebuilt. At this boundary CM/CSE-flat measured parity on B1/E3 and EPFL, but a workload-specific CM advantage on current B2/B4 V3."},{"term":"wrapper overhead","group":"workload-and-timing","lay":"The difference between the end-to-end call and the computation proper — the fixed price of using the system at all. Roughly constant, which is why it dominates when the actual work is small.","technical":"End-to-end call time minus kernel time, {{wrap.ovh.min}}–{{wrap.ovh.max}} median on the current corpus and protocol. Not separable at the smallest stratum, where the fallback engine is used."},{"term":"preparation (prep) cost","group":"workload-and-timing","lay":"The one-time cost of compiling an expression before you can evaluate it. The prep <em>multiple</em> is that cost expressed as a ratio against a named baseline — and the baseline must always be named, because it changes the number.","technical":"Compilation cost, linear in structural DAG nodes. Geometric-mean multiple against plain CSE and against CSE-flat differ and are never interchanged. It is now profiled, has one accepted memo-reduction improvement, and remains the top-ranked optimisation surface."},{"term":"prepared evaluation","group":"workload-and-timing","lay":"Running an expression that has already been compiled and bound, so the setup is not paid again.","technical":"Execution after binding preparation is complete. Preparation is a separate one-time cost and is never folded into the per-call figure."},{"term":"break-even reuse count","group":"workload-and-timing","lay":"How many times you must evaluate the same expression before the compilation cost is repaid. Below it you lose; above it you win. It is the single most useful number to know about your workload.","technical":"Preparation premium divided by per-evaluation kernel gain. A formula is classified never-break-even exactly when that gain is not positive — preparation cost sets the magnitude of finite counts but plays no part in the classification."},{"term":"paired observation","group":"workload-and-timing","lay":"One timing of the same expression under two different methods, so the comparison is like-for-like. Only pairs where both methods succeeded are counted.","technical":"A matched measurement across arms for one formula. Unmatched observations are excluded from ratio aggregation to avoid survivorship bias."},{"term":"arm (baseline arm)","group":"workload-and-timing","lay":"One of the methods being compared in an experiment. Saying “CM was 10% faster” is meaningless without saying faster than which arm.","technical":"A measurement condition in a paired comparison — here CM, plain CSE, CSE-flat, BitSet, or a decision diagram. Every ratio on this site names both arms."},{"term":"formula-level sample","group":"workload-and-timing","lay":"The set of distinct expressions in a group. Timing one expression seven times gives you seven measurements but still only one expression.","technical":"The set of distinct formulas in a stratum — the inferential unit. An earlier pass in this project discovered that a controlled stratum contained one formula re-bound several ways, making the effective sample size one."},{"term":"ratio of medians","group":"workload-and-timing","lay":"Take the typical time for each method, then divide. Different from taking each pair's ratio and finding the typical one — the two can disagree, so which was used is always stated.","technical":"median(A) ÷ median(B) across a stratum's observations. Distinct from the median paired ratio; both appear on this site and each is labelled."},{"term":"median paired ratio","group":"workload-and-timing","lay":"Work out the ratio for each expression individually, then take the typical one. More robust to one expression being unusual than dividing the two typical times.","technical":"The median of per-observation A÷B ratios. Preferred where formula-to-formula variation is large."},{"term":"timing artifact / type","group":"workload-and-timing","lay":"Exactly what a stopwatch reading includes. Setup? Extraction? Both? Every figure here says which, because comparing an inclusive figure to an exclusive one is the easiest way to publish a wrong ratio.","technical":"The labelled timing boundary: prep, kernel, end-to-end call, extraction, build. Build-window conventions that differ between runs are stated and never plotted on a shared axis."},{"term":"geometric mean","group":"statistics-and-protocol","lay":"The right kind of average for ratios. If one measurement says “twice as fast” and another says “half as fast”, an ordinary average says 1.25 — which is wrong. The geometric mean correctly says 1.","technical":"The exponential of the mean of the logs. Used for all ratio aggregation here because ratios are multiplicative and their distribution is skewed in linear space."},{"term":"bootstrap confidence interval","group":"statistics-and-protocol","lay":"A way of asking “how much would this number move if I had happened to test a different sample?” — by repeatedly re-drawing from the data you have and watching how far the answer wanders.","technical":"A resampling interval. The resampling unit is the crucial choice: resample the wrong unit and the interval is meaningless regardless of how many draws you take."},{"term":"clustered bootstrap","group":"statistics-and-protocol","lay":"Re-drawing whole groups rather than individual measurements, when the measurements inside a group are related. Cones from one circuit are not independent, so whole circuits are re-drawn.","technical":"Resampling at the cluster level — circuit, cell, or machine. Produces wider and more honest intervals than naive resampling when within-cluster correlation exists."},{"term":"pseudo-replication","group":"statistics-and-protocol","lay":"The error of counting repeated measurements of the same thing as if they were measurements of different things. It makes error bars look far tighter than they are, and can turn ordinary noise into an apparently solid finding.","technical":"Treating within-unit repeated measures as independent observations, inflating effective sample size and understating variance. The specific failure clustered intervals exist to prevent."},{"term":"degrees of freedom","group":"statistics-and-protocol","lay":"Roughly, how much independent information your data actually contains after accounting for everything you estimated from it. Getting it wrong makes your spread estimate too small.","technical":"Residual degrees of freedom after estimating cell means. An earlier pass in this project divided a residual sum of squares by the raw observation count rather than the residual degrees of freedom, understating the spread estimate; units in singleton cells contribute no residual information."},{"term":"blocked schedule","group":"statistics-and-protocol","lay":"Timing all of one method, then all of the other. Each method gets a run where the data it needs is likely still sitting in the computer's fast temporary memory.","technical":"All measurements of one arm, then all of the next. Reported as its own column and never pooled with the alternating order."},{"term":"round-robin schedule","group":"statistics-and-protocol","lay":"Alternating between the methods, one after another. This keeps the two on a more even footing over time, but each one is more likely to find the computer's fast memory holding the other method's data.","technical":"Interleaved measurement across arms. Stresses cache and CPU state differently from the blocked order; agreement between the two is reported, not assumed."},{"term":"pre-registration","group":"statistics-and-protocol","lay":"Writing down what you are going to measure and what would count as a positive result — before you have the data. It is what makes a negative result meaningful rather than merely disappointing.","technical":"Fixing corpus source, selection rules, arms, schedules, clustering basis and decision thresholds in a frozen protocol before any measurement exists."},{"term":"materiality rule","group":"statistics-and-protocol","lay":"The pass mark, agreed in advance: how big an effect would have to be, and how confident you would have to be about it, before it is worth acting on. On the decisive experiment here, the pass mark was not met.","technical":"A conjunction of pre-registered conditions — an effect-size threshold, an interval excluding parity, and a break-even bound — all of which must hold for optimisation to be warranted. Its failure made parity the final posture for the EPFL AND/INV workload; later B2/B4 V3 prevents universalising that posture."},{"term":"packed-equality gate","group":"statistics-and-protocol","lay":"The check that runs before any timing: every method must produce exactly the same answer bits. Fail it and the run stops rather than producing a number.","technical":"Bit-for-bit output agreement across all arms as a precondition for measurement. Strengthened to full-extraction equality rather than sampled checks for the decision-diagram comparison."},{"term":"independent reaggregation","group":"statistics-and-protocol","lay":"Having a second, separate piece of code recompute every headline number from the individual measurements — so a bug in the summariser cannot become a published result.","technical":"Recomputation of every summary statistic from raw per-formula rows by a pass independent of the driver. Required before citation; performed again by this page's build script."},{"term":"survivorship bias","group":"statistics-and-protocol","lay":"Judging a method only on the cases it managed to finish. If it gives up on the hard ones and its rival does not, it will look faster than it is.","technical":"Aggregation over unmatched observations, where one arm's failures are silently excluded. Prevented by failure-aware paired reporting: only matched pairs are aggregated and every refusal is counted."},{"term":"supersession","group":"statistics-and-protocol","lay":"Formally retiring a published number — recording that it is withdrawn, why, and what replaced it — instead of quietly deleting it. Anyone who read the old version can find out exactly what changed.","technical":"A standing erratum and claim map assigning each prior claim a status of confirmed, revised or superseded with its replacement. Superseded figures appear on this site only in the corrections ledger and are never plotted."},{"term":"EPFL benchmark suite","group":"statistics-and-protocol","lay":"A published, freely available collection of real hardware circuit designs, widely used for comparing logic tools. Using it means testing against something the project did not choose or shape.","technical":"The external combinational benchmark suite from which {{epfl.n_cones}} AND/INV cones across {{epfl.n_circuits}} circuits were extracted, at a pinned upstream commit with per-file digests recorded."},{"term":"identity fields","group":"statistics-and-protocol","lay":"The parts of a benchmark row that say <em>which</em> expression it is, as opposed to how fast it ran. If those match exactly between two runs, you know both runs asked the same questions.","technical":"Non-timing row fields — formula id, truth digest, support, structural counts. Exact match across runs establishes that a difference is timing, not workload."},{"term":"sanity gate","group":"statistics-and-protocol","lay":"A cheap check that runs before the expensive work and stops everything if it fails — such as a small pilot run, or verifying the test set's fingerprint.","technical":"A deterministic pilot plus a pre-registered runtime bound before each full run, alongside corpus digest verification and truth-digest re-verification at measurement time."}],"use_case_benchmark_catalog":{"schema_version":"cm-use-case-benchmark-catalog/v1","as_of":"2026-08-27","purpose":"Audited, field-specific benchmark candidates for testing whether a reusable CM structural artifact creates value beyond a one-off Boolean answer.","interpretation_rule":"A result on a CM-shaped synthetic stress suite is a mechanism demonstration, not domain dominance. A domain claim requires a preregistered confirmatory result on the natural corpus with the best artifact-equivalent incumbent.","fairness_protocol":["Freeze dataset revisions, parsers, translations, exclusions, seeds, and resource limits before timing.","Run every eligible natural-corpus item; do not retain only formulas on which CM is fast.","Separate cold construction, warm evaluation, version update, partial-context update, serialization, and explanation or change-impact tasks.","Compare equivalent outputs and capabilities. SAT witness search, BDD graph construction, explicit truth-vector generation, and policy authorization are different artifacts.","Publish failures, refusals, timeouts, memory peaks, and never-break-even cases alongside successful timings.","Label synthetic stress results separately and sweep the property intended to help CM: reuse, edit locality, shared-subgraph fraction, context delta, and residual semantic support."],"priority_summary":[{"tier":"Tier A — test first","fields":"Configuration/product families; security-policy version audit; hardware design histories","reason":"These naturally combine long-lived Boolean structure, related versions or contexts, exactness, and change-impact questions."},{"tier":"Tier A/B — bounded subset","fields":"Compiler and program-analysis predicates","reason":"The fit is strong for pure Boolean i1/path-condition families, but weak for general integer, memory, undefined-behavior, or interprocedural semantics."},{"tier":"Tier B — conditional","fields":"AI-agent hard guardrails; biological update rules; regulated Boolean decision tables","reason":"There is a credible reusable-rule artifact, but mature domain engines already provide semantics CM must preserve exactly."},{"tier":"Tier C — narrow research","fields":"Classical reversible and control logic in quantum toolchains","reason":"CM may help only at a Boolean boundary; it does not represent amplitudes, phase, entanglement, or general unitary evolution."}],"entries":[{"id":"hardware","field":"Hardware verification and electronic design","priority":"Tier A — test first","audit_verdict":"Sound and comparatively strong after narrowing the claim to repeated cone/version workflows. CM is not being proposed as a replacement for industrial equivalence checking or synthesis.","pain_point":"Design teams repeatedly rebuild and compare related logic cones after synthesis and optimization passes, while needing exact equivalence, localized change impact, and traceability from output behavior back to changed structure.","cm_role":"Use CM as a versioned intermediate artifact for bounded cones: retain operator/subexpression structure, reuse unchanged compiled regions, restrict under partial inputs, and report structural and behavioral deltas between revisions.","scope_correction":"Do not claim chip-level scalability, synthesis-quality dominance, or an advantage on one-off whole-netlist evaluation. Complete explicit output remains bounded by semantic support.","real_datasets":[{"name":"EPFL Combinational Benchmark Suite","url":"https://github.com/lsils/benchmarks","use":"Use original and best-result AIGER/BLIF/Verilog implementations as real circuit and related-implementation inputs; extract bounded output cones and retain circuit/fan-in metadata.","license_note":"Repository reports an MIT license; pin a commit and preserve circuit attribution."},{"name":"EPFL suite description and methodology","url":"https://www.epfl.ch/labs/lsi/page-102566-en-html/benchmarks/","use":"Use the published circuit categories and ABC equivalence workflow to stratify arithmetic versus control cones and document how variants were produced.","license_note":"Methodology/source page; dataset license is governed by the repository."}],"synthetic_scenario":"Start from each real AIG cone, apply seeded equivalence-preserving ABC rewrite/refactor/resubstitution sequences, then inject localized behavior-changing edits. Sweep shared-subgraph fraction, edit radius, query reuse, and fixed-input fraction while retaining every seed.","baselines":["ABC/AIG rewriting and equivalence","ROBDD/CUDD","SAT or SMT equivalence","packed BitSet or compiled evaluator"],"tasks":["cold cone construction","warm repeated exact evaluation","equivalent-rewrite detection","localized revision impact","partial-input restriction","serialize/reload and query"],"dominance_gate":"Exact outputs and equivalence labels must match; on the natural version/cone trace, CM total workflow time must beat the fastest artifact-equivalent baseline with no memory/refusal regression, or provide a measured change-attribution capability the baseline lacks at acceptable cost."},{"id":"ai","field":"AI-agent authorization and hard guardrails","priority":"Tier B — conditional","audit_verdict":"The original AI wording was too broad. The defensible use case is the deterministic Boolean policy layer around an agent, not learned inference, planning, or natural-language reasoning itself.","pain_point":"Agent systems repeatedly decide whether a principal, delegated agent, action, tool, resource, and context combination is allowed while policies, delegation depth, and tool inventories evolve. Operators also need a reviewable explanation of what changed.","cm_role":"Compile a bounded Boolean projection of the hard-guardrail layer, retain policy/subexpression identity across revisions, reuse it over request streams, and perform offline change-impact or counterfactual analysis. Keep the native policy engine as the semantic authority.","scope_correction":"Do not represent model weights, prompts, probabilistic confidence, open-ended planning, or the full typed semantics of Cedar/Rego as Boolean variables without an explicit translation contract.","real_datasets":[{"name":"AWS sample agentic AI delegation authorization","url":"https://github.com/aws-samples/sample-cedar-agentic-ai-authorization","use":"Replay the documented permit/deny delegation scenarios and derive versioned tool-policy request traces, including user role, MFA, delegation depth, agent capability, and tool risk.","license_note":"Sample/reference implementation; pin the repository revision and inspect its license before redistribution."},{"name":"AllenAI RuleTaker","url":"https://github.com/allenai/ruletaker","use":"Optional secondary corpus for repeated deterministic rule-theory queries after using the repository's logical forms rather than timing natural-language parsing.","license_note":"Apache-2.0 repository; retain dataset attribution."}],"synthetic_scenario":"Generate seeded agent/tool/resource graphs with layered permit, forbid, delegation, tenant, time, and approval predicates. Produce request streams plus localized policy versions, preserving expected allow/deny outcomes and policy-clause provenance.","baselines":["native Cedar authorizer","OPA/Rego for a documented translatable subset","BDD or SAT policy analysis","ordinary compiled predicates with memoization"],"tasks":["request-stream authorization","warm policy reuse","policy-version impact","counterfactual context restriction","decision provenance","serialize/reload"],"dominance_gate":"CM must exactly match the native policy authority on the translated subset and show a repeatable offline audit/versioning or total repeated-query advantage. A synthetic request-stream win alone does not establish production-agent value."},{"id":"biology","field":"Computational biology and Boolean regulatory networks","priority":"Tier B — conditional","audit_verdict":"Plausible for reusable update-rule and intervention families, but the earlier wording could be read as an attractor-analysis claim. Current CM evidence does not support replacing specialized Boolean-network dynamics tools.","pain_point":"Researchers reuse related Boolean update rules across knockouts, over-expression, environmental inputs, parameterizations, and model revisions while trying to preserve regulatory provenance and understand why behavior changed.","cm_role":"Compile individual update functions or bounded synchronous-step slices, retain regulatory-rule structure, reuse unchanged modules, and restrict under interventions. Treat attractor and transition-system analysis as separate downstream tasks unless CM gains explicit dynamics semantics.","scope_correction":"Do not claim whole-network attractor, asynchronous dynamics, or model-checking dominance. Preserve update semantics, input conventions, and multi-valued Booleanization metadata.","real_datasets":[{"name":"Biodivine Boolean Models benchmark collection","url":"https://github.com/sybila/biodivine-boolean-models","use":"Use the repository's validated BNET/AEON/SBML exports and metadata; stratify by variables, inputs, regulations, source repository, and model provenance.","license_note":"Model copyrights remain with original authors; follow each model's source and citation metadata before redistribution."},{"name":"Cell Collective API and export tooling","url":"https://github.com/cellcollective/ccapi","use":"Obtain public Boolean rules, truth tables, and SBML-qual exports where permitted, then build intervention/version traces without discarding biological annotations.","license_note":"API client is MIT; model-specific rights and citations must be checked separately."}],"synthetic_scenario":"From each real network, create seeded knockout, constitutive-expression, input-fixation, and localized rule-edit families. Keep regulatory modules unchanged across most versions and record which attractor-facing question is only proxied by update-rule evaluation.","baselines":["AEON/Biodivine BDD tooling","BoolNet or bioLQM/GINsim","SAT-based Boolean-network analysis","plain compiled update functions"],"tasks":["compile update-rule family","evaluate bounded synchronous step","intervention restriction","model-version diff","shared-module reuse","provenance recovery"],"dominance_gate":"CM must match update semantics exactly and win on a real intervention/version workflow or provide demonstrably better rule-level provenance. Attractor speed cannot be claimed from update-function timing."},{"id":"quantum","field":"Classical reversible and control logic in quantum toolchains","priority":"Tier C — narrow research","audit_verdict":"Correct only with a hard boundary around classical Boolean or reversible components. This is the weakest general-domain claim and should remain a targeted research experiment.","pain_point":"Quantum compilation flows contain classical reversible or control subcircuits that are rewritten across versions and must retain exact computational-basis behavior, ancilla/garbage conventions, and construction provenance.","cm_role":"Represent bounded Boolean output functions of reversible components, reuse their shared classical structure across variants, and compare structural or truth-functional deltas. Use a quantum-native checker for genuinely quantum semantics.","scope_correction":"CM does not represent amplitude, phase, interference, entanglement, noise, measurement probability, or general unitary equivalence. Multi-output reversible semantics and ancilla/garbage bits must be explicit.","real_datasets":[{"name":"RevLib reversible benchmark library","url":"https://www.revlib.org/","use":"Use machine-readable function specifications and REAL circuit realizations for classical reversible truth functions, including declared constants and garbage outputs.","license_note":"Cite individual contributors and confirm reuse terms for selected artifacts."},{"name":"MQT Bench","url":"https://www.cda.cit.tum.de/mqtbench/index","use":"Use only circuits or extracted regions with a documented classical/reversible Boolean interpretation; the broader quantum suite is a negative-control boundary, not CM input.","license_note":"Follow the benchmark package/repository license and cite the MQT Bench publication."}],"synthetic_scenario":"Generate reversible Toffoli/CNOT networks with explicit ancilla and garbage declarations, create equivalence-preserving gate rewrites and localized oracle edits, and export each output as a bounded Boolean root with a full mapping checksum.","baselines":["RevKit or reversible-logic simulator","MQT QCEC for quantum-aware equivalence","ROBDD/CUDD","SAT/SMT miter","packed truth-table evaluator"],"tasks":["multi-output truth-function extraction","equivalent circuit revision","localized oracle change","ancilla restriction","shared-subcircuit reuse","round-trip provenance"],"dominance_gate":"CM must match every declared output under constants/garbage conventions and win a classical reversible version workflow. No result may be generalized to quantum-state simulation or unitary equivalence."},{"id":"compiler","field":"Compilers and program analysis","priority":"Tier A/B — bounded subset","audit_verdict":"Strong for families of pure Boolean predicates and incremental path contexts; unsound as a general compiler-verification claim without modeling integers, memory, poison, undefined behavior, and interprocedural effects.","pain_point":"Compilers repeatedly simplify, compare, and partially evaluate related branch and optimization predicates across passes, builds, and known program facts, often losing a stable cross-version identity for the logical slice.","cm_role":"Use CM for extracted pure-Boolean i1 predicate families: retain expression lineage, reuse shared subgraphs, restrict under known facts, and compare before/after predicates. Leave full IR refinement semantics to Alive2/SMT.","scope_correction":"Exclude or explicitly encode integer widths, overflow, poison, undefined behavior, memory, loops, and calls. A Boolean projection is valid only under a documented extraction contract.","real_datasets":[{"name":"Alive2 and LLVM transformation tests","url":"https://github.com/AliveToolkit/alive2","use":"Select transformations whose source/target condition is a supported pure Boolean slice; use Alive2 as the semantic oracle and retain before/after IR provenance.","license_note":"Alive2 is MIT; LLVM inputs retain their own repository licensing and attribution."},{"name":"LLVM test suite and regression corpus","url":"https://github.com/llvm/llvm-test-suite","use":"Extract repeated branch/path predicates from public programs and preserve program/test provenance; use reference outputs only for overall correctness, not as Boolean equivalence labels.","license_note":"Inspect the LLVM test-suite license and per-benchmark notices, especially external suites."}],"synthetic_scenario":"Generate SSA-like Boolean DAGs with repeated guards, equivalent InstCombine-style rewrites, localized pass edits, and evolving fact sets. Include negative controls with integer/UB features that the importer must refuse rather than silently Booleanize.","baselines":["Alive2/Z3","LLVM InstCombine or SimplifyCFG","e-graph rewriting","ROBDD/CUDD","compiled predicates with memoization"],"tasks":["pure-Boolean extraction","before/after equivalence","known-fact restriction","incremental version update","subexpression lineage","refusal of unsupported semantics"],"dominance_gate":"CM must agree with Alive2 on the accepted subset, refuse unsupported semantics, and beat the strongest Boolean baseline on a natural repeated-predicate trace or deliver measurable lineage/change-analysis value."},{"id":"security","field":"Security policy and access control","priority":"Tier A — test first","audit_verdict":"One of the strongest fits for offline policy audit, related-version analysis, and repeated partial contexts. Native Cedar/OPA remains the online enforcement baseline and semantic authority.","pain_point":"Authorization teams need to know not only whether a request is allowed, but which rule caused it, whether a policy revision expands reachability, which users/resources are affected, and whether unchanged policy structure can be reused safely.","cm_role":"Compile a documented Boolean subset into a versioned audit artifact, retain rule/subexpression provenance, restrict under principal/resource/context attributes, and calculate exact bounded change-impact sets across revisions.","scope_correction":"Do not flatten typed entities, hierarchy, sets, strings, time, or deny-overrides semantics without a verified translation. Online request latency is unlikely to be CM's first dominance surface.","real_datasets":[{"name":"Cedar example use cases and performance artifacts","url":"https://github.com/cedar-policy/cedar-examples","use":"Use the application policies, schemas, entities, allow/deny requests, templated variants, and published benchmark folder as executable policy fixtures.","license_note":"Apache-2.0."},{"name":"Cedar integration-test corpus","url":"https://github.com/cedar-policy/cedar-integration-tests","use":"Use handwritten and generated policy/entity/request cases as translation and differential-correctness tests before any timing claim.","license_note":"Follow the repository license and retain generated-corpus revision metadata."},{"name":"OPA policy performance guidance","url":"https://www.openpolicyagent.org/docs/policy-performance","use":"Use OPA's benchmark methodology and metrics for any documented Cedar/Rego common subset; do not compare unlike policy semantics.","license_note":"Documentation and software are governed by the OPA project licenses."}],"synthetic_scenario":"Generate RBAC/ABAC policy families with permit/deny precedence, entity hierarchy, tenant isolation, localized edits, and request traces. Emit both a rich native form and an explicitly limited Boolean projection with differential labels.","baselines":["native Cedar authorizer and symbolic compiler","OPA/Rego on a common subset","BDD or SAT policy analyzer","indexed decision tables"],"tasks":["differential authorization","policy-version reachability delta","counterfactual restriction","rule provenance","warm request trace","translation refusal/coverage"],"dominance_gate":"Zero decision mismatches are mandatory. CM must beat the best audit-capable baseline on total version-analysis cost or produce exact change/provenance output not otherwise available; online latency alone is not sufficient."},{"id":"configuration","field":"Configuration systems and product families","priority":"Tier A — strongest first experiment","audit_verdict":"The cleanest domain match: long-lived constraints, many partial assignments, related model versions, and exact change-impact questions directly exercise CM's proposed structural and context-reuse value.","pain_point":"Feature models evolve while configurators repeatedly add and retract partial selections, test validity, explain conflicts, identify dead options, and assess which products or constraints changed between releases.","cm_role":"Retain feature-constraint structure and identity across sessions and versions, reuse unchanged subgraphs, restrict under partial selections, and expose exact bounded differences for sliced feature neighborhoods.","scope_correction":"Whole-product enumeration is exponential and often inappropriate. Compare sliced/bounded explicit artifacts separately from SAT satisfiability, model counting, or BDD symbolic configuration.","real_datasets":[{"name":"FeatureIDE/FeatJAR models and analysis tooling","url":"https://github.com/FeatureIDE/FeatureIDE","use":"Use public example/fixture feature models and their analysis semantics; preserve hierarchical and cross-tree constraints when translating.","license_note":"FeatureIDE reports LGPL-3.0; verify model-specific notices."},{"name":"torte reproducible feature-model experiments","url":"https://github.com/ekuiter/torte","use":"Use its curated feature-model benchmark, KConfig extraction, histories, transformation pipeline, and reproducibility metadata for real version families.","license_note":"Follow repository and constituent-model licenses."},{"name":"Linux Kconfig history","url":"https://github.com/torvalds/linux","use":"Extract version-pinned Kconfig constraints and adjacent release histories through a published extractor; do not treat raw Kconfig syntax as a complete Boolean model without validation.","license_note":"Linux source is GPL-2.0-only; derived benchmark redistribution requires legal/license review."}],"synthetic_scenario":"Generate hierarchical feature models with seeded mandatory/optional/alternative groups, cross-tree constraints, localized release edits, and interactive sessions that add/retract selections. Sweep slice size, shared constraints, edit locality, and residual support.","baselines":["FeatJAR SAT4J/Kissat/CaDiCaL analyses","ROBDD feature configurator","incremental SAT","plain compiled predicates"],"tasks":["interactive partial configuration","validity and conflict explanation","version delta on bounded slice","dead-feature query","session reuse","serialize/reload"],"dominance_gate":"CM must preserve feature-model semantics and beat the fastest equivalent baseline on a real interaction/version trace for bounded slices, while reporting enumeration boundaries and all models that never amortize construction."},{"id":"regulated","field":"Regulated rule and decision systems","priority":"Tier B — Boolean decision-table subset","audit_verdict":"Credible for audit and versioning of Boolean decision tables, but too broad if it implies that CM directly models numeric tax formulas, dates, aggregation, priorities, or the full DMN/OpenFisca language.","pain_point":"Governed decision services need reproducible outcomes, explicit rule-version provenance, overlap/gap detection, controlled changes, and regression evidence across many related cases.","cm_role":"Compile the explicitly Boolean portion of a decision table or eligibility rule set into a versioned artifact, retain rule composition, compare revisions, and enumerate exact bounded coverage or conflict regions.","scope_correction":"Numeric thresholds can become finite predicates only under a declared abstraction. Preserve DMN hit policy, rule priority, null/unknown handling, dates, and arithmetic in the native engine unless formally translated.","real_datasets":[{"name":"DMN Technology Compatibility Kit","url":"https://github.com/dmn-tck/tck","use":"Use reference DMN models with serialized inputs and expected outputs; select and declare the Boolean/decision-table subset, retaining hit-policy semantics and conformance identifiers.","license_note":"The project describes freely accessible test cases under a Creative Commons share-alike attribution model; verify repository license files for redistribution."},{"name":"OpenFisca country packages","url":"https://openfisca.org/en/packages/","use":"Use package tests and version histories to identify bounded Boolean eligibility subgraphs; keep arithmetic microsimulation in OpenFisca as the oracle.","license_note":"OpenFisca core is AGPL; inspect each country package and input dataset license separately."}],"synthetic_scenario":"Generate DMN-like Boolean decision tables with explicit hit policies, seeded overlaps, gaps, shadowed rules, localized version edits, and regression cases. Also generate unsupported numeric/date cases that the CM importer must refuse or abstract explicitly.","baselines":["DMN TCK-capable engine","OpenFisca for selected eligibility rules","decision-table index","BDD/SAT coverage analyzer","ordinary compiled predicates"],"tasks":["conformance replay","coverage/overlap/gap analysis","version regression","bounded eligibility enumeration","rule provenance","unsupported-semantics refusal"],"dominance_gate":"CM must match the native engine on every accepted test, preserve hit-policy behavior, and show lower total audit/version cost or better exact bounded coverage output. Passing a Boolean projection does not establish general rules-as-code dominance."}]}},"_numbers":{"recognition.c16.source_cases":{"value":40,"fmt":"int","prov":"docs/recognition/learning_milestone_c16_exact_screened_gf2_results.json :: verification.source_cases_replayed","note":""},"recognition.c16.controls":{"value":12,"fmt":"int","prov":"docs/recognition/learning_milestone_c16_exact_screened_gf2_results.json :: verification.controls_replayed","note":""},"recognition.c16.rows":{"value":360,"fmt":"int","prov":"docs/recognition/learning_milestone_c16_exact_screened_gf2_results.json :: verification.measurement_rows_checked","note":""},"recognition.c16.whole_path_speedup":{"value":3.545323716415172,"fmt":"x3","prov":"docs/recognition/learning_milestone_c16_exact_screened_gf2_results.json :: summary.speedup.screened_whole_path_over_exhaustive","note":"local, task-equivalent whole path; timing is machine-specific"},"recognition.c16.minimum_case_speedup":{"value":0.8927963215258855,"fmt":"x3","prov":"docs/recognition/learning_milestone_c16_exact_screened_gf2_results.json :: summary.speedup.minimum_case_speedup","note":"minimum individual local case; below parity"},"kernel.local":{"value":0.8876462484974261,"fmt":"ratio4","prov":"deliverables_n22_24/b1_e3_replay_2026_08_03/b1_acceptance_check_results_2026_08_03.json :: new_geomean_all_blocked","note":""},"kernel.local.lo":{"value":0.8731024896723113,"fmt":"ratio3","prov":"deliverables_n22_24/b1_e3     ]));
    if (o.claim) shell.append(h("div", { class: "analysis-note" }, [
      h("h3", { text: "Decision boundary" }), h("p", { html: P(o.claim) }),
    ]));
    if (o.table) {
      const data = h("details", { class: "analysis-data" });
      data.append(h("summary", { text: "Every plotted value" }));
      data.append(h("div", { class: "tablewrap" }, [o.table.cloneNode(true)]));
      shell.append(data);
    }
    if (o.prov) {
      const provenance = h("details", { class: "analysis-data" });
      provenance.append(h("summary", { text: "Data provenance" }));
      const ul = h("ul");
      o.prov.forEach(p => ul.append(h("li", { html: `<code>${p.replace("::", "</code> :: <code>")}</code>` })));
      provenance.append(ul); shell.append(provenance);
    }
    dialog.append(shell);
    document.body.append(dialog);
    let opener = null;
    const openAnalysis = (node) => {
      opener = node;
      if (typeof dialog.showModal === "function") dialog.showModal();
      else dialog.setAttribute("open", "");
    };
    close.addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", e => { if (e.target === dialog) dialog.close(); });
    dialog.addEventListener("close", () => { if (opener) opener.focus(); });
    graphTargets.forEach(node => node.addEventListener("click", e => {
      if (!e.target.closest("a, button, summary, details")) openAnalysis(node);
    }));
    const explain = h("button", {
      class: "explain-graph", type: "button", "aria-haspopup": "dialog",
      "aria-controls": `${o.id}-analysis`, text: "Explain this graph",
    });
    dialog.id = `${o.id}-analysis`;
    explain.addEventListener("click", () => openAnalysis(explain));
    c.append(explain);
  } else {
    if (o.note) c.append(h("p", { class: "claim", html: P(o.note) }));
    if (o.claim) c.append(h("p", { class: "claim", html: P(o.claim) }));
  }
  return c;
}
function table(headers, rows, cls) {
  const t = h("table", cls ? { class: cls } : {});
  const th = h("tr");
  headers.forEach(x => th.append(h("th", { html: x })));
  t.append(h("thead", {}, [th]));
  const tb = h("tbody");
  rows.forEach(r => {
    const tr = h("tr");
    r.forEach(x => tr.append(h("td", { html: String(x) })));
    tb.append(tr);
  });
  t.append(tb);
  return t;
}

/* --------------------------------------------- forest (dot + CI, horizontal) */
function forest(rows, opt) {
  const W = opt.width || 900, padL = opt.padL || 250, padR = 92, padT = 30, rowH = 30;
  const H = padT + rows.length * rowH + 46;
  const lo = opt.domain[0], hi = opt.domain[1];
  const x = linScale(lo, hi, padL, W - padR);
  const g = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img",
                        "aria-label": opt.title || "forest plot" });

  niceTicks(lo, hi, opt.ticks || 6).forEach(t => {
    g.append(el("line", { x1: x(t), x2: x(t), y1: padT - 8, y2: padT + rows.length * rowH,
                          stroke: "var(--grid)", "stroke-width": 1 }));
    g.append(el("text", { x: x(t), y: padT + rows.length * rowH + 18, class: "tick",
                          "text-anchor": "middle" }, [document.createTextNode(f(t, 2))]));
  });
  if (opt.ref !== undefined && opt.ref >= lo && opt.ref <= hi) {
    g.append(el("line", { x1: x(opt.ref), x2: x(opt.ref), y1: padT - 12, y2: padT + rows.length * rowH,
                          stroke: "var(--ref)", "stroke-width": 1.5 }));
    g.append(el("text", { x: x(opt.ref), y: padT - 17, class: "axtitle", "text-anchor": "middle" },
                        [document.createTextNode(opt.refLabel || "parity 1.00")]));
  }
  g.append(el("text", { x: (padL + W - padR) / 2, y: H - 8, class: "axtitle", "text-anchor": "middle" },
                      [document.createTextNode(opt.xTitle)]));

  rows.forEach((r, i) => {
    const cy = padT + i * rowH + rowH / 2;
    const col = r.group === "current" ? S4 : r.group === "pod" ? S3 : r.group === "external" ? S2 : S1;
    g.append(el("text", { x: padL - 12, y: cy + 4, class: "lab", "text-anchor": "end" },
                        [document.createTextNode(r.label)]));
    if (r.lo !== null && r.lo !== undefined) {
      g.append(el("line", { x1: x(r.lo), x2: x(r.hi), y1: cy, y2: cy, stroke: col, "stroke-width": 2,
                            "stroke-linecap": "round" }));
      [r.lo, r.hi].forEach(v => g.append(el("line", { x1: x(v), x2: x(v), y1: cy - 5, y2: cy + 5,
                                                      stroke: col, "stroke-width": 2 })));
    }
    g.append(el("circle", { cx: x(r.value), cy, r: 5.5, fill: col,
                            stroke: "var(--surface-1)", "stroke-width": 2 }));
    g.append(el("text", { x: W - padR + 10, y: cy + 4, class: "val" },
                        [document.createTextNode(f(r.value, 4))]));
    const hit = el("rect", { x: padL - 4, y: cy - rowH / 2, width: W - padR - padL + 8, height: rowH, class: "hit" });
    bindTip(hit, `<b>${r.label}</b><span class="r">${opt.arm}: ${f(r.value, 4)}` +
      (r.lo != null ? ` &nbsp;95% CI [${f(r.lo, 4)}, ${f(r.hi, 4)}]` : "") +
      `</span><br><span class="r">${r.scope}</span><br><span class="r">${r.basis}</span>`);
    g.append(hit);
  });
  return g;
}

/* ---------------------------------------------------- grouped columns */
function groupedCols(cfg) {
  const W = cfg.width || 900, padL = cfg.padL || 74, padR = 22, padT = 22, padB = cfg.padB || 62;
  const H = cfg.height || 320;
  const groups = cfg.groups, series = cfg.series;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const isLog = !!cfg.log;
  const allV = groups.flatMap(g => series.map(s => g.values[s.key]).filter(v => v != null && (!isLog || v > 0)));
  const maxV = cfg.max || Math.max(...allV) * 1.12;
  const minV = isLog ? (cfg.min || Math.pow(10, Math.floor(Math.log10(Math.min(...allV))))) : 0;
  const y = isLog ? logScale(minV, maxV, padT + plotH, padT) : linScale(minV, maxV, padT + plotH, padT);
  const g = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img",
                        "aria-label": cfg.title || "grouped columns" });

  (isLog ? logTicks(minV, maxV) : niceTicks(minV, maxV, 5)).forEach(t => {
    g.append(el("line", { x1: padL, x2: W - padR, y1: y(t), y2: y(t), stroke: "var(--grid)", "stroke-width": 1 }));
    g.append(el("text", { x: padL - 10, y: y(t) + 4, class: "tick", "text-anchor": "end" },
                        [document.createTextNode(cfg.fmtTick ? cfg.fmtTick(t) : f(t, cfg.tickDigits ?? 2))]));
  });
  g.append(el("line", { x1: padL, x2: W - padR, y1: padT + plotH, y2: padT + plotH,
                        stroke: "var(--axis)", "stroke-width": 1 }));
  if (cfg.ref != null) {
    g.append(el("line", { x1: padL, x2: W - padR, y1: y(cfg.ref), y2: y(cfg.ref),
                          stroke: "var(--ref)", "stroke-width": 1.5 }));
    g.append(el("text", { x: W - padR - 2, y: y(cfg.ref) - 6, class: "axtitle", "text-anchor": "end" },
                        [document.createTextNode(cfg.refLabel || "parity 1.00")]));
  }
  g.append(el("text", { x: 16, y: padT + plotH / 2, class: "axtitle", "text-anchor": "middle",
                        transform: `rotate(-90 16 ${padT + plotH / 2})` },
                      [document.createTextNode(cfg.yTitle)]));
  g.append(el("text", { x: padL + plotW / 2, y: H - 8, class: "axtitle", "text-anchor": "middle" },
                      [document.createTextNode(cfg.xTitle)]));

  const bandW = plotW / groups.length;
  const inner = Math.min(cfg.barW || 24, (bandW - 26) / series.length);
  groups.forEach((grp, gi) => {
    const cx = padL + bandW * (gi + 0.5);
    const total = series.length * inner + (series.length - 1) * 2;
    series.forEach((s, si) => {
      const v = grp.values[s.key];
      if (v == null || (isLog && v <= 0)) return;
      const bx = cx - total / 2 + si * (inner + 2);
      const by = y(v), bh = Math.max(1, padT + plotH - by);
      const r = Math.min(4, bh / 2);
      const path = `M${bx},${by + bh} L${bx},${by + r} Q${bx},${by} ${bx + r},${by}` +
                   ` L${bx + inner - r},${by} Q${bx + inner},${by} ${bx + inner},${by + r}` +
                   ` L${bx + inner},${by + bh} Z`;
      const bar = el("path", { d: path, fill: s.color });
      bindTip(bar, `<b>${grp.label} · ${s.label}</b><span class="r">${cfg.fmtVal ? cfg.fmtVal(v) : f(v, 3)}</span>` +
        (grp.tip ? `<br><span class="r">${grp.tip}</span>` : ""));
      g.append(bar);
      if (cfg.labelBars) {
        g.append(el("text", { x: bx + inner / 2, y: by - 6, class: "val", "text-anchor": "middle",
                              "font-size": 10.5 },
                            [document.createTextNode(cfg.fmtVal ? cfg.fmtVal(v) : f(v, 2))]));
      }
    });
    g.append(el("text", { x: cx, y: padT + plotH + 18, class: "lab", "text-anchor": "middle" },
                        [document.createTextNode(grp.label)]));
    if (grp.sub) g.append(el("text", { x: cx, y: padT + plotH + 33, class: "tick", "text-anchor": "middle",
                                       "font-size": 11 }, [document.createTextNode(grp.sub)]));
  });
  return g;
}

/* ------------------------------------- dumbbell (2 series, horizontal cats) */
function dumbbell(cats, cfg) {
  const W = cfg.width || 900, padL = cfg.padL || 175, padR = 30, padT = 26, rowH = cfg.rowH || 24;
  const H = padT + cats.length * rowH + 48;
  const x = linScale(cfg.domain[0], cfg.domain[1], padL, W - padR);
  const g = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": cfg.title });
  niceTicks(cfg.domain[0], cfg.domain[1], 6).forEach(t => {
    g.append(el("line", { x1: x(t), x2: x(t), y1: padT - 6, y2: padT + cats.length * rowH,
                          stroke: "var(--grid)", "stroke-width": 1 }));
    g.append(el("text", { x: x(t), y: padT + cats.length * rowH + 18, class: "tick", "text-anchor": "middle" },
                        [document.createTextNode(f(t, 2))]));
  });
  if (cfg.ref != null) {
    g.append(el("line", { x1: x(cfg.ref), x2: x(cfg.ref), y1: padT - 12, y2: padT + cats.length * rowH,
                          stroke: "var(--ref)", "stroke-width": 1.5 }));
    g.append(el("text", { x: x(cfg.ref), y: padT - 17, class: "axtitle", "text-anchor": "middle" },
                        [document.createTextNode("parity 1.00")]));
  }
  g.append(el("text", { x: (padL + W - padR) / 2, y: H - 8, class: "axtitle", "text-anchor": "middle" },
                      [document.createTextNode(cfg.xTitle)]));
  cats.forEach((c, i) => {
    const cy = padT + i * rowH + rowH / 2;
    g.append(el("text", { x: padL - 12, y: cy + 4, class: "lab", "text-anchor": "end" },
                        [document.createTextNode(c.label)]));
    g.append(el("line", { x1: x(Math.min(c.a, c.b)), x2: x(Math.max(c.a, c.b)), y1: cy, y2: cy,
                          stroke: "var(--axis)", "stroke-width": 2, "stroke-linecap": "round" }));
    g.append(el("circle", { cx: x(c.b), cy, r: 4.5, fill: S2, stroke: "var(--surface-1)", "stroke-width": 2 }));
    g.append(el("circle", { cx: x(c.a), cy, r: 4.5, fill: S1, stroke: "var(--surface-1)", "stroke-width": 2 }));
    const hit = el("rect", { x: padL - 4, y: cy - rowH / 2, width: W - padR - padL + 8, height: rowH, class: "hit" });
    bindTip(hit, `<b>${c.label}</b><span class="r">${cfg.aLabel}: ${f(c.a, 4)}<br>${cfg.bLabel}: ${f(c.b, 4)}</span>` +
      (c.tip ? `<br><span class="r">${c.tip}</span>` : ""));
    g.append(hit);
  });
  return g;
}

/* ------------------------------------------------- xy scatter / lines */
function xyPlot(cfg) {
  const W = cfg.width || 900, padL = cfg.padL || 78, padR = cfg.padR || 30, padT = 24, padB = 58;
  const H = cfg.height || 320, plotW = W - padL - padR, plotH = H - padT - padB;
  const x = cfg.logX ? logScale(cfg.xDomain[0], cfg.xDomain[1], padL, W - padR)
                     : linScale(cfg.xDomain[0], cfg.xDomain[1], padL, W - padR);
  const y = cfg.logY ? logScale(cfg.yDomain[0], cfg.yDomain[1], padT + plotH, padT)
                     : linScale(cfg.yDomain[0], cfg.yDomain[1], padT + plotH, padT);
  const g = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": cfg.title });

  (cfg.logY ? logTicks(cfg.yDomain[0], cfg.yDomain[1]) : niceTicks(cfg.yDomain[0], cfg.yDomain[1], 5)).forEach(t => {
    g.append(el("line", { x1: padL, x2: W - padR, y1: y(t), y2: y(t), stroke: "var(--grid)", "stroke-width": 1 }));
    g.append(el("text", { x: padL - 10, y: y(t) + 4, class: "tick", "text-anchor": "end" },
                        [document.createTextNode(cfg.fmtY ? cfg.fmtY(t) : f(t, 2))]));
  });
  (cfg.xTicks || (cfg.logX ? logTicks(cfg.xDomain[0], cfg.xDomain[1]) : niceTicks(cfg.xDomain[0], cfg.xDomain[1], 6)))
    .forEach(t => {
      g.append(el("text", { x: x(t), y: padT + plotH + 18, class: "tick", "text-anchor": "middle" },
                          [document.createTextNode(cfg.fmtX ? cfg.fmtX(t) : f(t, 0))]));
    });
  g.append(el("line", { x1: padL, x2: W - padR, y1: padT + plotH, y2: padT + plotH,
                        stroke: "var(--axis)", "stroke-width": 1 }));
  if (cfg.ref != null) {
    g.append(el("line", { x1: padL, x2: W - padR, y1: y(cfg.ref), y2: y(cfg.ref),
                          stroke: "var(--ref)", "stroke-width": 1.5, "stroke-dasharray": "4 3" }));
    g.append(el("text", { x: W - padR - 2, y: y(cfg.ref) - 6, class: "axtitle", "text-anchor": "end" },
                        [document.createTextNode(cfg.refLabel || "parity 1.00")]));
  }
  g.append(el("text", { x: 16, y: padT + plotH / 2, class: "axtitle", "text-anchor": "middle",
                        transform: `rotate(-90 16 ${padT + plotH / 2})` },
                      [document.createTextNode(cfg.yTitle)]));
  g.append(el("text", { x: padL + plotW / 2, y: H - 8, class: "axtitle", "text-anchor": "middle" },
                      [document.createTextNode(cfg.xTitle)]));

  cfg.series.forEach(s => {
    if (s.line) {
      const d = s.points.map((p, i) => `${i ? "L" : "M"}${x(p.x)},${y(p.y)}`).join(" ");
      g.append(el("path", { d, fill: "none", stroke: s.color, "stroke-width": 2,
                            "stroke-dasharray": s.dash || null,
                            "stroke-linejoin": "round", "stroke-linecap": "round" }));
    }
    s.points.forEach(p => {
      g.append(el("circle", { cx: x(p.x), cy: y(p.y), r: s.r || 4.5, fill: s.color,
                              stroke: "var(--surface-1)", "stroke-width": 2 }));
      const hit = el("circle", { cx: x(p.x), cy: y(p.y), r: 13, class: "hit" });
      bindTip(hit, `<b>${p.label || s.label}</b><span class="r">${p.tip}</span>`);
      g.append(hit);
      if (p.direct) {
        g.append(el("text", { x: x(p.x) + (p.dx || 0), y: y(p.y) - 12, class: "val",
                              "text-anchor": p.anchor || "middle", "font-size": 11 },
                            [document.createTextNode(p.direct)]));
      }
    });
  });
  return g;
}

/* ------------------------------------------------- horizontal bar (single) */
function hBars(rows, cfg) {
  const W = cfg.width || 880, padL = cfg.padL || 190, padR = 74, padT = 22, rowH = cfg.rowH || 26;
  const H = padT + rows.length * rowH + 44;
  const maxV = cfg.max || Math.max(...rows.map(r => r.value)) * 1.1;
  const x = linScale(0, maxV, padL, W - padR);
  const g = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": cfg.title });
  niceTicks(0, maxV, 5).forEach(t => {
    g.append(el("line", { x1: x(t), x2: x(t), y1: padT - 6, y2: padT + rows.length * rowH,
                          stroke: "var(--grid)", "stroke-width": 1 }));
    g.append(el("text", { x: x(t), y: padT + rows.length * rowH + 18, class: "tick", "text-anchor": "middle" },
                        [document.createTextNode(cfg.fmtTick ? cfg.fmtTick(t) : f(t, 0))]));
  });
  if (cfg.ref != null && cfg.ref >= 0 && cfg.ref <= maxV) {
    g.append(el("line", { x1: x(cfg.ref), x2: x(cfg.ref), y1: padT - 9, y2: padT + rows.length * rowH,
                          stroke: "var(--ref)", "stroke-width": 1.5 }));
    g.append(el("text", { x: x(cfg.ref), y: padT - 13, class: "axtitle", "text-anchor": "middle" },
                        [document.createTextNode(cfg.refLabel || String(cfg.ref))]));
  }
  g.append(el("text", { x: (padL + W - padR) / 2, y: H - 6, class: "axtitle", "text-anchor": "middle" },
                      [document.createTextNode(cfg.xTitle)]));
  rows.forEach((r, i) => {
    const cy = padT + i * rowH + rowH / 2, bh = Math.min(15, rowH - 9);
    g.append(el("text", { x: padL - 12, y: cy + 4, class: "lab", "text-anchor": "end" },
                        [document.createTextNode(r.label)]));
    const bar = el("rect", { x: padL, y: cy - bh / 2, width: Math.max(1, x(r.value) - padL), height: bh,
                             rx: 3, fill: r.color || cfg.color || S1 });
    bindTip(bar, `<b>${r.label}</b><span class="r">${cfg.fmtVal ? cfg.fmtVal(r.value) : f(r.value, 2)}</span>` +
      (r.tip ? `<br><span class="r">${r.tip}</span>` : ""));
    g.append(bar);
    g.append(el("text", { x: x(r.value) + 8, y: cy + 4, class: "val", "font-size": 11.5 },
                        [document.createTextNode(cfg.fmtVal ? cfg.fmtVal(r.value) : f(r.value, 2))]));
  });
  return g;
}

/* ----------------------------------- 100% stacked horizontal outcome bars */
function stackedPercentBars(rows, cfg) {
  const W = cfg.width || 900, padL = cfg.padL || 245, padR = 128, padT = 30, rowH = cfg.rowH || 46;
  const H = padT + rows.length * rowH + 46;
  const x = linScale(0, 100, padL, W - padR);
  const g = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": cfg.title });
  [0, 25, 50, 75, 100].forEach(t => {
    g.append(el("line", { x1: x(t), x2: x(t), y1: padT - 8, y2: padT + rows.length * rowH,
                          stroke: "var(--grid)", "stroke-width": 1 }));
    g.append(el("text", { x: x(t), y: padT + rows.length * rowH + 18, class: "tick", "text-anchor": "middle" },
                        [document.createTextNode(t + "%")]));
  });
  g.append(el("text", { x: (padL + W - padR) / 2, y: H - 7, class: "axtitle", "text-anchor": "middle" },
                      [document.createTextNode("share of expressions in the arm")]));
  rows.forEach((r, i) => {
    const cy = padT + i * rowH + rowH / 2;
    const finitePct = 100 * r.finite / r.total, neverPct = 100 - finitePct;
    g.append(el("text", { x: padL - 12, y: cy - 3, class: "lab", "text-anchor": "end" },
                        [document.createTextNode(r.label)]));
    g.append(el("text", { x: padL - 12, y: cy + 13, class: "tick", "text-anchor": "end", "font-size": 10.5 },
                        [document.createTextNode("vs " + r.baseline)]));
    const finite = el("rect", { x: x(0), y: cy - 9, width: x(finitePct) - x(0), height: 18, rx: 4, fill: S1 });
    const never = el("rect", { x: x(finitePct), y: cy - 9, width: x(100) - x(finitePct), height: 18,
                               rx: 4, fill: "var(--critical)" });
    bindTip(finite, `<b>${r.label}</b><span class="r">${r.finite}/${r.total} finite break-even (${f(finitePct, 1)}%)<br>` +
      `finite median ${FMT.num1s(r.median)} evaluations</span>`);
    bindTip(never, `<b>${r.label}</b><span class="r">${r.never}/${r.total} never break even (${f(neverPct, 1)}%)</span>`);
    g.append(finite, never);
    g.append(el("text", { x: W - padR + 10, y: cy - 2, class: "val", "font-size": 11.5 },
                        [document.createTextNode("median " + FMT.num1s(r.median) + " eval")]));
    g.append(el("text", { x: W - padR + 10, y: cy + 13, class: "tick", "font-size": 10.5 },
                        [document.createTextNode(r.never + " never")]));
  });
  return g;
}

/* -------------------------------------------- log dot plot (never log bars) */
function dotLog(rows, cfg) {
  const W = cfg.width || 880, padL = cfg.padL || 180, padR = 96, padT = 26, rowH = cfg.rowH || 26;
  const H = padT + rows.length * rowH + 46;
  const vals = rows.flatMap(r => r.points.map(p => p.v)).filter(v => v > 0);
  const lo = cfg.min || Math.pow(10, Math.floor(Math.log10(Math.min(...vals))));
  const hi = cfg.max || Math.pow(10, Math.ceil(Math.log10(Math.max(...vals))));
  const x = logScale(lo, hi, padL, W - padR);
  const g = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": cfg.title });
  logTicks(lo, hi).forEach(t => {
    g.append(el("line", { x1: x(t), x2: x(t), y1: padT - 6, y2: padT + rows.length * rowH,
                          stroke: "var(--grid)", "stroke-width": 1 }));
    g.append(el("text", { x: x(t), y: padT + rows.length * rowH + 18, class: "tick", "text-anchor": "middle" },
                        [document.createTextNode(cfg.fmtTick ? cfg.fmtTick(t) : String(t))]));
  });
  g.append(el("text", { x: (padL + W - padR) / 2, y: H - 6, class: "axtitle", "text-anchor": "middle" },
                      [document.createTextNode(cfg.xTitle)]));
  rows.forEach((r, i) => {
    const cy = padT + i * rowH + rowH / 2;
    g.append(el("text", { x: padL - 12, y: cy + 4, class: "lab", "text-anchor": "end" },
                        [document.createTextNode(r.label)]));
    const xs = r.points.filter(p => p.v > 0).map(p => x(p.v));
    if (xs.length > 1) {
      g.append(el("line", { x1: Math.min(...xs), x2: Math.max(...xs), y1: cy, y2: cy,
                            stroke: "var(--axis)", "stroke-width": 1.5, "stroke-linecap": "round" }));
    }
    r.points.forEach(p => {
      if (!(p.v > 0)) return;
      const c = el("circle", { cx: x(p.v), cy, r: 5, fill: p.color, stroke: "var(--surface-1)", "stroke-width": 2 });
      bindTip(c, `<b>${r.label} · ${p.label}</b><span class="r">${cfg.fmtVal ? cfg.fmtVal(p.v) : us(p.v)}</span>` +
        (p.tip ? `<br><span class="r">${p.tip}</span>` : ""));
      g.append(c);
    });
    if (r.right) {
      g.append(el("text", { x: W - padR + 10, y: cy + 4, class: "val", "font-size": 11.5 },
                          [document.createTextNode(r.right)]));
    }
  });
  return g;
}

/* -------------------------------------------------- histogram (counts) */
function histogram(cfg) {
  const W = cfg.width || 880, padL = 60, padR = 22, padT = 24, padB = 62;
  const H = cfg.height || 260, plotW = W - padL - padR, plotH = H - padT - padB;
  const maxV = Math.max(...cfg.series.flatMap(s => s.counts)) * 1.15;
  const y = linScale(0, maxV, padT + plotH, padT);
  const g = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": cfg.title });
  niceTicks(0, maxV, 4).forEach(t => {
    g.append(el("line", { x1: padL, x2: W - padR, y1: y(t), y2: y(t), stroke: "var(--grid)", "stroke-width": 1 }));
    g.append(el("text", { x: padL - 9, y: y(t) + 4, class: "tick", "text-anchor": "end" },
                        [document.createTextNode(f(t, 0))]));
  });
  g.append(el("line", { x1: padL, x2: W - padR, y1: padT + plotH, y2: padT + plotH,
                        stroke: "var(--axis)", "stroke-width": 1 }));
  g.append(el("text", { x: 16, y: padT + plotH / 2, class: "axtitle", "text-anchor": "middle",
                        transform: `rotate(-90 16 ${padT + plotH / 2})` },
                      [document.createTextNode(cfg.yTitle || "formulas")]));
  g.append(el("text", { x: padL + plotW / 2, y: H - 8, class: "axtitle", "text-anchor": "middle" },
                      [document.createTextNode(cfg.xTitle)]));
  const bandW = plotW / cfg.labels.length;
  const inner = Math.min(30, (bandW - 12) / cfg.series.length);
  cfg.labels.forEach((lab, li) => {
    const cx = padL + bandW * (li + 0.5);
    const total = cfg.series.length * inner + (cfg.series.length - 1) * 2;
    cfg.series.forEach((s, si) => {
      const v = s.counts[li];
      const bx = cx - total / 2 + si * (inner + 2);
      const by = y(v), bh = Math.max(0.5, padT + plotH - by);
      const bar = el("rect", { x: bx, y: by, width: inner, height: bh, rx: 2.5, fill: s.color });
      bindTip(bar, `<b>${s.label}</b><span class="r">${v} formulas break even at ${lab} evaluations</span>`);
      g.append(bar);
    });
    g.append(el("text", { x: cx, y: padT + plotH + 17, class: "tick", "text-anchor": "middle", "font-size": 11 },
                        [document.createTextNode(lab)]));
  });
  return g;
}

/* ---------------------------------------------------- heat grid (ratios) */
function heatGrid(cfg) {
  const cellW = cfg.cellW || 118, cellH = 40, padL = cfg.padL || 110, padT = 34;
  const W = padL + cfg.cols.length * cellW + 16;
  const H = padT + cfg.rows.length * cellH + 16;
  const g = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": cfg.title });
  const vals = cfg.cells.map(c => c.value);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  cfg.cols.forEach((c, ci) =>
    g.append(el("text", { x: padL + cellW * (ci + 0.5), y: padT - 12, class: "lab", "text-anchor": "middle" },
                        [document.createTextNode(c)])));
  cfg.rows.forEach((r, ri) =>
    g.append(el("text", { x: padL - 10, y: padT + cellH * (ri + 0.5) + 4, class: "lab", "text-anchor": "end" },
                        [document.createTextNode(r)])));
  cfg.cells.forEach(cell => {
    const ci = cfg.cols.indexOf(cell.col), ri = cfg.rows.indexOf(cell.row);
    if (ci < 0 || ri < 0) return;
    const t = hi === lo ? 0.5 : (cell.value - lo) / (hi - lo);
    const x0 = padL + ci * cellW + 3, y0 = padT + ri * cellH + 3;
    const rect = el("rect", { x: x0, y: y0, width: cellW - 6, height: cellH - 6, rx: 5,
                              fill: S1, "fill-opacity": (0.13 + 0.42 * (1 - t)).toFixed(3),
                              stroke: "var(--border)" });
    bindTip(rect, `<b>${cell.row} × ${cell.col}</b><span class="r">${cfg.arm} ${f(cell.value, 4)}` +
      (cell.lo != null ? `<br>95% CI [${f(cell.lo, 4)}, ${f(cell.hi, 4)}]` : "") +
      (cell.n != null ? `<br>${cell.n} formulas` : "") + `</span>` +
      (cell.basis ? `<br><span class="r">${cell.basis}</span>` : ""));
    g.append(rect);
    g.append(el("text", { x: x0 + (cellW - 6) / 2, y: y0 + (cellH - 6) / 2 + 4, class: "val",
                          "text-anchor": "middle", "font-size": 12.5 },
                        [document.createTextNode(f(cell.value, 3))]));
  });
  return g;
}

function topbar(cfg) {
  if (!(cfg.links || []).some(([, label]) => label === "Results & audit")) {
    cfg = { ...cfg, links: [...(cfg.links || []), ["feature-model-evidence.html", "Results & audit"]] };
  }
  const bar = h("div", { class: "topbar" });
  const inner = h("div", { class: "inner" });
  inner.append(h("div", { class: "brand", html: cfg.brand }));
  if (cfg.links && cfg.links.length) {
    const nav = h("nav", { id: "site-nav", "aria-label": "Page navigation" });
    const menu = h("button", {
      class: "menutog", type: "button", "aria-controls": "site-nav",
      "aria-expanded": "false", text: "☰ menu",
    });
    const closeMenu = () => {
      nav.removeAttribute("data-open");
      menu.setAttribute("aria-expanded", "false");
    };
    menu.addEventListener("click", () => {
      const open = nav.getAttribute("data-open") === "true";
      if (open) closeMenu();
      else {
        nav.setAttribute("data-open", "true");
        menu.setAttribute("aria-expanded", "true");
      }
    });
    cfg.links.forEach(([href, lab]) => {
      const link = h("a", { href, text: lab });
      link.addEventListener("click", closeMenu);
      nav.append(link);
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && nav.getAttribute("data-open") === "true") {
        closeMenu();
        menu.focus();
      }
    });
    inner.append(menu);
    inner.append(nav);
  }
  const tog = h("button", { class: "themetog", type: "button", "aria-label": "Toggle light or dark theme", text: "◑ theme" });
  tog.addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.getAttribute("data-theme") === "dark" ||
      (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", dark ? "light" : "dark");
  });
  if (!cfg.links || !cfg.links.length) tog.style.marginLeft = "auto";
  inner.append(tog);
  bar.append(inner);
  return bar;
}
