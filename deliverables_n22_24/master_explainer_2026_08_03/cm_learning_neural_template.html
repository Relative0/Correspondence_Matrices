      h("span", {}, [h("i", { class: "ln-split-fit" }), document.createTextNode(`Fit ${T("ln.split_development_fit")}`)]),
      h("span", {}, [h("i", { class: "ln-split-validation" }), document.createTextNode(`Validation ${T("ln.split_development_validation")}`)]),
      h("span", {}, [h("i", { class: "ln-split-audit" }), document.createTextNode(`Audit ${T("ln.split_development_audit")}`)]),
    ]),
    h("figcaption", { html: `${T("ln.freeze_cases")} source groups were assigned by salted hash before labels or timings; the bar is allocation, not performance.` }),
  ]));
  s.append(tiles([
    ["Frozen source groups", T("ln.freeze_cases"), "one source group per case"],
    ["Fit / validation / audit", `${T("ln.split_development_fit")} / ${T("ln.split_development_validation")} / ${T("ln.split_development_audit")}`, "salted source-group split"],
    ["Structural features", T("ln.features"), "identity-free, label-free at freeze"],
    ["Prior-alpha overlap", T("ln.prior_overlap"), "structural identity overlap"],
  ]));
  s.append(h("p", { text: E.source_blind.split_assignment }));
  s.append(moreBlock([
    h("p", {}, [h("strong", { text: "Allowed features: " }), document.createTextNode(E.source_blind.features.join(", "))]),
    h("p", {}, [h("strong", { text: "Forbidden fields: " }), document.createTextNode(E.source_blind.forbidden.join(", "))]),
  ], "Inspect allowed and forbidden model fields"));
  const ids = h("div", { class: "ln-identity" });
  E.identities.forEach(item => ids.append(h("p", {}, [h("strong", { text: `${item.role}: ` }), document.createTextNode(item.path), h("code", { text: item.sha256 })])));
  s.append(moreBlock([ids], "Pinned evidence identities")); app.append(s);
}

{
  const s = section("certificate", "C5 certificate boundary", "Ranking becomes useful only when it safely stops exact work",
    `A future partition learner must provide an independently checked global certificate and avoid at least ${T("ln.certificate_work")} of measured completion work after certificate-verification cost.`);
  const list = h("ul"); E.certificate.forEach(item => list.append(h("li", { text: item })));
  s.append(list);
  s.append(banner("warn", "The current record does not meet this boundary", [
    "Candidate reconstruction is exact and variable-renaming checks passed, but no certificate covers every unexplored partition, completion search still runs, verification cost is unmeasured, and measured global work avoidance is absent.",
  ])); app.append(s);
}

{
  const s = section("next-work", "Reproducibility and next admissible work", "Freeze first; consume evidence only after authorization",
    "The next step is not another opportunistic fit. It is an independently verified handoff that closes cohort, split, exact-task, cross-machine and charged-cost fields without reading prospective labels early.");
  const actionGrid = h("div", { class: "ln-task-grid" });
  [["Can be done now", E.next_actions.now, "ok"], ["Requires an authorized Benchmark task", E.next_actions.benchmark, "open"], ["Prohibited until a gate passes", E.next_actions.prohibited, "bad"]].forEach(([title, items, kind]) => {
    const list = h("ul"); items.forEach(item => list.append(h("li", { text: item })));
    actionGrid.append(h("article", { class: "ln-task" }, [h("p", { class: `pill ${kind}`, text: title }), list]));
  });
  s.append(actionGrid);
  s.append(h("ol", {}, [
    h("li", { html: `Keep the source-group freeze intact and retain all abstentions and unfavorable rows.` }),
    h("li", { html: `Require validation and audit balanced accuracy of at least ${T("ln.gate_ba")} and at least ${T("ln.gate_chance")} above class chance, accuracy at least ${T("ln.gate_accuracy")} above majority, balanced accuracy at least ${T("ln.gate_control")} above the analytical control, and non-abstain coverage of at least ${T("ln.gate_coverage")}.` }),
    h("li", { html: `Require ${T("ln.seed_min")} distinct passing neural seeds; choose the model family before audit consumption.` }),
    h("li", { text: "Measure feature/control, inference, exact verification and expected fallback p95 costs on each exact-timing host." }),
    h("li", { text: "Require the candidate to preserve the development speedup threshold and beat the analytical control on every host. Keep production routing out of scope." }),
  ]));
  s.append(h("h3", { text: "Read-only verification entry points" }));
  s.append(evidenceTable(["Saved environment", "Rows/check", "Role", "Boundary"], E.hosts.map(host => [
    host.label, T(`ln.${host.prefix}_rows`), "independently verified q64 timed cells", "Absolute timings stay within this host; only task-matched interpretations cross hosts",
  ]).concat([["Source-blind freeze", "byte-identical cohort replay", "independent verification", "No exact execution, timing, labels, models, prospective data or cloud resources"]]), "Saved verification environments"));
  s.append(h("pre", {}, [h("code", { text: ".venv\\Scripts\\python.exe scripts\\crse_query_ladder_learning_freeze_verify.py --artifact docs\\recognition\\runs\\query-ladder-source-blind-learning-freeze-20260904-001\n.venv\\Scripts\\python.exe scripts\\cm_query_ladder_decision_surface.py --evidence <verified-q64-blocks.json> --freeze docs\\recognition\\runs\\query-ladder-source-blind-learning-freeze-20260904-001\\FREEZE.json\n.venv\\Scripts\\python.exe scripts\\cm_memory_learning_evidence.py --measurements <verified-memory.json> --neural-protocol <frozen-neural-protocol.json> --neural-predictions <seed-11.json> <seed-23.json> <seed-47.json>\n.venv\\Scripts\\python.exe scripts\\crse_audit_h6_freeze_portability.py\n.venv\\Scripts\\python.exe -m pytest tests\\test_query_ladder_decision_surface.py tests\\test_memory_learning_evidence.py tests\\test_h6_freeze_portability.py" })]));
  const links = h("ul", { class: "benchmark-source-list" });
  E.links.forEach(item => links.append(h("li", {}, [h("a", { href: item.href, text: item.label })])));
  s.append(links); app.append(s);
}

[
  "dashboard", "status", "tasks", "economics", "exact-controls", "quality",
  "timeline", "representations", "provenance", "certificate", "next-work",
].forEach(id => app.append(document.getElementById(id)));
app.append(pageFooter("Learning evidence is development-only. No model was trained by this website build, and no learned advice is enabled.", true));
if (location.hash) {
  const initialTarget = document.getElementById(location.hash.slice(1));
  if (initialTarget) requestAnimationFrame(() => initialTarget.scrollIntoView());
}
}
