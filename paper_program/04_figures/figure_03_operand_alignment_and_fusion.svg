<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Operand-aligned fusion of Correspondence Matrix operators</title>
  <desc id="desc">Two implication operators begin with reversed signed operands. The second operator is transposed to the common ordered frame X and not Y. The aligned operators are then combined entrywise by XOR, producing the XOR correspondence matrix and one compact equivalent expression.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#30343b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0072b2"/>
    </marker>
    <style>
      .title { font: 500 29px Arial, sans-serif; fill: #17191d; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #4d535c; }
      .step { font: 600 14px Arial, sans-serif; letter-spacing: 1.2px; fill: #686e78; }
      .node-title { font: 500 22px Arial, sans-serif; fill: #17191d; }
      .formula { font: 500 21px "Cambria Math", "STIX Two Math", "Times New Roman", serif; fill: #17191d; }
      .formula-sm { font: 500 15px "Cambria Math", "STIX Two Math", "Times New Roman", serif; fill: #17191d; }
      .matrix { font: 500 19px "Cambria Math", "STIX Two Math", "Times New Roman", serif; fill: #17191d; }
      .body { font: 400 16px Arial, sans-serif; fill: #30343b; }
      .small { font: 400 14px Arial, sans-serif; fill: #4d535c; }
      .edge-label { font: 500 14px Arial, sans-serif; fill: #30343b; }
      .node { stroke: #636a75; stroke-width: 1.4; rx: 13; }
      .divider { stroke: #a8adb5; stroke-width: 1; }
      .edge { fill: none; stroke: #30343b; stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-blue { fill: none; stroke: #0072b2; stroke-width: 2.6; marker-end: url(#arrow-blue); }
      .bracket { fill: none; stroke: #24272c; stroke-width: 2; }
      .matrix-cell { fill: #ffffff; stroke: #8b9099; stroke-width: 1; }
      .highlight { fill: #cbeaf8; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="650" fill="#ffffff"/>
  <text x="700" y="48" text-anchor="middle" class="title">Operand-aligned fusion acts directly on Boolean operators</text>
  <text x="700" y="78" text-anchor="middle" class="subtitle">First normalize both CMs to one signed operand frame; only then combine entries with the outer connective.</text>

  <text x="195" y="122" text-anchor="middle" class="step">1 · TWO FRAMES</text>
  <text x="564" y="122" text-anchor="middle" class="step">2 · APPLY RULE 1</text>
  <text x="920" y="122" text-anchor="middle" class="step">3 · FUSE ENTRYWISE</text>
  <text x="1245" y="122" text-anchor="middle" class="step">4 · USE ONE OPERATOR</text>

  <rect class="node" x="28" y="146" width="334" height="350" fill="#efe7f6"/>
  <text x="195" y="184" text-anchor="middle" class="node-title">Original subexpressions</text>
  <line class="divider" x1="52" y1="201" x2="338" y2="201"/>
  <text x="195" y="245" text-anchor="middle" class="formula">𝓛<tspan baseline-shift="sub" font-size="14">1</tspan> = X ⇒ ¬Y</text>
  <text x="195" y="277" text-anchor="middle" class="small">operator [⇒], frame (X, ¬Y)</text>
  <line class="divider" x1="70" y1="311" x2="320" y2="311"/>
  <text x="195" y="357" text-anchor="middle" class="formula">𝓛<tspan baseline-shift="sub" font-size="14">2</tspan> = ¬Y ⇒ X</text>
  <text x="195" y="389" text-anchor="middle" class="small">operator [⇒], frame (¬Y, X)</text>
  <text x="195" y="445" text-anchor="middle" class="body">Target expression: 𝓛<tspan baseline-shift="sub" font-size="11">1</tspan> ⇕ 𝓛<tspan baseline-shift="sub" font-size="11">2</tspan></text>
  <text x="195" y="472" text-anchor="middle" class="small">frames differ, so fusion is not yet typed</text>

  <rect class="node" x="428" y="146" width="272" height="350" fill="#dceef8"/>
  <text x="564" y="184" text-anchor="middle" class="node-title">Common frame</text>
  <line class="divider" x1="452" y1="201" x2="676" y2="201"/>
  <text x="564" y="228" text-anchor="middle" class="small">Rule 1: operand swap transposes the CM</text>
  <text x="564" y="259" text-anchor="middle" class="formula-sm">⟨Y|[Θ]|X⟩ = ⟨X|[Θ]<tspan baseline-shift="super" font-size="12">T</tspan>|Y⟩</text>
  <text x="564" y="286" text-anchor="middle" class="small">transpose operator; scalar unchanged</text>
  <line class="divider" x1="470" y1="305" x2="658" y2="305"/>
  <text x="564" y="338" text-anchor="middle" class="formula">𝓛<tspan baseline-shift="sub" font-size="14">1</tspan> = ⟨X|[⇒]|¬Y⟩</text>
  <text x="564" y="366" text-anchor="middle" class="small">unchanged</text>
  <text x="564" y="402" text-anchor="middle" class="formula">𝓛<tspan baseline-shift="sub" font-size="14">2</tspan> = ⟨¬Y|[⇒]|X⟩</text>
  <text x="564" y="438" text-anchor="middle" class="formula">= ⟨X|[⇒]<tspan baseline-shift="super" font-size="14">T</tspan>|¬Y⟩</text>
  <text x="564" y="473" text-anchor="middle" class="body">both now use (row X, column ¬Y)</text>

  <rect class="node" x="766" y="146" width="349" height="350" fill="#e5f3e6"/>
  <text x="920" y="184" text-anchor="middle" class="node-title">Operator fusion</text>
  <line class="divider" x1="790" y1="201" x2="1091" y2="201"/>
  <text x="920" y="239" text-anchor="middle" class="formula">[⇒] ⇕ [⇒]<tspan baseline-shift="super" font-size="14">T</tspan></text>

  <g transform="translate(801 266)">
    <rect class="matrix-cell" x="0" y="0" width="38" height="38"/><rect class="matrix-cell" x="38" y="0" width="38" height="38"/>
    <rect class="matrix-cell" x="0" y="38" width="38" height="38"/><rect class="matrix-cell" x="38" y="38" width="38" height="38"/>
    <text x="19" y="26" text-anchor="middle" class="matrix">1</text><text x="57" y="26" text-anchor="middle" class="matrix">0</text>
    <text x="19" y="64" text-anchor="middle" class="matrix">1</text><text x="57" y="64" text-anchor="middle" class="matrix">1</text>
  </g>
  <text x="895" y="313" text-anchor="middle" class="formula">⇕</text>
  <g transform="translate(913 266)">
    <rect class="matrix-cell" x="0" y="0" width="38" height="38"/><rect class="matrix-cell" x="38" y="0" width="38" height="38"/>
    <rect class="matrix-cell" x="0" y="38" width="38" height="38"/><rect class="matrix-cell" x="38" y="38" width="38" height="38"/>
    <text x="19" y="26" text-anchor="middle" class="matrix">1</text><text x="57" y="26" text-anchor="middle" class="matrix">1</text>
    <text x="19" y="64" text-anchor="middle" class="matrix">0</text><text x="57" y="64" text-anchor="middle" class="matrix">1</text>
  </g>
  <text x="1009" y="313" text-anchor="middle" class="formula">=</text>
  <g transform="translate(1025 266)">
    <rect class="matrix-cell highlight" x="0" y="0" width="38" height="38"/><rect class="matrix-cell highlight" x="38" y="0" width="38" height="38"/>
    <rect class="matrix-cell highlight" x="0" y="38" width="38" height="38"/><rect class="matrix-cell highlight" x="38" y="38" width="38" height="38"/>
    <text x="19" y="26" text-anchor="middle" class="matrix">0</text><text x="57" y="26" text-anchor="middle" class="matrix">1</text>
    <text x="19" y="64" text-anchor="middle" class="matrix">1</text><text x="57" y="64" text-anchor="middle" class="matrix">0</text>
  </g>
  <text x="920" y="385" text-anchor="middle" class="formula">= [⇕]</text>
  <text x="920" y="423" text-anchor="middle" class="small">each output bit is XOR-reduced</text>
  <text x="920" y="452" text-anchor="middle" class="small">no arithmetic matrix product is used</text>

  <rect class="node" x="1140" y="146" width="232" height="350" fill="#fff1d8"/>
  <text x="1256" y="184" text-anchor="middle" class="node-title">Fused result</text>
  <line class="divider" x1="1164" y1="201" x2="1348" y2="201"/>
  <text x="1256" y="253" text-anchor="middle" class="formula">⟨X|[⇕]|¬Y⟩</text>
  <text x="1256" y="296" text-anchor="middle" class="body">replaces</text>
  <text x="1256" y="333" text-anchor="middle" class="formula">(X ⇒ ¬Y)</text>
  <text x="1256" y="365" text-anchor="middle" class="formula">⇕ (¬Y ⇒ X)</text>
  <text x="1256" y="414" text-anchor="middle" class="small">same Boolean function</text>
  <text x="1256" y="441" text-anchor="middle" class="small">in one declared frame</text>

  <path class="edge" d="M362,321 L428,321"/>
  <text x="395" y="300" text-anchor="middle" class="edge-label">swap 𝓛<tspan baseline-shift="sub" font-size="10">2</tspan></text>
  <path class="edge-blue" d="M700,321 L766,321"/>
  <text x="733" y="300" text-anchor="middle" class="edge-label">frames match</text>
  <path class="edge-blue" d="M1115,321 L1140,321"/>

  <line x1="28" y1="548" x2="1372" y2="548" stroke="#a8adb5" stroke-width="1"/>
  <text x="700" y="581" text-anchor="middle" class="body">Soundness condition: variables, row/column order, polarity, and truth-state order must agree before entrywise fusion.</text>
  <text x="700" y="610" text-anchor="middle" class="small">If the compiler cannot establish that common frame, it must keep the CMs separate or use an explicitly verified retabulation path.</text>
</svg>
